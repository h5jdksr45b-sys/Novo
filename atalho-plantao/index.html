  if (erroNuvem) return `<div class="login"><div class="login-card"><h1>Sem conexão</h1><p class="finding">${esc(erroNuvem)}</p><button type="button" class="btn btn-primary" data-act="recarregar">Tentar de novo</button></div></div>`;
  return `<div class="title-row"><div><h1>Seu dinheiro</h1><span class="skel" style="width:260px;height:20px"></span></div></div>
    <section class="money" aria-label="Carregando"><div class="hero"><div class="lead"><span class="eyebrow">A receber</span><span class="skel" style="width:220px;height:42px;background:var(--hero-line)"></span></div></div>
    <div class="tiles"><div class="tile t-zero"><span class="eyebrow">Recebido no mês</span><span class="skel" style="width:120px;height:26px"></span></div><div class="tile t-zero"><span class="eyebrow">Atrasado</span><span class="skel" style="width:120px;height:26px"></span></div></div></section>`;
}

const VIEWS = { inicio: vInicio, plantoes: vPlantoes, agenda: vAgenda, ajustes: vAjustes };
const tabAtual = () => { const h = location.hash.slice(1); return VIEWS[h] ? h : 'inicio'; };

function navs(t) {
  $('#sideNav').innerHTML = TABS.map(x => `<a href="#${x.id}" ${x.id === t ? 'aria-current="page"' : ''}>${I[x.id]}${x.nome}</a>`).join('');
  const tab = x => `<a class="tab" href="#${x.id}" ${x.id === t ? 'aria-current="page"' : ''}>${I[x.id]}${x.nome}</a>`;
  $('#tabbar').innerHTML = tab(TABS[0]) + tab(TABS[1])
    + `<button type="button" class="tab tab-cta" data-act="lancar"><span class="plus">${I.plus}</span>Lançar</button>`
    + tab(TABS[2]) + tab(TABS[3]);
  $('#sideFoot').innerHTML = NUVEM && conta
    ? `<b>${esc(conta.email || '')}</b><span class="sync${estadoSync === 'ok' ? '' : ' pend'}"><i></i>${estadoSync === 'ok' ? 'Tudo salvo na sua conta' : 'Esperando internet'}</span>`
    : '<span>Dados salvos neste aparelho.</span>';
}

function render() {
  const semConta = NUVEM && (!conta || !db);
  document.body.classList.toggle('sem-conta', semConta);
  if (NUVEM && !conta) { $('#view').innerHTML = carregando || erroNuvem ? vCarregando() : vLogin(); ligarLogin(); return; }
  if (!db) { $('#view').innerHTML = vCarregando(); return; }
  const t = tabAtual();
  $('#view').innerHTML = VIEWS[t]();
  navs(t);
  $('#topDate').textContent = dataCurta();
  const nome = $('#nome');
  if (nome) nome.addEventListener('input', () => { db.nome = nome.value; save(); });
}

let refreshSheet = null;
function commit() { save(); render(); if (refreshSheet && sheet.open) refreshSheet(); }

/* ---------- folha ---------- */
const sheet = $('#sheet');
function abrir(titulo, corpo, onMount, refresh) {
  sheet.innerHTML = `<div class="grab" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="sheetTitle">${titulo}</h2>
    <button type="button" class="close" data-act="fechar" aria-label="Fechar">${I.close}</button></div>
    <div class="sheet-body">${corpo}</div>`;
  refreshSheet = refresh || null;
  if (!sheet.open) sheet.showModal();
  if (onMount) onMount(sheet);
}
function fechar() { refreshSheet = null; if (sheet.open) sheet.close(); }
sheet.addEventListener('click', e => { if (e.target === sheet) fechar(); });
sheet.addEventListener('close', () => { refreshSheet = null; if (tourAberto) { tourAberto = false; lsSet('tour', 'feito'); } });

function confirmar({ titulo, texto, ok, perigo, onOk, voltar }) {
  abrir(esc(titulo), `<p style="font-size:16px">${esc(texto)}</p>
    <div class="stack">
      <button type="button" class="btn btn-block ${perigo ? 'btn-danger' : 'btn-dark'}" id="cOk">${esc(ok)}</button>
      <button type="button" class="btn btn-ghost btn-block" id="cNo">Cancelar</button>
    </div>`, s => {
    s.querySelector('#cOk').onclick = () => { onOk(); };
    s.querySelector('#cNo').onclick = () => { voltar ? voltar() : fechar(); };
  });
}

/* ---------- instalar na tela do celular ---------- */
let pedidoInstalar = null;
const instalado = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ehIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedidoInstalar = e; if (tabAtual() === 'ajustes') render(); });
window.addEventListener('appinstalled', () => { pedidoInstalar = null; toast('App instalado. O ícone está na tela do celular.'); render(); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.claude) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

function blocoInstalar() {
  let corpo;
  if (instalado()) corpo = '<p class="note">O app já está instalado neste aparelho.</p>';
  else if (pedidoInstalar) corpo = '<button type="button" class="btn btn-primary" data-act="instalar">Instalar o app</button>';
  else if (ehIOS()) corpo = `<ol class="tour-steps">
      <li><b>1</b><span><strong>Abra no Safari</strong><small>No Chrome do iPhone o atalho não aparece.</small></span></li>
      <li><b>2</b><span><strong>Toque em Compartilhar</strong><small>O quadrado com a seta para cima, na barra de baixo.</small></span></li>
      <li><b>3</b><span><strong>Adicionar à Tela de Início</strong><small>Confirme em Adicionar. O ícone do Atalho aparece com os outros apps.</small></span></li>
    </ol>`;
  else corpo = `<p class="note">No Android, abra no Chrome, toque nos três pontinhos e em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>. No iPhone, abra no Safari, toque em Compartilhar e em <b>Adicionar à Tela de Início</b>.</p>`;
  return `<div class="set">
    <div class="set-label"><h2>Instalar no celular</h2><p>O ícone fica na tela inicial e o app abre em tela cheia, como os outros.</p></div>
    <div class="panel">${corpo}</div>
  </div>`;
}

/* ---------- passo a passo inicial ---------- */
const lsKey = n => `atalho-plantao:${n}${conta ? ':' + conta.id : ''}`;
const lsGet = n => { try { return localStorage.getItem(lsKey(n)); } catch (e) { return null; } };
const lsSet = (n, v) => { try { localStorage.setItem(lsKey(n), v); } catch (e) { /* sem armazenamento */ } };
let tourAberto = false;

function talvezIniciar() {
  if (tourAberto || !db || lsGet('tour') === 'feito' || sheet.open) return;
  iniciar();
}

function cardPrimeirosPassos() {
  if (lsGet('dicas') === 'nao') return '';
  const feitos = [
    db.locais.some(l => !l.exemplo),
    db.plantoes.some(p => !p.exemplo),
    db.plantoes.some(p => !p.exemplo && p.pagamentos.length)
  ];
  const n = feitos.filter(Boolean).length;
  if (n === 3) return '';
  const itens = [
    ['Cadastre um local de trabalho', 'Hospital ou empresa, valor do plantão e prazo.', 'novo-local'],
    ['Lance seu primeiro plantão', 'Local, data e turno. Três toques.', 'lancar'],
    ['Marque um pagamento recebido', 'Abra o plantão e toque em Recebi.', 'ir-plantoes']
  ];
  return `<section class="card" aria-labelledby="hPassos">
    <div class="card-head"><h2 id="hPassos">Primeiros passos</h2><span class="meta">${n} de 3</span></div>
    <div class="prog" aria-hidden="true"><i style="width:${Math.round(n / 3 * 100)}%"></i></div>
    <ul class="rows">${itens.map(([t, sub, act], i) => `<li><button type="button" class="passo${feitos[i] ? ' feito' : ''}" data-act="${act}" ${feitos[i] ? 'disabled' : ''}>
      <span class="check">${feitos[i] ? I.check : ''}</span>
      <span class="plt-info"><strong>${t}</strong><small>${feitos[i] ? 'Feito' : sub}</small></span>
    </button></li>`).join('')}</ul>
    <div class="card-foot passos-foot"><button type="button" class="btn btn-text" data-act="iniciar">Passo a passo guiado</button><button type="button" class="btn btn-text" data-act="dispensar-dicas">Dispensar</button></div>
  </section>`;
}

function iniciar() {
  const t = { passo: 0, nome: db.nome || '', localId: null, plantaoId: null, forma: 'PJ', data: hoje(), turno: '12h', horas: '', valor: 0, editado: false };
  tourAberto = true;
  const fim = () => { lsSet('tour', 'feito'); tourAberto = false; fechar(); render(); };
  const pontos = n => `<div class="dots-prog" aria-label="Passo ${n} de 4">${[1, 2, 3, 4].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>`;
  const chips = (attr, lista, sel, rotulo) => `<div class="chips wrap" role="group" aria-label="${rotulo}">${lista.map(([v, nome]) => `<button type="button" class="chip" ${attr}="${v}" aria-pressed="${String(v) === String(sel)}">${nome}</button>`).join('')}</div>`;
  const montar = () => {
    let titulo = '', corpo = '';
    const T = hoje(), ontem = addDias(T, -1);
    if (t.passo === 0) {
      titulo = 'Bem-vindo';
      corpo = `<p class="tour-lead">Em três passos você já sabe quanto tem a receber.</p>
        <ol class="tour-steps">
          <li><b>1</b><span><strong>Cadastre um local</strong><small>Hospital ou empresa, valor do plantão e prazo de pagamento.</small></span></li>
          <li><b>2</b><span><strong>Lance um plantão</strong><small>Três toques. O vencimento sai sozinho.</small></span></li>
          <li><b>3</b><span><strong>Marque quando receber</strong><small>O que passar do prazo fica em vermelho, com os dias de atraso.</small></span></li>
        </ol>
        <div class="stack"><button type="button" class="btn btn-primary btn-block" id="tOk">Começar</button>
        <button type="button" class="btn btn-ghost btn-block" id="tSkip">Ver com os exemplos primeiro</button></div>`;
    } else if (t.passo === 1) {
      titulo = 'Como você assina';
      corpo = `${pontos(1)}<p class="note">Aparece no começo das mensagens de cobrança. Pode deixar em branco.</p>
        <div class="field"><label for="tNome">Seu nome</label><input class="input" id="tNome" type="text" maxlength="80" autocomplete="name" placeholder="Ex.: Dra. Ana Souza" value="${esc(t.nome)}"></div>
        <div class="stack"><button type="button" class="btn btn-primary btn-block" id="tOk">Continuar</button>
        <button type="button" class="btn btn-text btn-block" id="tSkip">Pular</button></div>`;
    } else if (t.passo === 2) {
      titulo = 'Seu primeiro local';
      corpo = `${pontos(2)}<p class="note">Onde você dá plantão. Outros locais entram depois, em Ajustes.</p>
        <div class="field"><label for="tLocal">Nome do hospital ou empresa</label><input class="input" id="tLocal" type="text" maxlength="60" placeholder="Ex.: Hospital Municipal"></div>
        <div class="field"><label for="tValor">Valor do plantão de 12h (R$)</label><input class="input input-money" id="tValor" inputmode="decimal" placeholder="Ex.: 1500"></div>
        <div class="field"><span class="flabel">Paga em quantos dias</span>${chips('data-t-prazo', [[15, '15 dias'], [30, '30 dias'], [45, '45 dias'], [60, '60 dias'], [90, '90 dias']], 30, 'Prazo')}
          <input class="input" id="tPrazo" type="number" inputmode="numeric" min="0" max="365" value="30" aria-label="Prazo em dias"></div>
        <div class="field"><span class="flabel">Forma de pagamento</span>${chips('data-t-forma', FORMAS.map(f => [f, f]), t.forma, 'Forma de pagamento')}</div>
        <p class="err" id="tErr" hidden></p>
        <div class="stack"><button type="button" class="btn btn-primary btn-block" id="tOk">Salvar local</button>
        <button type="button" class="btn btn-text btn-block" id="tSkip">Pular</button></div>`;
    } else if (t.passo === 3) {
      const l = local(t.localId);
      titulo = 'Seu primeiro plantão';
      const qd = t.data === T ? 'hoje' : t.data === ontem ? 'ontem' : 'outra';
      corpo = `${pontos(3)}<p class="note">Em ${esc(l.nome)}. O valor já vem preenchido; mude se precisar.</p>
        <div class="field"><span class="flabel">Data</span>${chips('data-t-data', [['hoje', `Hoje, ${fmtData(T).slice(0, 5)}`], ['ontem', `Ontem, ${fmtData(ontem).slice(0, 5)}`], ['outra', 'Outra data']], qd, 'Data')}
          <input class="input" type="date" id="tData" value="${t.data}" aria-label="Data do plantão" ${qd === 'outra' ? '' : 'hidden'}></div>
        <div class="field"><span class="flabel">Turno</span>${chips('data-t-turno', [['12h', '12h'], ['24h', '24h'], ['outro', 'Outro']], t.turno, 'Turno')}
          <input class="input" type="number" inputmode="numeric" min="1" max="48" id="tHoras" placeholder="Quantas horas? Ex.: 6" value="${esc(t.horas)}" aria-label="Horas do turno" ${t.turno === 'outro' ? '' : 'hidden'}></div>
        <div class="field"><label for="tPValor">Valor (R$)</label><input class="input input-money" id="tPValor" inputmode="decimal" value="${valorInput(t.valor)}"></div>
        <p class="preview" id="tPrev"></p>
        <p class="err" id="tErr" hidden></p>
        <div class="stack"><button type="button" class="btn btn-primary btn-block" id="tOk">Lançar plantão</button>
        <button type="button" class="btn btn-text btn-block" id="tSkip">Pular</button></div>`;
    } else {
      titulo = 'Pronto';
      const p = t.plantaoId ? db.plantoes.find(x => x.id === t.plantaoId) : null;
      const l = local(t.localId);
      const texto = p ? `Seu plantão em ${esc(l.nome)} vence em <b>${fmtData(p.venc)}</b>. Quando o dinheiro cair, abra o plantão e toque em Recebi.`
        : l ? `${esc(l.nome)} está cadastrado. Para registrar um plantão, toque em Lançar na barra de baixo.`
        : 'Quando quiser, cadastre seus locais em Ajustes e toque em Lançar para registrar um plantão.';
      corpo = `${pontos(4)}<p class="tour-lead">${texto}</p>
        ${temExemplos() && l ? `<p class="note">Os hospitais de exemplo continuam na tela. Quer apagar e ficar só com o seu?</p>
          <div class="stack"><button type="button" class="btn btn-primary btn-block" id="tLimpar">Apagar exemplos e começar</button>
          <button type="button" class="btn btn-ghost btn-block" id="tOk">Manter exemplos por enquanto</button></div>`
        : '<button type="button" class="btn btn-primary btn-block" id="tOk">Ir para o app</button>'}`;
    }
    abrir(titulo, corpo, sh => {
      const q = x => sh.querySelector(x);
      const marcar = (attr, val) => sh.querySelectorAll(`[${attr}]`).forEach(b => b.setAttribute('aria-pressed', String(b.getAttribute(attr) === String(val))));
      const erro = m => { const e = q('#tErr'); e.textContent = m; e.hidden = false; };
      if (q('#tSkip')) q('#tSkip').onclick = () => { if (t.passo === 0) fim(); else { t.passo = t.passo === 2 ? 4 : t.passo + 1; montar(); } };
      if (t.passo === 0) q('#tOk').onclick = () => { t.passo = 1; montar(); };
      if (t.passo === 1) q('#tOk').onclick = () => {
        t.nome = q('#tNome').value.trim();
        if (t.nome !== (db.nome || '')) { if (!podeEditar()) return; db.nome = t.nome; save(); }
        t.passo = 2; montar();
      };
      if (t.passo === 2) {
        sh.querySelectorAll('[data-t-prazo]').forEach(b => b.onclick = () => { q('#tPrazo').value = b.dataset.tPrazo; marcar('data-t-prazo', b.dataset.tPrazo); });
        q('#tPrazo').oninput = () => marcar('data-t-prazo', q('#tPrazo').value);
        sh.querySelectorAll('[data-t-forma]').forEach(b => b.onclick = () => { t.forma = b.dataset.tForma; marcar('data-t-forma', t.forma); });
        q('#tOk').onclick = () => {
          const nome = q('#tLocal').value.trim(), valor = parseValor(q('#tValor').value), prazo = parseInt(q('#tPrazo').value, 10);
          if (!nome) return erro('Digite o nome do local.');
          if (!(valor > 0)) return erro('Digite o valor do plantão. Ex.: 1500');
          if (!(prazo >= 0 && prazo <= 365)) return erro('Digite o prazo em dias, de 0 a 365. Ex.: 30');
          if (!podeEditar()) return;
          const novo = { id: uid(), nome, valor, prazo, forma: t.forma, exemplo: false };
          db.locais.push(novo); db.ultimoLocal = novo.id; t.localId = novo.id;
          t.valor = valorPadrao(novo, t.turno, 0); t.editado = false;
          save(); render(); t.passo = 3; montar();
        };
      }
      if (t.passo === 3) {
        const l = local(t.localId), vIn = q('#tPValor'), dIn = q('#tData'), hIn = q('#tHoras');
        const prev = () => { q('#tPrev').innerHTML = `Vence em <b>${fmtData(addDias(t.data, l.prazo))}</b>. ${esc(l.nome)} paga em ${diasTxt(l.prazo)}, ${esc(l.forma)}.`; };
        const recalc = () => { if (!t.editado) { t.valor = valorPadrao(l, t.turno, Number(t.horas)); vIn.value = valorInput(t.valor); } prev(); };
        sh.querySelectorAll('[data-t-data]').forEach(b => b.onclick = () => {
          const v = b.dataset.tData; marcar('data-t-data', v);
          if (v === 'hoje') t.data = T; else if (v === 'ontem') t.data = ontem;
          dIn.hidden = v !== 'outra'; if (v === 'outra') { dIn.value = t.data; dIn.focus(); }
          prev();
        });
        dIn.onchange = () => { if (dIn.value) { t.data = dIn.value; prev(); } };
        sh.querySelectorAll('[data-t-turno]').forEach(b => b.onclick = () => {
          t.turno = b.dataset.tTurno; marcar('data-t-turno', t.turno);
          hIn.hidden = t.turno !== 'outro'; if (t.turno === 'outro') hIn.focus();
          t.editado = false; recalc();
        });
        hIn.oninput = () => { t.horas = hIn.value; t.editado = false; recalc(); };
        vIn.oninput = () => { t.editado = true; };
        vIn.onfocus = () => vIn.select();
        q('#tOk').onclick = () => {
          const valor = parseValor(vIn.value);
          if (!t.data) return erro('Escolha a data.');
          if (!(valor > 0)) return erro('Digite um valor maior que zero. Ex.: 1500 ou 1.500,00');
          if (!podeEditar()) return;
          const horas = t.turno === 'outro' && Number(t.horas) > 0 ? Math.min(48, Number(t.horas)) : null;
          const novo = { id: uid(), localId: l.id, data: t.data, venc: addDias(t.data, l.prazo), turno: t.turno, horas, valor, obs: '', pagamentos: [], exemplo: false };
          db.plantoes.push(novo); t.plantaoId = novo.id;
          save(); render(); t.passo = 4; montar();
        };
        prev();
      }
      if (t.passo === 4) {
        q('#tOk').onclick = fim;
        if (q('#tLimpar')) q('#tLimpar').onclick = () => {
          const exIds = new Set(db.locais.filter(l => l.exemplo).map(l => l.id));
          db.plantoes = db.plantoes.filter(p => !p.exemplo && !exIds.has(p.localId));
          db.locais = db.locais.filter(l => !l.exemplo);
          if (!local(db.ultimoLocal)) db.ultimoLocal = db.locais[0] ? db.locais[0].id : null;
          ui.local = 'todos'; save(); fim(); toast('Exemplos apagados. O app agora é só seu.');
        };
      }
    });
  };
  montar();
}

/* ---------- listas rápidas ---------- */
function verBalde(i) {
  const b = ultimosBaldes[i];
  if (!b || !b.ps.length) return;
  const ps = b.ps.slice().sort((a, c) => (a.venc < c.venc ? -1 : 1));
  abrir(esc(b.titulo), `<p class="note">${brl(b.v)} em ${plural(ps.length, 'plantão', 'plantões')}. Toque num plantão para abrir.</p>
    <ul class="rows sheet-rows">${ps.map(linhaPlantao).join('')}</ul>`);
}
function verEntradas() {
  const mk = mesKey(hoje());
  const entradas = db.plantoes.flatMap(p => p.pagamentos.filter(x => mesKey(x.data) === mk).map(x => ({ p, data: x.data, valor: x.valor })))
    .sort((a, c) => (a.data < c.data ? 1 : -1));
  abrir(`Recebido em ${esc(mesSo(mk))}`, entradas.length
    ? `<p class="note">${brl(soma(entradas, x => x.valor))} em ${plural(entradas.length, 'pagamento', 'pagamentos')}.</p>
      <ul class="rows sheet-rows">${entradas.map(x => `<li><button type="button" class="plt" data-open="${x.p.id}">
        <span class="plt-day"><b>${x.data.slice(8)}</b><small>${esc(semana(x.data))}</small></span>
        <span class="plt-info"><strong>${esc(nomeLocal(x.p.localId))}</strong><small>plantão de ${fmtData(x.p.data)}</small></span>
        <span class="in-fig">+${brl(x.valor)}</span>
      </button></li>`).join('')}</ul>`
    : `<p class="note">Nenhum pagamento registrado em ${esc(mesSo(mk))} ainda. Quando o dinheiro cair, abra o plantão e toque em Recebi.</p>`);
}

/* ---------- lançar ou editar plantão ---------- */
function formPlantao({ id = null, data = null } = {}) {
  if (!podeEditar()) return;
  if (!db.locais.length) { formLocal(); toast('Cadastre um local antes de lançar o plantão.'); return; }
  const p = id ? db.plantoes.find(x => x.id === id) : null;
  const T = hoje(), ontem = addDias(T, -1);
  const f = p ? { localId: p.localId, data: p.data, turno: p.turno, horas: p.horas || '', valor: p.valor, editado: true, obs: p.obs }
    : { localId: local(db.ultimoLocal) ? db.ultimoLocal : db.locais[0].id, data: data || T, turno: '12h', horas: '', valor: 0, editado: false, obs: '' };
  if (!p) f.valor = valorPadrao(local(f.localId), f.turno, f.horas);
  const qualData = f.data === T ? 'hoje' : f.data === ontem ? 'ontem' : 'outra';

  const corpo = `
    <div class="field"><span class="flabel" id="lbLocal">Local</span>
      <div class="chips wrap" role="group" aria-labelledby="lbLocal">
        ${db.locais.map(l => `<button type="button" class="chip" data-f-local="${l.id}" aria-pressed="${f.localId === l.id}">${esc(l.nome)}</button>`).join('')}
      </div></div>
    <div class="field"><span class="flabel" id="lbData">Data</span>
      <div class="chips wrap" role="group" aria-labelledby="lbData">
        <button type="button" class="chip" data-f-data="hoje" aria-pressed="${qualData === 'hoje'}">Hoje, ${fmtData(T).slice(0, 5)}</button>
        <button type="button" class="chip" data-f-data="ontem" aria-pressed="${qualData === 'ontem'}">Ontem, ${fmtData(ontem).slice(0, 5)}</button>
        <button type="button" class="chip" data-f-data="outra" aria-pressed="${qualData === 'outra'}">Outra data</button>
      </div>
      <input class="input" type="date" id="fData" value="${f.data}" aria-label="Data do plantão" ${qualData === 'outra' ? '' : 'hidden'}>
    </div>
    <div class="field"><span class="flabel" id="lbTurno">Turno</span>
      <div class="chips wrap" role="group" aria-labelledby="lbTurno">
        ${['12h', '24h', 'outro'].map(t => `<button type="button" class="chip" data-f-turno="${t}" aria-pressed="${f.turno === t}">${t === 'outro' ? 'Outro' : t}</button>`).join('')}
      </div>
      <input class="input" type="number" inputmode="numeric" min="1" max="48" id="fHoras" placeholder="Quantas horas? Ex.: 6" value="${esc(f.horas)}" aria-label="Horas do turno" ${f.turno === 'outro' ? '' : 'hidden'}>
    </div>
    <div class="field"><label for="fValor">Valor (R$)</label>
      <input class="input input-money" id="fValor" inputmode="decimal" autocomplete="off" value="${valorInput(f.valor)}">
    </div>
    <div class="field"><label for="fObs">Observação <span class="hint">(opcional)</span></label>
      <input class="input" id="fObs" type="text" maxlength="140" placeholder="Ex.: troca com colega" value="${esc(f.obs)}">
      <span class="hint">Não escreva nome nem dado de paciente.</span>
    </div>
    <p class="preview" id="fPrev"></p>
    <p class="err" id="fErr" hidden></p>
    <button type="button" class="btn btn-primary btn-block" id="fSalvar">${p ? 'Salvar alterações' : 'Salvar plantão'}</button>`;

  abrir(p ? 'Editar plantão' : 'Lançar plantão', corpo, s => {
    const vIn = s.querySelector('#fValor'), dIn = s.querySelector('#fData'), hIn = s.querySelector('#fHoras');
    const prev = () => {
      const l = local(f.localId);
      s.querySelector('#fPrev').innerHTML = l
        ? `Vence em <b>${fmtData(addDias(f.data, l.prazo))}</b>. ${esc(l.nome)} paga em ${diasTxt(l.prazo)}, ${esc(l.forma)}.`
        : '';
    };
    const recalc = () => { if (!f.editado) { f.valor = valorPadrao(local(f.localId), f.turno, Number(f.horas)); vIn.value = valorInput(f.valor); } prev(); };
    const marcar = (attr, val) => s.querySelectorAll(`[${attr}]`).forEach(b => b.setAttribute('aria-pressed', String(b.getAttribute(attr) === val)));
    s.querySelectorAll('[data-f-local]').forEach(b => b.onclick = () => { f.localId = b.dataset.fLocal; marcar('data-f-local', f.localId); f.editado = false; recalc(); });
    s.querySelectorAll('[data-f-data]').forEach(b => b.onclick = () => {
      const v = b.dataset.fData; marcar('data-f-data', v);
      if (v === 'hoje') f.data = T; else if (v === 'ontem') f.data = ontem;
      dIn.hidden = v !== 'outra'; if (v === 'outra') { dIn.value = f.data; dIn.focus(); }
      prev();
    });
    dIn.onchange = () => { if (dIn.value) { f.data = dIn.value; prev(); } };
    s.querySelectorAll('[data-f-turno]').forEach(b => b.onclick = () => {
      f.turno = b.dataset.fTurno; marcar('data-f-turno', f.turno);
      hIn.hidden = f.turno !== 'outro'; if (f.turno === 'outro') hIn.focus();
      f.editado = false; recalc();
    });
    hIn.oninput = () => { f.horas = hIn.value; f.editado = false; recalc(); };
    vIn.oninput = () => { f.editado = true; };
    vIn.onfocus = () => vIn.select();
    s.querySelector('#fSalvar').onclick = () => {
      const err = s.querySelector('#fErr');
      const valor = parseValor(vIn.value);
      const l = local(f.localId);
      const problema = !l ? 'Escolha o local.' : !f.data ? 'Escolha a data.' : !(valor > 0) ? 'Digite um valor maior que zero. Ex.: 1500 ou 1.500,00' : '';
      if (problema) { err.textContent = problema; err.hidden = false; return; }
      const horas = f.turno === 'outro' && Number(f.horas) > 0 ? Math.min(48, Number(f.horas)) : null;
      const dados = { localId: l.id, data: f.data, venc: addDias(f.data, l.prazo), turno: f.turno, horas, valor, obs: s.querySelector('#fObs').value.trim() };
      if (p) { Object.assign(p, dados); if (recebido(p) > p.valor) p.pagamentos = [{ data: ultimoPgto(p), valor: p.valor }]; }
      else db.plantoes.push({ id: uid(), ...dados, pagamentos: [], exemplo: false });
      db.ultimoLocal = l.id;
      fechar(); commit();
      toast(p ? 'Plantão atualizado.' : `Plantão lançado. Vence em ${fmtData(dados.venc)}.`);
    };
    prev();
  });
}

/* ---------- detalhe do plantão ---------- */

  const montar = () => {

    if (!p) { fechar(); return; }
    const s = status(p), l = local(p.localId);
    const corpo = `
      <div class="lead">
        <span class="card-label">${s === 'pago' ? 'Recebido' : 'Falta receber'}</span>

        <div style="margin-top:6px">${pill(p)}</div>
      </div>
      <dl class="well">
        <div><dt>Data</dt><dd>${fmtData(p.data)}</dd></div>
        <div><dt>Turno</dt><dd>${esc(turnoTxt(p))}</dd></div>
        <div><dt>Valor do plantão</dt><dd>${brl(p.valor)}</dd></div>
        <div><dt>Já entrou</dt><dd>${p.pagamentos.length ? `${brl(recebido(p))} em ${p.pagamentos.map(x => fmtData(x.data)).join(', ')}` : brl(0)}</dd></div>
        <div><dt>Vencimento</dt><dd${s === 'atrasado' ? ' class="red"' : ''}>${fmtData(p.venc)}${s === 'atrasado' ? `, ${diasTxt(atraso(p))} de atraso` : ''}</dd></div>
        <div><dt>Forma</dt><dd>${esc(l ? l.forma : '')}</dd></div>
        ${p.obs ? `<div><dt>Observação</dt><dd>${esc(p.obs)}</dd></div>` : ''}
      </dl>
      ${s !== 'pago' ? `
      <div class="stack">
        <button type="button" class="btn btn-primary btn-block" id="dTotal">${I.check} Recebi tudo, ${brl(aberto(p))}</button>
        <div class="btn-row">
          <button type="button" class="btn btn-ghost" id="dParte">Recebi uma parte</button>
          <button type="button" class="btn btn-ghost" data-cobrar="${p.id}">${I.copy} Copiar cobrança</button>
        </div>
      </div>
      <div class="panel" id="dParteForm" hidden>
        <div class="field"><label for="pValor">Quanto entrou (R$)</label>
          <input class="input input-money" id="pValor" inputmode="decimal" placeholder="Ex.: 600"></div>
        <div class="field"><label for="pData">Quando</label>
          <input class="input" id="pData" type="date" value="${hoje()}"></div>
        <p class="err" id="pErr" hidden></p>
        <button type="button" class="btn btn-primary btn-block" id="pSalvar">Salvar pagamento</button>
      </div>` : '<button type="button" class="btn btn-ghost btn-block" id="dDesfazer">Desfazer pagamento</button>'}
      <div class="danger-zone">
        <button type="button" class="btn btn-text" id="dEditar">Editar plantão</button>
        <button type="button" class="btn btn-text" id="dApagar" style="color:var(--red-ink)">Apagar plantão</button>
      </div>`;
    abrir(esc(nomeLocal(p.localId)), corpo, sh => {
      const q = sel => sh.querySelector(sel);
      if (q('#dTotal')) q('#dTotal').onclick = () => pagarTudo(p.id);
      if (q('#dParte')) q('#dParte').onclick = () => { if (!podeEditar()) return; q('#dParteForm').hidden = false; q('#pValor').focus(); };
      if (q('#pSalvar')) q('#pSalvar').onclick = () => {
        const v = parseValor(q('#pValor').value), d = q('#pData').value;
        const e = q('#pErr');
        if (!(v > 0)) { e.textContent = 'Digite quanto entrou. Ex.: 600'; e.hidden = false; return; }
        if (!d) { e.textContent = 'Escolha a data do pagamento.'; e.hidden = false; return; }
        p.pagamentos.push({ data: d, valor: Math.min(v, aberto(p)) });
        commit();
        toast(status(p) === 'pago' ? 'Plantão quitado.' : `Pagamento registrado. Faltam ${brl(aberto(p))}.`);
      };
      if (q('#dDesfazer')) q('#dDesfazer').onclick = () => {
        if (!podeEditar()) return;
        const antes = p.pagamentos.slice(); p.pagamentos = []; commit();
        toast('Pagamento desfeito.', { label: 'Voltar', fn: () => { p.pagamentos = antes; commit(); } });
      };
      q('#dEditar').onclick = () => formPlantao({ id: p.id });
      q('#dApagar').onclick = () => confirmar({
        titulo: 'Apagar este plantão?', texto: `${nomeLocal(p.localId)}, ${fmtData(p.data)}, ${brl(p.valor)}. Isso não pode ser desfeito.`,
        ok: 'Apagar plantão', perigo: true, voltar: montar,
        onOk: () => { db.plantoes = db.plantoes.filter(x => x.id !== p.id); fechar(); commit(); toast('Plantão apagado.'); }
      });
    }, montar);
  };
  montar();
}

function pagarTudo(id) {
  if (!podeEditar()) return;
  const p = db.plantoes.find(x => x.id === id);
  if (!p) return;
  const falta = aberto(p);
  p.pagamentos.push({ data: hoje(), valor: falta });
  commit();
  toast(`${brl(falta)} marcado como recebido.`, { label: 'Desfazer', fn: () => { p.pagamentos.pop(); commit(); } });
}

/* ---------- cobrança ---------- */
function textoCobranca(lista) {
  const nome = db.nome.trim();
  const ola = nome ? `Olá, tudo bem? Aqui é ${nome}.` : 'Olá, tudo bem?';
  const linha = p => {
    const d = atraso(p);
    const prazo = d > 0 ? `venceu em ${fmtData(p.venc)}, ${diasTxt(d)} de atraso` : `vence em ${fmtData(p.venc)}`;
    const parte = recebido(p) > 0 ? ` (restante de ${brl(p.valor)})` : '';
    return `${fmtData(p.data)}, plantão de ${turnoTxt(p)}, ${brl(aberto(p))}${parte}, ${prazo}`;
  };
  const l = nomeLocal(lista[0].localId);
  if (lista.length === 1) {
    const p = lista[0], d = atraso(p);
    return `${ola}\n\nPassando para lembrar de um pagamento em aberto.\n\nLocal: ${l}\nPlantão: ${turnoTxt(p)}, dia ${fmtData(p.data)}\nValor em aberto: ${brl(aberto(p))}${recebido(p) > 0 ? ` (de ${brl(p.valor)})` : ''}\nVencimento: ${fmtData(p.venc)}${d > 0 ? ` (${diasTxt(d)} de atraso)` : ''}\n\nVocê consegue me passar uma previsão de pagamento? Obrigado!`;
  }
  return `${ola}\n\nPassando para lembrar dos plantões em aberto em ${l}:\n\n${lista.map(p => `• ${linha(p)}`).join('\n')}\n\nTotal em aberto: ${brl(soma(lista, aberto))}\n\nVocê consegue me passar uma previsão de pagamento? Obrigado!`;
}

/* ---------- exportar ---------- */
let dlNs;
async function baixar(nome, blob, okMsg) {
  if (window.claude && window.claude.use) {
    if (dlNs === undefined) { try { dlNs = await window.claude.use('downloads'); } catch (e) { dlNs = null; } }
    if (dlNs) {
      try { await dlNs.save({ filename: nome, data: blob }); toast(okMsg); }
      catch (e) { if (e && e.code !== 'declined') toast('Não deu para salvar o arquivo aqui. Tente de novo em instantes.'); }
      return;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast(okMsg);
}
const nomeArquivo = ext => `atalho-plantao-${ui.mes}${ui.local !== 'todos' ? '-' + nomeLocal(ui.local).normalize('NFD').replace(/[^\w]+/g, '-').toLowerCase() : ''}.${ext}`;

  ]);
  const csv = '﻿' + [head, ...rows].map(r => r.map(q).join(';')).join('\r\n');
  baixar(nomeArquivo('csv'), new Blob([csv], { type: 'text/csv;charset=utf-8' }), 'Planilha gerada.');
}

/* ---------- aviso rápido ---------- */

/* ---------- conta: Supabase ---------- */
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
const cacheKey = () => `atalho-plantao:conta:${conta.id}`;
function carregarScript(src) {
  return new Promise((ok, erro) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = erro; document.head.appendChild(s); });
}

const paraLinhaLocal = l => ({ id: l.id, nome: l.nome, valor: l.valor, prazo: l.prazo, forma: l.forma, exemplo: !!l.exemplo });
const deLinhaLocal = r => ({ id: r.id, nome: r.nome, valor: Number(r.valor), prazo: r.prazo, forma: r.forma, exemplo: !!r.exemplo });
const paraLinhaPlantao = p => ({ id: p.id, local_id: p.localId, data: p.data, venc: p.venc, turno: p.turno, horas: p.horas ?? null, valor: p.valor, obs: p.obs || '', pagamentos: p.pagamentos, exemplo: !!p.exemplo });
const deLinhaPlantao = r => ({ id: r.id, localId: r.local_id, data: r.data, venc: r.venc, turno: r.turno, horas: r.horas == null ? null : Number(r.horas), valor: Number(r.valor), obs: r.obs || '', pagamentos: (r.pagamentos || []).map(x => ({ data: x.data, valor: Number(x.valor) })), exemplo: !!r.exemplo });
function fotografar(d) {
  return {
    nome: d.nome || '',
    locais: Object.fromEntries(d.locais.map(l => [l.id, JSON.stringify(paraLinhaLocal(l))])),
    plantoes: Object.fromEntries(d.plantoes.map(p => [p.id, JSON.stringify(paraLinhaPlantao(p))]))
  };
}
function deFoto(f) {
  return {
    nome: f.nome, ultimoLocal: db ? db.ultimoLocal : null,
    locais: Object.values(f.locais).map(s => deLinhaLocal(JSON.parse(s))),
    plantoes: Object.values(f.plantoes).map(s => deLinhaPlantao(JSON.parse(s)))
  };
}
function mudou() {
  if (!snap || !db) return false;
  const a = fotografar(db);
  if (a.nome !== snap.nome) return true;
  for (const t of ['locais', 'plantoes']) {
    const ka = Object.keys(a[t]), ks = Object.keys(snap[t]);
    if (ka.length !== ks.length || ka.some(k => a[t][k] !== snap[t][k])) return true;
  }
  return false;
}
function guardarCache() { try { localStorage.setItem(cacheKey(), JSON.stringify({ db, snap, perfil })); } catch (e) { /* sem armazenamento */ } }
function lerCache() { try { const r = localStorage.getItem(cacheKey()); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function marcarSync(e) { if (estadoSync !== e) { estadoSync = e; if (conta && db) navs(tabAtual()); } }

function nuvemSalvar() {
  if (!conta || !db) return;
  guardarCache();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sincronizar, 400);
}

async function sincronizar() {
  if (!sb || !conta || !snap || !db) return;
  if (sincronizando) { denovo = true; return; }
  sincronizando = true;
  const atual = fotografar(db);
  try {
    const ok = r => { if (r.error) throw r.error; };
    const sobe = t => Object.keys(atual[t]).filter(id => atual[t][id] !== snap[t][id]).map(id => ({ user_id: conta.id, ...JSON.parse(atual[t][id]) }));
    const sai = t => Object.keys(snap[t]).filter(id => !(id in atual[t]));
    if (atual.nome !== snap.nome) ok(await sb.from('perfis').update({ nome: atual.nome }).eq('id', conta.id));
    const ul = sobe('locais'), up = sobe('plantoes'), dp = sai('plantoes'), dl = sai('locais');
    if (ul.length) ok(await sb.from('locais').upsert(ul));
    if (up.length) ok(await sb.from('plantoes').upsert(up));
    if (dp.length) ok(await sb.from('plantoes').delete().eq('user_id', conta.id).in('id', dp));
    if (dl.length) ok(await sb.from('locais').delete().eq('user_id', conta.id).in('id', dl));
    snap = atual;
    marcarSync('ok');
  } catch (e) {
    if (e && e.code === '42501') {
      // O servidor recusou: acesso pausado. Volta ao que está salvo na conta.
      db = deFoto(snap); render(); abrirAssinatura();
    } else {
      marcarSync('pendente');
    }
  } finally {
    guardarCache();
    sincronizando = false;
    if (denovo) { denovo = false; sincronizar(); }
  }
}

const CAMPOS_PERFIL = 'nome,status,teste_ate,pago_ate,asaas_subscription_id,iniciado';
async function baixarDaNuvem() {
  const [p, l, pl] = await Promise.all([
    sb.from('perfis').select(CAMPOS_PERFIL).eq('id', conta.id).maybeSingle(),
    sb.from('locais').select('*').order('nome'),
    sb.from('plantoes').select('*').order('data')
  ]);
  for (const r of [p, l, pl]) if (r.error) throw r.error;
  perfil = p.data || { nome: '', status: 'teste', teste_ate: hoje(), pago_ate: null, asaas_subscription_id: null, iniciado: false };
  db = { nome: perfil.nome || '', ultimoLocal: db ? db.ultimoLocal : null, locais: l.data.map(deLinhaLocal), plantoes: pl.data.map(deLinhaPlantao) };
  if (!local(db.ultimoLocal)) db.ultimoLocal = db.locais[0] ? db.locais[0].id : null;
  snap = fotografar(db);
  guardarCache();
}

async function entrar(user) {
  conta = user; carregando = true; erroNuvem = '';
  const c = lerCache();
  if (c && c.db) { db = c.db; snap = c.snap; perfil = c.perfil || null; carregando = false; }
  render();
  try {
    if (c && mudou()) await sincronizar();
    await baixarDaNuvem();
    marcarSync('ok');
    if (!perfil.iniciado) primeiraVez();
  } catch (e) {
    if (!db) erroNuvem = 'Não deu para abrir sua conta. Confira a internet e tente de novo.';
    else toast('Sem internet. Mostrando o que está salvo neste aparelho.');
  }
  carregando = false;
  render();
  setTimeout(talvezIniciar, 400);
}

function sairLocal() {
  try { if (conta) localStorage.removeItem(cacheKey()); } catch (e) { /* sem armazenamento */ }
  conta = null; db = null; perfil = null; snap = null; estadoSync = 'ok';
  login.etapa = 'email'; login.erro = ''; login.enviando = false;
  fechar(); render();
}

function primeiraVez() {
  sb.from('perfis').update({ iniciado: true }).eq('id', conta.id).then(() => {});
  perfil.iniciado = true;
  if (db.locais.length || db.plantoes.length) return;
  const daqui = lerLocal();
  const meusLocais = daqui ? daqui.locais.filter(l => !l.exemplo) : [];
  const ids = new Set(meusLocais.map(l => l.id));
  const meusPlantoes = daqui ? daqui.plantoes.filter(p => !p.exemplo && ids.has(p.localId)) : [];
  if (meusLocais.length) {
    confirmar({
      titulo: 'Levar seus plantões para a conta?',
      texto: `Este aparelho tem ${plural(meusLocais.length, 'local', 'locais')} e ${plural(meusPlantoes.length, 'plantão', 'plantões')} lançados sem conta. Quer guardar tudo na sua conta?`,
      ok: 'Levar para a conta',
      onOk: () => { db.locais = meusLocais; db.plantoes = meusPlantoes; if (daqui.nome) db.nome = daqui.nome; db.ultimoLocal = meusLocais[0].id; fechar(); commit(); toast('Pronto. Seus plantões estão na sua conta.'); lsSet('tour', 'feito'); },
      voltar: () => { Object.assign(db, exemplos()); db.ultimoLocal = 'ex-vv'; fechar(); commit(); setTimeout(talvezIniciar, 400); }
    });
  } else {
    Object.assign(db, exemplos()); db.ultimoLocal = 'ex-vv'; commit();
  }
}

async function chamarFuncao(nome, body) {
  const { data, error } = await sb.functions.invoke(nome, { body });
  if (error) {
    let msg = 'Não deu certo agora. Tente de novo em instantes.';
    try { const j = await error.context.json(); if (j && j.erro) msg = j.erro; } catch (e) { /* resposta sem corpo */ }
    throw new Error(msg);
  }
  return data;
}

async function atualizarPerfil() {
  const r = await sb.from('perfis').select(CAMPOS_PERFIL).eq('id', conta.id).maybeSingle();
  if (!r.error && r.data) { perfil = r.data; guardarCache(); render(); }
}

function abrirAssinatura() {
  if (!NUVEM) return;
  const s = situacaoConta();
  const temAssinatura = perfil && perfil.asaas_subscription_id;
  abrir('Assinatura', `
    <p style="font-size:16px">${s && s.tipo === 'pausada' ? 'Seu acesso está pausado. Seus plantões continuam guardados, e você pode ver e exportar tudo.' : esc(s ? s.txt + '.' : '')}</p>
    <dl class="well">
      <div><dt>Plano</dt><dd>${esc(CFG.precoTexto || 'Mensal')}</dd></div>
      <div><dt>Pagamento</dt><dd>Pix, boleto ou cartão</dd></div>
      <div><dt>Cancelamento</dt><dd>Quando quiser, em Ajustes</dd></div>
    </dl>
    ${temAssinatura ? '' : `<div class="field"><label for="aDoc">CPF ou CNPJ para a cobrança</label>
      <input class="input" id="aDoc" inputmode="numeric" autocomplete="off" placeholder="Só números" maxlength="18"></div>`}
    <p class="err" id="aErr" hidden></p>
    <div id="aLink"></div>
    <button type="button" class="btn btn-primary btn-block" id="aGerar">${temAssinatura ? 'Ver pagamento em aberto' : 'Assinar'}</button>
    <button type="button" class="btn btn-ghost btn-block" id="aAtualizar">Já paguei, atualizar</button>`, sh => {
    const q = x => sh.querySelector(x);
    q('#aGerar').onclick = async () => {
      const e = q('#aErr'); e.hidden = true;
      const doc = q('#aDoc') ? q('#aDoc').value.replace(/\D/g, '') : '';
      if (q('#aDoc') && doc.length !== 11 && doc.length !== 14) { e.textContent = 'Digite um CPF (11 números) ou CNPJ (14 números).'; e.hidden = false; return; }
      q('#aGerar').disabled = true; q('#aGerar').textContent = 'Gerando...';
      try {
        const r = await chamarFuncao('assinatura', { acao: 'assinar', cpfCnpj: doc });
        if (r && r.url) q('#aLink').innerHTML = `<a class="btn btn-dark btn-block" href="${esc(r.url)}" target="_blank" rel="noopener">Abrir página de pagamento</a>`;
        else if (r && r.mensagem) q('#aLink').innerHTML = `<p class="note">${esc(r.mensagem)}</p>`;
        q('#aGerar').hidden = true;
        atualizarPerfil();
      } catch (err) { e.textContent = err.message; e.hidden = false; q('#aGerar').disabled = false; q('#aGerar').textContent = temAssinatura ? 'Ver pagamento em aberto' : 'Assinar'; }
    };
    q('#aAtualizar').onclick = async () => {
      await atualizarPerfil();
      const s2 = situacaoConta();
      if (s2 && s2.tipo === 'ativa') { fechar(); toast('Assinatura ativa. Obrigado!'); }
      else toast('O pagamento ainda não chegou. Pix costuma levar poucos minutos; boleto, até 3 dias úteis.');
    };
  });
}

function ligarLogin() {
  const q = x => document.querySelector(x);
  const traduz = e => {
    const m = String((e && e.message) || '').toLowerCase();
    if (m.includes('rate') || m.includes('seconds')) return 'Muitas tentativas seguidas. Espere um minuto e tente de novo.';
    if (m.includes('expired') || m.includes('invalid') || m.includes('token')) return 'Código errado ou vencido. Confira o e-mail ou peça outro.';
    return 'Não deu certo agora. Confira a internet e tente de novo.';
  };
  const enviar = async () => {
    const email = (q('#lgEmail') ? q('#lgEmail').value : login.email).trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { login.erro = 'Digite um e-mail válido. Ex.: voce@exemplo.com'; render(); return; }
    login.email = email; login.erro = ''; login.enviando = true; render();
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.href.split('#')[0] } });
    login.enviando = false;
    if (error) login.erro = traduz(error); else { login.etapa = 'codigo'; login.erro = ''; }
    render();
    if (!error && q('#lgCodigo')) q('#lgCodigo').focus();
  };
  if (q('#lgEnviar')) { q('#lgEnviar').onclick = enviar; q('#lgEmail').onkeydown = e => { if (e.key === 'Enter') enviar(); }; }
  if (q('#lgReenviar')) q('#lgReenviar').onclick = () => { toast('Código reenviado.'); enviar(); };
  if (q('#lgTrocar')) q('#lgTrocar').onclick = () => { login.etapa = 'email'; login.erro = ''; render(); };
  const entrarCodigo = async () => {
    const token = q('#lgCodigo').value.replace(/\D/g, '');
    if (token.length < 6) { login.erro = 'Digite os 6 números do código.'; render(); return; }
    login.enviando = true; login.erro = ''; render();
    const { error } = await sb.auth.verifyOtp({ email: login.email, token, type: 'email' });
    login.enviando = false;
    if (error) { login.erro = traduz(error); render(); }
  };
  if (q('#lgEntrar')) { q('#lgEntrar').onclick = entrarCodigo; q('#lgCodigo').onkeydown = e => { if (e.key === 'Enter') entrarCodigo(); }; }
  if (q('#lgGoogle')) q('#lgGoogle').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href.split('#')[0] } });
}

async function iniciarNuvem() {
  render();
  try { await carregarScript(SUPABASE_JS); } catch (e) { erroNuvem = 'Não deu para conectar. Confira a internet e tente de novo.'; carregando = false; render(); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' } });
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'SIGNED_OUT') { sairLocal(); return; }
    if (session && (!conta || conta.id !== session.user.id)) setTimeout(() => entrar(session.user), 0);
  });
  const { data } = await sb.auth.getSession();
  if (data.session) { if (!conta) await entrar(data.session.user); }
  else { carregando = false; render(); }
  window.addEventListener('online', () => { if (mudou()) sincronizar(); });
}

/* ---------- cliques ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button, a[data-act]');
  if (!b) return;
  const d = b.dataset;
  if (d.open) return detalhe(d.open);
  if (d.pagar) return pagarTudo(d.pagar);
  if (d.cobrar) { const p = db.plantoes.find(x => x.id === d.cobrar); return copiar(textoCobranca([p]), 'Cobrança copiada. Cole no WhatsApp.'); }
  if (d.cobrarLocal) {
    const lista = db.plantoes.filter(p => p.localId === d.cobrarLocal && status(p) === 'atrasado').sort((a, b2) => (a.data < b2.data ? -1 : 1));
    return copiar(textoCobranca(lista), `Cobrança de ${plural(lista.length, 'plantão', 'plantões')} copiada.`);
  }
  if (d.balde !== undefined) return verBalde(Number(d.balde));
  if (d.mes) { ui.mes = addMes(ui.mes, Number(d.mes)); ui.dia = null; return render(); }
  if (d.filtro) { ui.local = d.filtro; return render(); }
  if (d.dia) { ui.dia = ui.dia === d.dia ? null : d.dia; return render(); }
  if (d.editLocal) return formLocal(d.editLocal);
  switch (d.act) {
    case 'fechar': return fechar();
    case 'ver-entradas': return verEntradas();
    case 'iniciar': return iniciar();
    case 'instalar': if (pedidoInstalar) { pedidoInstalar.prompt(); pedidoInstalar.userChoice.finally(() => { pedidoInstalar = null; render(); }); } return;
    case 'ir-plantoes': location.hash = '#plantoes'; return;
    case 'dispensar-dicas': lsSet('dicas', 'nao'); return render();
    case 'ver-atrasados': { const h = $('#hAtr'); if (h) h.closest('section').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    case 'lancar': return formPlantao();
    case 'novo-local': return formLocal();
    case 'lancar-dia': return formPlantao({ data: ui.dia });
    case 'csv': return exportarCSV();
    case 'pdf': return exportarPDF();
    case 'assinar': return abrirAssinatura();
    case 'recarregar': return location.reload();
    case 'sair': return sb && sb.auth.signOut();
    case 'cancelar-assinatura': return confirmar({
      titulo: 'Cancelar a assinatura?', texto: `Você não será mais cobrado. ${perfil && perfil.pago_ate ? `Seu acesso continua até ${fmtData(perfil.pago_ate)}. ` : ''}Seus plantões continuam guardados.`,
      ok: 'Cancelar assinatura', perigo: true,
      onOk: async () => {
        try { await chamarFuncao('assinatura', { acao: 'cancelar' }); await atualizarPerfil(); fechar(); toast('Assinatura cancelada.'); }
        catch (err) { fechar(); toast(err.message); }
      }
    });
    case 'excluir-conta': return confirmar({
      titulo: 'Excluir sua conta?', texto: 'Sua conta, seus locais, plantões e pagamentos serão apagados para sempre, e a assinatura será cancelada. Exporte antes o que quiser guardar.',
      ok: 'Excluir minha conta', perigo: true,
      onOk: async () => {
        try { await chamarFuncao('excluir-conta', {}); await sb.auth.signOut(); toast('Conta excluída.'); }
        catch (err) { fechar(); toast(err.message); }
      }
    });
    case 'apagar-exemplos': return confirmar({
      titulo: 'Apagar os exemplos?', texto: 'Os hospitais e plantões de exemplo somem. O que você lançou continua aqui.', ok: 'Apagar exemplos',
      onOk: () => {
        const exIds = new Set(db.locais.filter(l => l.exemplo).map(l => l.id));
        db.plantoes = db.plantoes.filter(p => !p.exemplo && !exIds.has(p.localId));
        db.locais = db.locais.filter(l => !l.exemplo);
        if (!local(db.ultimoLocal)) db.ultimoLocal = db.locais[0] ? db.locais[0].id : null;
        ui.local = 'todos';
        fechar(); commit(); toast('Exemplos apagados.');
      }
    });
    case 'apagar-tudo': return confirmar({
      titulo: 'Apagar todos os seus plantões e locais?', texto: 'Locais, plantões e pagamentos serão apagados. Isso não pode ser desfeito.', ok: 'Apagar tudo', perigo: true,
      onOk: () => { db.locais = []; db.plantoes = []; db.ultimoLocal = null; ui.local = 'todos'; fechar(); commit(); toast('Tudo apagado.'); }
    });
  }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && db) { render(); if (NUVEM && mudou()) sincronizar(); } });

if (NUVEM) iniciarNuvem(); else { render(); setTimeout(talvezIniciar, 400); }
})();
</script>
