/* Estilo: pastel-consumer com as cores da marca. Cada status é um bloco claro com o texto no tom escuro da mesma cor.
   Grade: celular em uma coluna com margem de 16px e barra inferior de 5 destinos.
   Computador (960px ou mais): barra lateral de 240px + área fluida com margem de 40px, máximo 1180px.
   Início no computador: cartão do dinheiro em largura total (4fr + 3fr + 5fr por dentro), depois 7fr + 5fr com vão de 16px. */
:root {
  --ground: #F2EFE6;
  --surface: #FFFFFF;
  --raised: #F7F4EC;
  --active: #E8E4D8;
  --border: #E3DED1;
  --rule: #EDE9DE;
  --control: #CFC9BA;
  --text: #1E1E24;
  --muted: #5F5C66;
  --faint: #6E6B74;

  --roxo: #5B3DF5;
  --roxo-pale: #ECE8FD;
  --roxo-ink: #3A22B5;
  --lima: #C6F24E;
  --lima-ink-on: #1E1E24;
  --lima-pale: #EEF8CF;
  --lima-ink: #3B5000;
  --lima-dot: #93BE1C;
  --red: #D7263D;
  --red-pale: #FBE9EA;
  --red-ink: #961227;

  --hero-bg: #1E1E24; --hero-fg: #F6F3EC; --hero-muted: rgb(246 243 236 / 0.66); --hero-line: rgb(246 243 236 / 0.18);
  --hero-accent: #C6F24E; --hero-red: #FF8A94; --hero-red-bar: #E8505E;

  --toast-bg: #1E1E24;
  --toast-ink: #FFFFFF;
  --backdrop: rgb(30 30 36 / 0.45);
  --float-shadow: 0 4px 16px rgb(30 30 36 / 0.10);

  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-fig: "Source Serif 4", Georgia, "Times New Roman", serif;

  --fs-lead: 40px;
  --fs-title: 28px;
  --fs-fig: 24px;
  --fs-section: 18px;
  --fs-body: 15px;
  --fs-small: 13px;

  --radius-card: 24px;
  --radius-tile: 18px;
  --radius-inner: 10px;
  --gap: 16px;
  --card-pad: 20px;
  --tab-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141318; --surface: #1F1E25; --raised: #26252D; --active: #2F2E37;
    --border: #2E2D36; --rule: #2A2931; --control: #46454F;
    --text: #F3F0E8; --muted: #B5B2BC; --faint: #A3A0AA;
    --roxo: #8F7BFF; --roxo-pale: #292345; --roxo-ink: #C7BCFF;
    --lima-pale: #263010; --lima-ink: #D2F07C; --lima-dot: #C6F24E;
    --red: #DC3644; --red-pale: #3A1A1E; --red-ink: #FF9AA5;
    --hero-bg: #F3F0E8; --hero-fg: #1E1E24; --hero-muted: rgb(30 30 36 / 0.62); --hero-line: rgb(30 30 36 / 0.14);
    --hero-accent: #3B5000; --hero-red: #961227; --hero-red-bar: #D7263D;
    --toast-bg: #F3F0E8; --toast-ink: #1E1E24;
    --backdrop: rgb(0 0 0 / 0.6);
    --float-shadow: 0 4px 16px rgb(0 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #141318; --surface: #1F1E25; --raised: #26252D; --active: #2F2E37;
  --border: #2E2D36; --rule: #2A2931; --control: #46454F;
  --text: #F3F0E8; --muted: #B5B2BC; --faint: #A3A0AA;
  --roxo: #8F7BFF; --roxo-pale: #292345; --roxo-ink: #C7BCFF;
  --lima-pale: #263010; --lima-ink: #D2F07C; --lima-dot: #C6F24E;
  --red: #DC3644; --red-pale: #3A1A1E; --red-ink: #FF9AA5;
  --hero-bg: #F3F0E8; --hero-fg: #1E1E24; --hero-muted: rgb(30 30 36 / 0.62); --hero-line: rgb(30 30 36 / 0.14);
  --hero-accent: #3B5000; --hero-red: #961227; --hero-red-bar: #D7263D;
  --toast-bg: #F3F0E8; --toast-ink: #1E1E24;
  --backdrop: rgb(0 0 0 / 0.6);
  --float-shadow: 0 4px 16px rgb(0 0 0 / 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-block-start: 72px; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--roxo); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
ul, ol { list-style: none; margin: 0; padding: 0; }
.num, .fig, .fig-lead { font-variant-numeric: tabular-nums; }

/* ---------- estrutura ---------- */
.side { display: none; }
.mtop {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15;
  display: flex; align-items: center; gap: 10px; min-height: 52px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--ground);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 16; background: var(--ground); }

.wordmark { font-family: var(--font-fig); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
.mtop-date { margin-inline-start: auto; color: var(--muted); font-size: var(--fs-small); }
.canvas {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 20px;
  max-width: 640px; margin: 0 auto;
}

/* barra inferior (celular) */
.tabbar {
  position: fixed; inset: auto 0 0 0; z-index: 20;
  background: var(--ground); border-top: 1px solid var(--border);
  padding: 0 max(4px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(4px, env(safe-area-inset-left, 0px));
}
.tabbar-in { max-width: 640px; margin: 0 auto; height: var(--tab-h); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; }
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 100%;
  color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600; border: 0; background: none;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--text); }
.tab[aria-current="page"] svg { color: var(--roxo); }
.tab-cta { color: var(--text); }
.tab-cta span.plus { width: 44px; height: 44px; border-radius: 999px; background: var(--lima); color: var(--lima-ink-on); display: grid; place-items: center; }
.tab-cta span.plus svg { width: 24px; height: 24px; }

@media (min-width: 960px) {
  .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
  .mtop, .tabbar { display: none; }
  .side {
    display: flex; flex-direction: column; gap: 20px;
    position: sticky; top: 0; height: 100vh; height: 100dvh;
    padding: 24px 12px 20px;
  }
  .side .brand { display: flex; align-items: center; gap: 10px; padding-inline: 10px; }
  .side .brand small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
  .side .wordmark { display: block; line-height: 1.15; }
  .side-cta { margin-inline: 4px; }
  .side-nav { display: flex; flex-direction: column; gap: 2px; }
  .side-nav a {
    display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 10px;
    color: var(--muted); text-decoration: none; font-weight: 500;
  }
  .side-nav a svg { width: 18px; height: 18px; flex: none; }
  .side-nav a[aria-current="page"] { background: var(--surface); color: var(--text); font-weight: 600; }
  .side-foot { margin-top: auto; padding: 0 10px; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-small); color: var(--muted); }
  .side-foot b { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }
  .canvas { max-width: 1180px; width: 100%; margin: 0; padding: 32px 40px 48px; gap: 24px; }
}

/* ---------- títulos ---------- */
.title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
.title-row > div:first-child { min-width: 0; flex: 1 1 280px; display: flex; flex-direction: column; gap: 4px; }
h1 { font-family: var(--font-fig); font-size: var(--fs-title); font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; }
.finding { color: var(--muted); font-size: var(--fs-body); max-width: 60ch; }
.finding b { color: var(--text); font-weight: 600; }
.finding .red { color: var(--red-ink); font-weight: 600; }
.title-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- cartões ---------- */
.card { background: var(--surface); border-radius: var(--radius-card); min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; padding: 18px var(--card-pad) 6px; }
.card-head h2 { font-family: var(--font-fig); font-size: var(--fs-section); font-weight: 600; }
.card-head .meta { color: var(--muted); font-size: var(--fs-small); }
.card-foot { padding: 4px var(--card-pad) 16px; }

/* cartão do dinheiro: cartão escuro com o número principal e o gráfico; dois blocos cheios ao lado */
.money { display: grid; gap: 12px; }
.hero { background: var(--hero-bg); color: var(--hero-fg); border-radius: var(--radius-card); padding: 22px 22px 18px; display: grid; gap: 20px; min-width: 0; }
.lead { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card-label { font-size: var(--fs-small); font-weight: 600; color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.hero .eyebrow { color: var(--hero-accent); }
.fig-lead { font-family: var(--font-fig); font-size: var(--fs-lead); font-weight: 700; letter-spacing: -0.015em; line-height: 1.05; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.fig-lead small { font-size: 0.5em; font-weight: 600; vertical-align: 0.5em; margin-inline-end: 0.12em; opacity: 0.75; }
.cents { font-size: 0.55em; font-weight: 600; opacity: 0.7; }
.hero .sub { color: var(--hero-muted); font-size: var(--fs-small); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { all: unset; box-sizing: border-box; cursor: pointer; border-radius: var(--radius-tile); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; text-align: start; }
.tile:focus-visible { outline: 2px solid var(--roxo); outline-offset: 2px; }
.tile .eyebrow { opacity: 0.85; }
.tile .fig { font-family: var(--font-fig); font-size: var(--fs-fig); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tile-sub { font-size: 12px; opacity: 0.8; }
.t-pago { background: var(--lima); color: var(--lima-ink-on); }
.t-atraso { background: var(--red); color: #FFFFFF; }
.t-zero { background: var(--surface); color: var(--muted); }

/* quando deve entrar: dentro do cartão escuro; cada coluna abre a lista daquela semana */
.when h3 { font-size: 12px; font-weight: 600; color: var(--hero-muted); margin-bottom: 12px; }
.cols { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end; border-bottom: 1px solid var(--hero-line); }
.col { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; height: 128px; gap: 4px; border-radius: 6px 6px 0 0; }
.col:focus-visible { outline: 2px solid var(--hero-accent); outline-offset: 2px; }
.col:disabled { cursor: default; }
.col-val { font-size: 12px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--hero-fg); }
.col-val.zero { color: var(--hero-muted); font-weight: 500; }
.col-bar { border-radius: 4px 4px 0 0; background: var(--hero-accent); min-height: 0; }
.col-bar.atr { background: var(--hero-red-bar); }
.col-lbl { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.col-lbl span { font-size: 12px; color: var(--hero-muted); text-align: center; line-height: 1.25; }
.col-lbl span.atr { color: var(--hero-red); font-weight: 600; }

.home-grid { display: grid; gap: var(--gap); }
@media (min-width: 960px) {
  .money { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); grid-template-areas: "hero pago" "hero atraso"; gap: var(--gap); }
  .hero { grid-area: hero; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: end; gap: 32px; padding: 26px 28px 22px; }
  .tiles { display: contents; }
  .tiles > .tile:first-child { grid-area: pago; }
  .tiles > .tile:last-child { grid-area: atraso; }
  .tile { padding: 20px 22px; justify-content: center; }
  .home-grid { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start; }
  .row { display: flex; align-items: center; gap: 20px; padding-block: 12px; }
  .row-main { flex: 1; }
  .row-acts { flex: none; flex-wrap: nowrap; gap: 4px; margin: 0; }
}
.home-side { display: grid; gap: var(--gap); }
.in-fig { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--lima-ink); }

/* ---------- linhas ---------- */
.rows > li + li { border-top: 1px solid var(--rule); }
.row { padding: 12px var(--card-pad) 6px; }
.row-main {
  all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline;
  border-radius: var(--radius-inner);
}
.row-main:focus-visible { outline: 2px solid var(--roxo); outline-offset: 4px; }
.row-name { font-weight: 600; overflow-wrap: anywhere; }
.row-fig { font-weight: 700; font-variant-numeric: tabular-nums; text-align: end; white-space: nowrap; }
.row-sub { color: var(--muted); font-size: var(--fs-small); }
.row-acts { display: flex; gap: 4px 16px; flex-wrap: wrap; margin-inline-start: -8px; }
.act {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px;
  border: 0; background: none; border-radius: var(--radius-inner);
  font-weight: 600; font-size: 14px; color: var(--roxo-ink);
}
.act svg { width: 16px; height: 16px; }
.act-ok { color: var(--lima-ink); }

/* lista de plantões */
.plt {
  all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  padding: 12px var(--card-pad); min-height: 68px;
}
.plt:focus-visible { outline: 2px solid var(--roxo); outline-offset: -2px; border-radius: var(--radius-inner); }
.plt-day { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.plt-day b { font-family: var(--font-fig); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.plt-day small { font-size: 12px; color: var(--muted); }
.plt-info { display: flex; flex-direction: column; min-width: 0; }
.plt-info strong { font-weight: 600; overflow-wrap: anywhere; }
.plt-info small { color: var(--muted); font-size: var(--fs-small); }
.plt-end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.plt-end b { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* etiquetas */
.pill {
  flex: none; display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap; justify-self: end;
}
.p-receber, .p-parcial { background: var(--roxo-pale); color: var(--roxo-ink); }
.p-pago { background: var(--lima-pale); color: var(--lima-ink); }
.p-atrasado { background: var(--red-pale); color: var(--red-ink); }

/* resumo dentro do cartão */
.strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 8px var(--card-pad); background: var(--raised); border-radius: var(--radius-tile); }
.strip > div { padding: 10px 12px; min-width: 0; }
.strip > div:nth-child(2n) { border-inline-start: 1px solid var(--rule); }
.strip > div:nth-child(n+3) { border-top: 1px solid var(--rule); }
.strip small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.strip b { font-family: var(--font-fig); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.strip .red b { color: var(--red-ink); }
@media (min-width: 560px) {
  .strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .strip > div + div { border-inline-start: 1px solid var(--rule); }
  .strip > div:nth-child(n+3) { border-top: 0; }
}

/* ranking */
.rank li { padding: 14px var(--card-pad); display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; }
.rank-pos { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.rank-name { font-weight: 600; overflow-wrap: anywhere; }
.rank-val { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: end; }
.rank-val.zero { color: var(--faint); font-weight: 500; }
.rank-bar { grid-column: 2 / -1; height: 3px; border-radius: 2px; background: var(--rule); margin-top: 6px; }
.rank-bar i { display: block; height: 100%; border-radius: 2px; background: var(--red); }
.rank-sub { grid-column: 2 / -1; color: var(--muted); font-size: var(--fs-small); }
.rank .act { grid-column: 2 / -1; justify-self: start; margin-inline-start: -8px; }

/* filtros */
.filters { display: flex; flex-direction: column; gap: 10px; }
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper b { font-family: var(--font-fig); font-weight: 600; font-size: 20px; flex: 1; text-align: center; white-space: nowrap; }
.step { min-height: 44px; padding: 0 10px; border: 0; background: none; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.step svg { width: 16px; height: 16px; }
.icon-btn { width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--control); background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-block: 2px; overscroll-behavior-x: contain; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin-inline: 0; padding-inline: 0; }
.chip {
  flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--control); background: var(--surface); color: var(--text);
  font-weight: 600; font-size: 14px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--surface); }
.list-grid { display: grid; gap: var(--gap); }
@media (min-width: 960px) {
  .filters { flex-direction: row; align-items: center; gap: 16px; }
  .stepper b { flex: none; padding: 0 8px; }
  .chips { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; }
  .list-grid { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start; }
}

/* botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent;
  font-weight: 700; font-size: 15px; line-height: 1.2; text-align: center; text-decoration: none; white-space: nowrap;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-sm { min-height: 40px; padding: 0 16px; font-size: 14px; }
.btn-block { width: 100%; }
.btn-primary { background: var(--lima); color: var(--lima-ink-on); }
.btn-ghost { background: var(--surface); border-color: var(--control); color: var(--text); }
.btn-dark { background: var(--text); color: var(--surface); }
.btn-text { background: none; color: var(--roxo-ink); padding: 0 8px; min-height: 44px; }
.btn-danger { background: var(--surface); border-color: var(--red); color: var(--red-ink); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-row > .btn { flex: 1 1 140px; }

/* agenda */
.cal-wrap { display: grid; gap: var(--gap); }
@media (min-width: 960px) { .cal-wrap { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start; } }
.cal { padding: 14px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding-block: 2px 6px; }
.day {
  all: unset; box-sizing: border-box; cursor: pointer;
  min-height: 52px; border-radius: 10px; padding-top: 7px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px;
}
.day.out { visibility: hidden; }
.day.has { background: var(--raised); }
.day.today { outline: 1.5px solid var(--roxo); outline-offset: -1.5px; }
.day[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.day:focus-visible { outline: 2px solid var(--roxo); outline-offset: 1px; }
.dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 34px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.d-receber { background: var(--roxo); }
.d-pago { background: var(--lima-dot); }
.d-parcial { background: transparent; border: 2px solid var(--roxo); }
.d-atrasado { background: var(--red); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 12px 4px 2px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ajustes */
.set { display: grid; gap: 12px; }
.set + .set { border-top: 1px solid var(--border); padding-top: 24px; margin-top: 24px; }
.set-label h2 { font-family: var(--font-fig); font-size: 18px; font-weight: 600; }
.set-label p { color: var(--muted); font-size: 14px; margin-top: 2px; max-width: 46ch; }
.panel { background: var(--raised); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (min-width: 960px) {
  .set { grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 32px; }
}
.loc { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.loc + .loc { border-top: 1px solid var(--border); padding-top: 14px; }
.loc strong { display: block; overflow-wrap: anywhere; }
.loc small { color: var(--muted); font-size: var(--fs-small); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: end; font-weight: 600; overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: 14px; }
.sync { display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--lima-dot); }
.sync.pend i { background: var(--red); }

/* formulários */
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .flabel { font-size: 14px; font-weight: 600; }
.hint { color: var(--muted); font-size: var(--fs-small); font-weight: 400; }
.input {
  width: 100%; min-height: 48px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--control); background: var(--surface); font-size: 16px;
}
.input::placeholder { color: var(--faint); }
.input:focus { outline: 2px solid var(--roxo); outline-offset: 0; border-color: var(--roxo); }
.input-money { font-family: var(--font-fig); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
textarea.input { min-height: 220px; padding: 12px 14px; line-height: 1.45; resize: vertical; }
.err { color: var(--red-ink); font-size: 14px; font-weight: 600; }
.preview { color: var(--muted); font-size: 14px; }
.preview b { color: var(--text); }

/* folha inferior */
dialog.sheet {
  margin: auto auto 0; width: 100%; max-width: 560px; border: 0;
  border-radius: var(--radius-card) var(--radius-card) 0 0;
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); color: var(--text); box-shadow: var(--float-shadow); /* taste-skill-ignore: folha que flutua */
}
dialog.sheet::backdrop { background: var(--backdrop); }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--control); margin: 4px auto 12px; }
@media (min-width: 960px) {
  dialog.sheet { margin: auto; border-radius: var(--radius-card); max-height: 86vh; padding: 12px 28px 28px; }
  .grab { display: none; }
}
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.sheet-head h2 { font-family: var(--font-fig); font-size: 22px; font-weight: 600; padding-top: 8px; }
.sheet-body { display: flex; flex-direction: column; gap: 20px; }
.close { width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--raised); display: grid; place-items: center; flex: none; }
.close svg { width: 20px; height: 20px; }
.well { background: var(--raised); border-radius: var(--radius-tile); padding: 4px 14px; margin: 0; }
.well div { display: flex; justify-content: space-between; gap: 16px; min-height: 40px; align-items: center; }
.well div + div { border-top: 1px solid var(--rule); }
.well dt { color: var(--muted); font-size: 14px; }
.well dd { margin: 0; font-weight: 600; text-align: end; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.well .red { color: var(--red-ink); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.sheet-rows { margin-inline: -8px; }
/* primeiros passos e passo a passo */
.prog { height: 4px; border-radius: 2px; background: var(--rule); margin: 6px var(--card-pad) 8px; }
.prog i { display: block; height: 100%; border-radius: 2px; background: var(--lima-dot); }
.passo { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px var(--card-pad); }
.passo:focus-visible { outline: 2px solid var(--roxo); outline-offset: -2px; }
.passo .check { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--control); display: grid; place-items: center; }
.passo .check svg { width: 14px; height: 14px; }
.passo.feito { cursor: default; }
.passo.feito .check { background: var(--lima); border-color: var(--lima); color: var(--lima-ink-on); }
.passo.feito strong { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--control); }
.passos-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.dots-prog { display: flex; gap: 6px; }
.dots-prog i { width: 8px; height: 8px; border-radius: 4px; background: var(--active); }
.dots-prog i.on { background: var(--text); width: 22px; }
.tour-lead { font-size: 17px; line-height: 1.45; }
.tour-steps { display: flex; flex-direction: column; gap: 14px; }
.tour-steps li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; }
.tour-steps b { width: 32px; height: 32px; border-radius: 50%; background: var(--lima); color: var(--lima-ink-on); display: grid; place-items: center; font-family: var(--font-fig); font-size: 16px; }
.tour-steps strong { display: block; }
.tour-steps small { color: var(--muted); font-size: 14px; }
.sheet-rows .plt { padding-inline: 8px; border-radius: var(--radius-inner); }
.danger-zone { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 8px; }

/* entrada */
.login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.login-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; }
.login-card .brand { display: flex; align-items: center; gap: 10px; }
.login-card .mark { width: 44px; height: 44px; border-radius: 12px; }
.login-card .wordmark { font-size: 20px; }

/* avisos e estados */
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 8px 8px 8px 16px; border-radius: 16px; background: var(--surface); color: var(--text); font-size: 14px; font-weight: 500; }
.notice span { flex: 1 1 220px; }
.notice.red { background: var(--red-pale); color: var(--red-ink); }
.notice .btn-text { color: var(--roxo-ink); text-decoration: underline; text-underline-offset: 3px; }
.notice.red .btn-text { color: inherit; }
.empty { padding: 20px var(--card-pad) 12px; color: var(--muted); }
.empty-box { margin: 4px var(--card-pad) 18px; padding: 12px 16px; border: 1px dashed var(--control); border-radius: var(--radius-inner); color: var(--muted); font-size: 14px; }
.ok-line { display: flex; align-items: center; gap: 10px; margin: 4px var(--card-pad) 18px; padding: 12px 14px; border-radius: var(--radius-tile); background: var(--lima-pale); color: var(--lima-ink); font-weight: 600; font-size: 14px; }
.ok-line svg { width: 18px; height: 18px; flex: none; }
.skel { display: block; background: var(--active); border-radius: 6px; }

.toast {
  position: fixed; z-index: 30; left: 50%; translate: -50% 0;
  bottom: calc(var(--tab-h) + 14px + env(safe-area-inset-bottom, 0px));
  width: min(520px, calc(100% - 32px));
  background: var(--toast-bg); color: var(--toast-ink); border-radius: 14px; box-shadow: var(--float-shadow); /* taste-skill-ignore: aviso que flutua */
  padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px;
}
.toast span { flex: 1; }
.toast-btn { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; min-height: 40px; padding: 0 10px; }
@media (min-width: 960px) { .toast { bottom: 24px; left: calc(50% + 120px); } }

@media (hover: hover) {
  .row-main:hover .row-name, .plt:hover strong { color: var(--roxo-ink); }
  .plt:hover, .day:not(.out):not([aria-pressed="true"]):hover { background: var(--raised); }
  .btn-ghost:hover, .chip:not([aria-pressed="true"]):hover, .icon-btn:hover { border-color: var(--text); }
  .step:hover, .tile:hover { filter: brightness(0.97); }
  .step:hover { background: var(--active); color: var(--text); }
  .act:hover, .btn-text:hover { background: var(--raised); }
  .side-nav a:not([aria-current="page"]):hover { background: var(--raised); color: var(--text); }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .icon-btn, .act, .tab-cta span.plus, .day, .plt, .tile, .step { transition-property: scale, background-color, border-color, color; transition-duration: 150ms; transition-timing-function: ease-out; }
  .btn:not(:disabled):active, .chip:active, .icon-btn:active, .act:active, .tab-cta:active span.plus, .day:not(.out):active, .tile:active, .step:active { scale: 0.96; }
  dialog.sheet[open] { animation: subir 280ms cubic-bezier(0.2, 0, 0, 1) both; }
  .toast:not([hidden]) { animation: aparecer 200ms ease-out both; }
}
@media (prefers-reduced-motion: reduce) {
  dialog.sheet[open], .toast:not([hidden]) { animation: aparecer 200ms ease-out both; }
}
@keyframes subir { from { translate: 0 24px; opacity: 0; } to { translate: 0 0; opacity: 1; } }
@keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }

body.sem-conta .tabbar, body.sem-conta .side, body.sem-conta .mtop { display: none; }
body.sem-conta .shell { display: block; }
body.sem-conta .canvas { max-width: none; padding: 0; margin: 0; }
</style>

    <div class="brand">
      <span class="mark" aria-hidden="true"></span>

    </div>
    <button type="button" class="btn btn-primary side-cta" data-act="lancar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Lançar plantão
    </button>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"></dialog>

<script>
/* Login e assinatura. Deixe vazio para usar só neste aparelho, sem conta.
   Para ligar, preencha com a URL e a chave pública (anon) do seu projeto Supabase. Veja LEIA.md. */
window.ATALHO_CONFIG = {
  supabaseUrl: '',
  supabaseAnonKey: '',
  entrarComGoogle: false,
  precoTexto: ''
};
</script>

<script>
(() => {
'use strict';

/* ---------- utilidades ---------- */
const KEY_LOCAL = 'atalho-plantao:v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const hoje = () => iso(new Date());
const addDias = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const difDias = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const fmtData = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const brl = n => BRL.format(n || 0);
const COMPACTO = new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 });
const r2 = n => Math.round(n * 100) / 100;
const mesKey = s => s.slice(0, 7);
const nomeMes = k => {
  const [y, m] = k.split('-').map(Number);
  const t = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(new Date(y, m - 1, 1));
  return t.charAt(0).toUpperCase() + t.slice(1);
};
const mesSo = k => { const [y, m] = k.split('-').map(Number); return new Intl.DateTimeFormat('pt-BR', { month: 'long' }).format(new Date(y, m - 1, 1)); };
const semana = s => new Intl.DateTimeFormat('pt-BR', { weekday: 'short' }).format(parse(s)).replace('.', '');
const addMes = (k, n) => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const parseValor = s => {
  s = String(s ?? '').trim().replace(/[R$\s]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? r2(n) : NaN;
};
const valorInput = n => (Number.isInteger(n) ? String(n) : n.toFixed(2).replace('.', ','));
const soma = (arr, f) => r2(arr.reduce((s, x) => s + f(x), 0));
const diasTxt = n => `${n} ${n === 1 ? 'dia' : 'dias'}`;
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const figParts = n => { const m = brl(n).match(/^(R\$)\s*([\d.]+)(,\d\d)$/); return m ? `<small>${m[1]}</small>${m[2]}<span class="cents">${m[3]}</span>` : brl(n); };
const mesAbrev = k => { const [y, m] = k.split('-').map(Number); return new Intl.DateTimeFormat('pt-BR', { month: 'short' }).format(new Date(y, m - 1, 1)).replace('.', ''); };
const dataCurta = () => new Intl.DateTimeFormat('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' }).format(new Date()).replace(/\./g, '');
const FORMAS = ['PJ', 'RPA', 'CLT', 'Cooperativa'];

/* ---------- modo: só neste aparelho ou com conta ---------- */
const CFG = window.ATALHO_CONFIG || {};
const NUVEM = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);

function lerLocal() { try { const r = localStorage.getItem(KEY_LOCAL); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function save() {
  if (NUVEM) { nuvemSalvar(); return; }
  try { localStorage.setItem(KEY_LOCAL, JSON.stringify(db)); } catch (e) { /* armazenamento indisponível */ }
}

function exemplos() {
  const T = hoje();
  const locais = [
    { id: 'ex-vv', nome: 'Hospital Vale Verde', valor: 1500, prazo: 30, forma: 'PJ', exemplo: true },
    { id: 'ex-upa', nome: 'UPA Centro Norte', valor: 1200, prazo: 45, forma: 'RPA', exemplo: true },
    { id: 'ex-hor', nome: 'Clínica Horizonte', valor: 900, prazo: 15, forma: 'PJ', exemplo: true },
    { id: 'ex-coop', nome: 'Cooperativa MedSul', valor: 1800, prazo: 60, forma: 'Cooperativa', exemplo: true }
  ];
  const L = Object.fromEntries(locais.map(l => [l.id, l]));
  // [local, dias atrás, turno, horas, pagamento]. Pagamento: null, ['total', dias após vencimento] ou ['parte', valor, dias após vencimento]
  const plano = [
    ['ex-vv', 95, '12h', 0, ['total', 12]],
    ['ex-vv', 70, '24h', 0, null],
    ['ex-vv', 50, '12h', 0, null],
    ['ex-vv', 20, '12h', 0, null],
    ['ex-vv', 6, '12h', 0, null],
    ['ex-vv', 1, 'outro', 6, null],
    ['ex-upa', 100, '12h', 0, ['total', 0]],
    ['ex-upa', 80, '12h', 0, ['parte', 600, 5]],
    ['ex-upa', 52, '24h', 0, null],
    ['ex-upa', 15, '12h', 0, null],
    ['ex-hor', 40, '12h', 0, ['total', -2]],
    ['ex-hor', 25, '12h', 0, ['total', 1]],
    ['ex-hor', 12, '12h', 0, null],
    ['ex-hor', 3, '12h', 0, null],
    ['ex-coop', 90, '24h', 0, null],
    ['ex-coop', 45, '12h', 0, null],
    ['ex-coop', 10, '24h', 0, null]
  ];
  const plantoes = plano.map(([lid, atras, turno, horas, pg]) => {
    const l = L[lid];
    const data = addDias(T, -atras);
    const venc = addDias(data, l.prazo);
    const valor = valorPadrao(l, turno, horas);
    const p = { id: uid(), localId: lid, data, venc, turno, horas: horas || null, valor, obs: '', pagamentos: [], exemplo: true };
    if (pg) {
      let quando = addDias(venc, pg[pg.length - 1]);
      if (quando > T) quando = T;
      p.pagamentos.push({ data: quando, valor: pg[0] === 'total' ? valor : pg[1] });
    }
    return p;
  });
  return { locais, plantoes };
}

function valorPadrao(l, turno, horas) {
  if (!l) return 0;
  if (turno === '24h') return l.valor * 2;
  if (turno === 'outro' && horas > 0) return r2(l.valor / 12 * horas);
  return l.valor;
}

let db = null;
if (!NUVEM) {
  db = lerLocal();
  if (!db) { db = { nome: '', ultimoLocal: 'ex-vv', ...exemplos() }; save(); }
}

/* ---------- regras ---------- */
const local = id => db.locais.find(l => l.id === id);
const nomeLocal = id => (local(id) || {}).nome || 'Local removido';
const recebido = p => soma(p.pagamentos, x => x.valor);
const aberto = p => Math.max(0, r2(p.valor - recebido(p)));
function status(p) {
  const r = recebido(p);
  if (r >= p.valor - 0.005) return 'pago';
  if (hoje() > p.venc) return 'atrasado';
  return r > 0 ? 'parcial' : 'receber';
}
const atraso = p => Math.max(0, difDias(hoje(), p.venc));
const turnoTxt = p => (p.turno === 'outro' ? (p.horas ? `${p.horas}h` : 'outro turno') : p.turno);
const LABEL = { receber: 'A receber', pago: 'Pago', parcial: 'Pago parcial', atrasado: 'Atrasado' };
const statusTxt = p => { const s = status(p); return s === 'atrasado' && recebido(p) > 0 ? 'Atrasado, parcial' : LABEL[s]; };
const pillTxt = p => (status(p) === 'atrasado' ? `${diasTxt(atraso(p))} de atraso` : statusTxt(p));
const pill = p => `<span class="pill p-${status(p)}">${pillTxt(p)}</span>`;
const ultimoPgto = p => (p.pagamentos.length ? p.pagamentos[p.pagamentos.length - 1].data : null);
const temExemplos = () => db.locais.some(l => l.exemplo) || db.plantoes.some(p => p.exemplo);

/* ---------- estado da tela ---------- */
const ui = { mes: mesKey(hoje()), local: 'todos', dia: null };
let ultimosBaldes = [];
const filtrados = () => db.plantoes
  .filter(p => mesKey(p.data) === ui.mes && (ui.local === 'todos' || p.localId === ui.local))
  .sort((a, b) => (a.data < b.data ? 1 : a.data > b.data ? -1 : 0));

/* ---------- ícones ---------- */
const svg = (d, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  inicio: svg('<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1v-9.5Z"/>', 1.75),
  plantoes: svg('<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>', 1.75),
  agenda: svg('<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>', 1.75),
  ajustes: svg('<path d="M4 21v-6.5M4 10.5V3M12 21v-9M12 8V3M20 21v-4.5M20 12.5V3M1.5 14.5h5M9.5 8h5M17.5 16.5h5"/>', 1.75),
  plus: svg('<path d="M12 5v14M5 12h14"/>', 2.5),
  prev: svg('<path d="m15 18-6-6 6-6"/>', 2),
  next: svg('<path d="m9 18 6-6-6-6"/>', 2),
  close: svg('<path d="M6 6l12 12M18 6 6 18"/>', 2),
  check: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>', 2.5),
  copy: svg('<rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/>', 1.75),
  file: svg('<path d="M14 3.5H7A2.5 2.5 0 0 0 4.5 6v12A2.5 2.5 0 0 0 7 20.5h10a2.5 2.5 0 0 0 2.5-2.5V9L14 3.5Z"/><path d="M14 3.5V9h5.5M12 12.5v5M9.5 15l2.5 2.5 2.5-2.5"/>', 1.75)
};
const TABS = [
  { id: 'inicio', nome: 'Início' },
  { id: 'plantoes', nome: 'Plantões' },
  { id: 'agenda', nome: 'Agenda' },
  { id: 'ajustes', nome: 'Ajustes' }
];

/* ---------- conta e assinatura (só com Supabase ligado) ---------- */
let sb = null, conta = null, perfil = null, snap = null, carregando = NUVEM, erroNuvem = '';
let syncTimer = null, sincronizando = false, denovo = false, estadoSync = 'ok';
const login = { etapa: 'email', email: '', erro: '', enviando: false };

function acessoLiberado() {
  if (!NUVEM || !perfil) return true;
  const h = hoje();
  return (perfil.status === 'teste' && perfil.teste_ate >= h) || (!!perfil.pago_ate && perfil.pago_ate >= h);
}
function podeEditar() {
  if (acessoLiberado()) return true;
  abrirAssinatura();
  return false;
}
function situacaoConta() {
  if (!NUVEM || !perfil) return null;
  const h = hoje();
  if (perfil.status === 'teste' && perfil.teste_ate >= h) return { tipo: 'teste', txt: `Teste grátis até ${fmtData(perfil.teste_ate)}` };
  if (perfil.pago_ate && perfil.pago_ate >= h) {
    if (perfil.status === 'atrasada') return { tipo: 'atrasada', txt: `Mensalidade em aberto. Acesso até ${fmtData(perfil.pago_ate)}` };
    if (perfil.status === 'cancelada') return { tipo: 'cancelada', txt: `Assinatura cancelada. Acesso até ${fmtData(perfil.pago_ate)}` };
    return { tipo: 'ativa', txt: `Assinatura ativa até ${fmtData(perfil.pago_ate)}` };
  }
  return { tipo: 'pausada', txt: 'Acesso pausado' };
}

/* ---------- telas ---------- */
function avisoConta() {
  const s = situacaoConta();
  if (!s) return '';
  if (s.tipo === 'teste') {
    const n = difDias(perfil.teste_ate, hoje());
    return n <= 5 ? `<div class="notice"><span>Seu teste grátis acaba em ${diasTxt(n)}, em ${fmtData(perfil.teste_ate)}.</span><button type="button" class="btn btn-text" data-act="assinar">Assinar</button></div>` : '';
  }
  if (s.tipo === 'atrasada') return `<div class="notice red"><span>A mensalidade do app está em aberto. Seu acesso segue até ${fmtData(perfil.pago_ate)}.</span><button type="button" class="btn btn-text" data-act="assinar">Pagar</button></div>`;
  if (s.tipo === 'pausada') return `<div class="notice red"><span>Seu acesso está pausado. Seus plantões continuam guardados e você pode ver e exportar tudo. Para lançar e marcar pagamentos, assine.</span><button type="button" class="btn btn-text" data-act="assinar">Assinar</button></div>`;
  return '';
}

function avisoExemplos() {
  return temExemplos()
    ? '<div class="notice"><span>Você está vendo dados de exemplo. Os hospitais e valores são inventados.</span><button type="button" class="btn btn-text" data-act="apagar-exemplos">Apagar exemplos</button></div>'
    : '';
}

function baldes(abertos) {
  // Atrasado, quatro semanas a partir de hoje e depois. A soma fecha com o total a receber.
  const T = hoje();
  const b = [
    { lbl: 'Atrasado', sub: '', atr: true, v: 0 },
    { lbl: 'até', sub: fmtData(addDias(T, 6)).slice(0, 5), v: 0 },
    { lbl: 'até', sub: fmtData(addDias(T, 13)).slice(0, 5), v: 0 },
    { lbl: 'até', sub: fmtData(addDias(T, 20)).slice(0, 5), v: 0 },
    { lbl: 'até', sub: fmtData(addDias(T, 27)).slice(0, 5), v: 0 },
    { lbl: 'Depois', sub: '', v: 0 }
  ];
  b.forEach(x => { x.ps = []; });
  abertos.forEach(p => {
    const d = difDias(p.venc, T);
    const i = d < 0 ? 0 : d <= 6 ? 1 : d <= 13 ? 2 : d <= 20 ? 3 : d <= 27 ? 4 : 5;
    b[i].v = r2(b[i].v + aberto(p));
    b[i].ps.push(p);
  });
  b[0].titulo = 'Atrasados'; b[5].titulo = `Vencem depois de ${fmtData(addDias(T, 27))}`;
  for (let i = 1; i <= 4; i++) b[i].titulo = `Vencem até ${fmtData(addDias(T, i * 7 - 1))}`;
  ultimosBaldes = b;
  return b;
}

function grafQuando(b) {
  const max = Math.max(...b.map(x => x.v), 1);
  const curto = v => (v >= 1000 ? COMPACTO.format(v) : String(Math.round(v)));
  return `<div class="when">
    <h3>Quando deve entrar, pela data de vencimento. Toque numa semana para ver os plantões.</h3>
    <div class="cols" role="group" aria-label="Valor a receber por semana de vencimento">
      ${b.map((x, i) => `<button type="button" class="col" data-balde="${i}" ${x.v ? '' : 'disabled'} aria-label="${x.titulo}: ${brl(x.v)}, ${plural(x.ps.length, 'plantão', 'plantões')}">
        <span class="col-val${x.v ? '' : ' zero'}">${x.v ? curto(x.v) : '0'}</span>
        <span class="col-bar${x.atr ? ' atr' : ''}" style="height:${x.v ? Math.max(3, Math.round(x.v / max * 100)) : 0}px"></span>
      </button>`).join('')}
    </div>
    <div class="col-lbl" aria-hidden="true">${b.map(x => `<span class="${x.atr ? 'atr' : ''}">${x.lbl}${x.sub ? `<br>${x.sub}` : ''}</span>`).join('')}</div>
  </div>`;
}

function itemAtraso(p) {
  return `<li class="row">
    <button type="button" class="row-main" data-open="${p.id}">
      <span class="row-name">${esc(nomeLocal(p.localId))}</span>
      <span class="row-fig">${brl(aberto(p))}</span>
      <span class="row-sub">Plantão de ${esc(turnoTxt(p))} em ${fmtData(p.data)}. Venceu em ${fmtData(p.venc)}${recebido(p) > 0 ? `. Já entrou ${brl(recebido(p))}` : ''}.</span>
      <span class="pill p-atrasado">${diasTxt(atraso(p))}</span>
    </button>
    <div class="row-acts">
      <button type="button" class="act" data-cobrar="${p.id}">${I.copy} Copiar cobrança</button>
      <button type="button" class="act act-ok" data-pagar="${p.id}">${I.check} Recebi</button>
    </div>
  </li>`;
}

function linhaPlantao(p) {
  const s = status(p);
  const sub = s === 'pago' ? `pago em ${fmtData(ultimoPgto(p))}` : `vence ${fmtData(p.venc)}`;
  return `<li><button type="button" class="plt" data-open="${p.id}">
    <span class="plt-day"><b>${p.data.slice(8)}</b><small>${esc(semana(p.data))}</small></span>
    <span class="plt-info"><strong>${esc(nomeLocal(p.localId))}</strong><small>${esc(turnoTxt(p))}, ${sub}</small></span>
    <span class="plt-end"><b>${brl(s === 'pago' ? p.valor : aberto(p))}</b>${pill(p)}</span>
  </button></li>`;
}

function vInicio() {
  let html = avisoConta() + avisoExemplos();
  if (!db.plantoes.length) {
    return html + `<div class="title-row"><div><h1>Seu dinheiro</h1><p class="finding">Nenhum plantão lançado ainda.</p></div></div>
      ${cardPrimeirosPassos()}
      <section class="card" aria-label="Começar"><p class="empty">${db.locais.length ? 'Toque em Lançar, escolha o local e salve.' : 'Comece cadastrando os hospitais e empresas onde você dá plantão. Depois, cada plantão leva três toques.'}</p>
      <div class="card-foot">${db.locais.length
        ? '<button type="button" class="btn btn-primary" data-act="lancar">Lançar plantão</button>'
        : '<button type="button" class="btn btn-primary" data-act="novo-local">Cadastrar local</button>'}</div></section>`;
  }
  const abertos = db.plantoes.filter(p => status(p) !== 'pago');
  const totalAberto = soma(abertos, aberto);
  const atrasados = abertos.filter(p => status(p) === 'atrasado').sort((a, b) => atraso(b) - atraso(a));
  const totalAtraso = soma(atrasados, aberto);
  const mk = mesKey(hoje());
  const pgMes = db.plantoes.flatMap(p => p.pagamentos.filter(x => mesKey(x.data) === mk));
  const recMes = soma(pgMes, x => x.valor);
  const entradas = db.plantoes.flatMap(p => p.pagamentos.filter(x => mesKey(x.data) === mk).map(x => ({ p, data: x.data, valor: x.valor })))
    .sort((a, b2) => (a.data < b2.data ? 1 : -1));
  console.assert(Math.abs(soma(entradas, x => x.valor) - recMes) < 0.01, 'entradas não fecham com o recebido no mês');
  const b = baldes(abertos);
  console.assert(Math.abs(soma(b, x => x.v) - totalAberto) < 0.01, 'baldes não fecham com o total a receber');
  console.assert(Math.abs(b[0].v - totalAtraso) < 0.01, 'balde atrasado não fecha com o total atrasado');
  const proximos = abertos.filter(p => status(p) !== 'atrasado' && difDias(p.venc, hoje()) <= 7).sort((a, b2) => (a.venc < b2.venc ? -1 : 1));

  const velho = atrasados[0];
  const finding = atrasados.length
    ? `<span class="red">${brl(totalAtraso)} atrasados</span> em ${plural(atrasados.length, 'plantão', 'plantões')}. O mais antigo é do ${esc(nomeLocal(velho.localId))}, com ${diasTxt(atraso(velho))}.`
    : 'Nenhum plantão atrasado. Tudo dentro do prazo.';

  html += `<div class="title-row"><div><h1>Seu dinheiro</h1><p class="finding">${finding}</p></div></div>
  <section class="money" aria-label="Resumo do dinheiro">
    <div class="hero">
      <div class="lead">
        <h2 class="eyebrow">A receber</h2>
        <p class="fig-lead">${figParts(totalAberto)}</p>
        <p class="sub">${plural(abertos.length, 'plantão em aberto', 'plantões em aberto')}, contando os atrasados</p>
      </div>
      ${grafQuando(b)}
    </div>
    <div class="tiles">
      <button type="button" class="tile ${recMes ? 't-pago' : 't-zero'}" data-act="ver-entradas" aria-label="Recebido em ${esc(mesSo(mk))}: ${brl(recMes)}. Ver pagamentos"><span class="eyebrow">Recebido em ${esc(mesSo(mk))}</span><span class="fig">${brl(recMes)}</span><span class="tile-sub">${plural(pgMes.length, 'pagamento', 'pagamentos')} ›</span></button>
      <button type="button" class="tile ${totalAtraso ? 't-atraso' : 't-zero'}" data-act="ver-atrasados" aria-label="Atrasado: ${brl(totalAtraso)}. Ver lista"><span class="eyebrow">Atrasado</span><span class="fig">${brl(totalAtraso)}</span><span class="tile-sub">${plural(atrasados.length, 'plantão', 'plantões')} ›</span></button>
    </div>
  </section>
  ${cardPrimeirosPassos()}
  <div class="home-grid">
    <section class="card" aria-labelledby="hAtr">
      <div class="card-head"><h2 id="hAtr">Atrasados</h2>${atrasados.length ? '<span class="meta">do mais antigo para o mais novo</span>' : ''}</div>
      ${atrasados.length ? `<ul class="rows">${atrasados.map(itemAtraso).join('')}</ul>` : `<p class="ok-line">${I.check} Nenhum plantão passou do vencimento.</p>`}
    </section>
    <div class="home-side">
    <section class="card" aria-labelledby="hProx">
      <div class="card-head"><h2 id="hProx">Vencem nos próximos 7 dias</h2>${proximos.length ? `<span class="meta">${brl(soma(proximos, aberto))}</span>` : ''}</div>
      ${proximos.length ? `<ul class="rows">${proximos.map(linhaPlantao).join('')}</ul>` : '<p class="empty-box">Nada vence nos próximos 7 dias.</p>'}
    </section>
    <section class="card" aria-labelledby="hEntrou">
      <div class="card-head"><h2 id="hEntrou">Entrou em ${esc(mesSo(mk))}</h2>${entradas.length ? `<span class="meta">${brl(recMes)}</span>` : ''}</div>
      ${entradas.length ? `<ul class="rows">${entradas.map(x => `<li><button type="button" class="plt" data-open="${x.p.id}">
        <span class="plt-day"><b>${x.data.slice(8)}</b><small>${esc(semana(x.data))}</small></span>
        <span class="plt-info"><strong>${esc(nomeLocal(x.p.localId))}</strong><small>plantão de ${fmtData(x.p.data)}</small></span>
        <span class="in-fig">+${brl(x.valor)}</span>
      </button></li>`).join('')}</ul>` : `<p class="empty-box">Nenhum pagamento registrado em ${esc(mesSo(mk))} ainda.</p>`}
    </section>
    </div>
  </div>`;
  return html;
}

function barraMes() {
  const ant = addMes(ui.mes, -1), prox = addMes(ui.mes, 1);
  return `<div class="stepper">
    <button type="button" class="step" data-mes="-1" aria-label="Mês anterior, ${nomeMes(ant)}">${I.prev}${esc(mesAbrev(ant))}</button>
    <b>${nomeMes(ui.mes)}</b>
    <button type="button" class="step" data-mes="1" aria-label="Próximo mês, ${nomeMes(prox)}">${esc(mesAbrev(prox))}${I.next}</button>
  </div>`;
}

function chipsLocal() {
  if (db.locais.length < 2) return '';
  return `<div class="chips" role="group" aria-label="Filtrar por local">
    <button type="button" class="chip" data-filtro="todos" aria-pressed="${ui.local === 'todos'}">Todos os locais</button>
    ${db.locais.map(l => `<button type="button" class="chip" data-filtro="${l.id}" aria-pressed="${ui.local === l.id}">${esc(l.nome)}</button>`).join('')}
  </div>`;
}

function ranking() {
  const linhas = db.locais.map(l => {
    const ps = db.plantoes.filter(p => p.localId === l.id);
    const vencidos = ps.filter(p => p.venc < hoje() || status(p) === 'pago');
    const atrasos = vencidos.map(p => (status(p) === 'pago' ? Math.max(0, difDias(ultimoPgto(p), p.venc)) : atraso(p)));
    const atrasados = ps.filter(p => status(p) === 'atrasado');
    return {
      l, n: atrasados.length, valor: soma(atrasados, aberto),
      media: atrasos.length ? Math.round(atrasos.reduce((a, b) => a + b, 0) / atrasos.length) : 0,
      base: atrasos.length
    };
  }).filter(r => r.base > 0 || r.n > 0).sort((a, b) => b.valor - a.valor || b.media - a.media);
  if (!linhas.length) return '<p class="empty-box">O ranking aparece quando algum plantão passar do vencimento.</p>';
  const max = Math.max(...linhas.map(r => r.valor), 1);
  return `<ol class="rows rank">${linhas.map((r, i) => `<li>
    <span class="rank-pos">${i + 1}</span>
    <span class="rank-name">${esc(r.l.nome)}</span>
    <span class="rank-val${r.valor ? '' : ' zero'}">${brl(r.valor)}</span>
    <span class="rank-bar" aria-hidden="true"><i style="width:${Math.round(r.valor / max * 100)}%"></i></span>
    <span class="rank-sub">${r.n ? `${plural(r.n, 'plantão atrasado', 'plantões atrasados')}. ` : 'Nada atrasado agora. '}Paga em média ${r.media ? `${diasTxt(r.media)} depois do vencimento` : 'no prazo'}.</span>
    ${r.n ? `<button type="button" class="act" data-cobrar-local="${r.l.id}">${I.copy} Copiar cobrança de tudo</button>` : ''}
  </li>`).join('')}</ol>`;
}

function vPlantoes() {
  const lista = filtrados();
  const total = soma(lista, p => p.valor);
  const rec = soma(lista, recebido);
  const emAberto = soma(lista, aberto);
  const atr = soma(lista.filter(p => status(p) === 'atrasado'), aberto);
  const escopo = `${nomeMes(ui.mes)}${ui.local !== 'todos' ? `, ${esc(nomeLocal(ui.local))}` : ''}`;
  return `<div class="title-row"><div><h1>Plantões</h1>
      <p class="finding">${escopo}: ${plural(lista.length, 'plantão', 'plantões')}, <b>${brl(total)}</b>.</p></div>
    <div class="title-actions">
      <button type="button" class="btn btn-ghost btn-sm" data-act="csv" ${lista.length ? '' : 'disabled'}>${I.file} Planilha CSV</button>
      <button type="button" class="btn btn-ghost btn-sm" data-act="pdf" ${lista.length ? '' : 'disabled'}>${I.file} PDF</button>
    </div></div>
  <div class="filters">${barraMes()}${chipsLocal()}</div>
  <div class="list-grid">
    <section class="card" aria-labelledby="hLista">
      <div class="card-head"><h2 id="hLista">${escopo}</h2><span class="meta">${plural(lista.length, 'plantão', 'plantões')}</span></div>
      <div class="strip">
        <div><small>Total</small><b>${brl(total)}</b></div>
        <div><small>Recebido</small><b>${brl(rec)}</b></div>
        <div><small>Em aberto</small><b>${brl(emAberto)}</b></div>
        <div class="${atr ? 'red' : ''}"><small>Atrasado</small><b>${brl(atr)}</b></div>
      </div>
      ${lista.length ? `<ul class="rows">${lista.map(linhaPlantao).join('')}</ul>` : '<p class="empty-box">Nenhum plantão neste mês com esse filtro.</p>'}
    </section>
    <section class="card" aria-labelledby="hRank">
      <div class="card-head"><h2 id="hRank">Quem mais atrasa</h2><span class="meta">todos os meses</span></div>
      ${ranking()}
    </section>
  </div>`;
}

function vAgenda() {
  const [y, m] = ui.mes.split('-').map(Number);
  const primeiro = new Date(y, m - 1, 1).getDay();
  const nDias = new Date(y, m, 0).getDate();
  const doMes = db.plantoes.filter(p => mesKey(p.data) === ui.mes);
  const porDia = {};
  doMes.forEach(p => { (porDia[p.data] = porDia[p.data] || []).push(p); });
  const T = hoje();
  let cells = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(d => `<div class="dow" aria-hidden="true">${d}</div>`).join('');
  for (let i = 0; i < primeiro; i++) cells += '<div class="day out" aria-hidden="true"></div>';
  for (let d = 1; d <= nDias; d++) {
    const k = `${ui.mes}-${pad(d)}`;
    const ps = porDia[k] || [];
    const cls = ['day', ps.length ? 'has' : '', k === T ? 'today' : ''].join(' ');
    const desc = ps.length ? `, ${plural(ps.length, 'plantão', 'plantões')}: ${ps.map(statusTxt).join(', ')}` : '';
    cells += `<button type="button" class="${cls}" data-dia="${k}" aria-pressed="${ui.dia === k}" aria-label="${fmtData(k)}${desc}">
      <span>${d}</span><span class="dots">${ps.slice(0, 4).map(p => `<i class="dot d-${status(p)}"></i>`).join('')}</span>
    </button>`;
  }
  const dia = ui.dia && mesKey(ui.dia) === ui.mes ? ui.dia : null;
  const psDia = dia ? (porDia[dia] || []) : [];
  const detalheDia = dia
    ? `<section class="card" aria-labelledby="hDia">
        <div class="card-head"><h2 id="hDia">${fmtData(dia)}</h2><span class="meta">${plural(psDia.length, 'plantão', 'plantões')}</span></div>
        ${psDia.length ? `<ul class="rows">${psDia.map(linhaPlantao).join('')}</ul>` : '<p class="empty-box">Nenhum plantão neste dia.</p>'}
        <div class="card-foot"><button type="button" class="btn btn-primary btn-block" data-act="lancar-dia">Lançar plantão em ${fmtData(dia)}</button></div>
      </section>`
    : `<section class="card" aria-labelledby="hDia">
        <div class="card-head"><h2 id="hDia">Plantões do mês</h2><span class="meta">${brl(soma(doMes, p => p.valor))}</span></div>
        ${doMes.length ? `<ul class="rows">${doMes.slice().sort((a, b) => (a.data < b.data ? -1 : 1)).slice(0, 6).map(linhaPlantao).join('')}</ul>` : '<p class="empty-box">Nenhum plantão neste mês. Toque em um dia para lançar.</p>'}
        ${doMes.length > 6 ? `<div class="card-foot"><a class="btn btn-ghost btn-sm" href="#plantoes">Ver todos os ${doMes.length}</a></div>` : ''}
      </section>`;
  return `<div class="title-row"><div><h1>Agenda</h1><p class="finding">${nomeMes(ui.mes)}: ${plural(doMes.length, 'plantão', 'plantões')}. Toque em um dia para ver ou lançar.</p></div></div>
  <div class="filters">${barraMes()}</div>
  <div class="cal-wrap">
    <section class="card cal" aria-label="Calendário de ${nomeMes(ui.mes)}">
      <div class="cal-grid">${cells}</div>
      <div class="legend">
        <span><i class="dot d-receber"></i>A receber</span>
        <span><i class="dot d-parcial"></i>Parcial</span>
        <span><i class="dot d-pago"></i>Pago</span>
        <span><i class="dot d-atrasado"></i>Atrasado</span>
      </div>
    </section>
    ${detalheDia}
  </div>`;
}
