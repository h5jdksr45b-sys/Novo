/* ---------- Eventos ---------- */
document.addEventListener('click',async ev=>{
  const tab=ev.target.closest('[data-tab]');if(tab){setTab(tab.dataset.tab);return}
  const a=ev.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='backdrop'){if(ev.target===a)closeSheet();return}
  switch(act){
    case 'close':closeSheet();break;
    case 'copy':copy(a.dataset.text,a.dataset.label);break;
    /* agenda */
    case 'agenda-retry':loadAgendaOnce();break;
    case 'book':{const o={};if(a.dataset.key){const p=patients().find(x=>x.key===a.dataset.key);if(p)Object.assign(o,{nome:p.name,email:p.email||'',phone:p.phone||'',tipo:'Retorno'})}
      openBooking(o);if(a.dataset.date){B.date=a.dataset.date;B.events=null;eventsOn(B.date).then(evs=>{if(!B)return;B.events=evs;B.slot=a.dataset.hm||null;paintBooking()})}break}
    case 'b-slot':readBookingFields();B.slot=a.dataset.hm;B.busyMsg='';paintBooking();break;
    case 'b-next':readBookingFields();if(B.mode==='new'&&!B.nome){B.busyMsg='Informe o nome do paciente.';paintBooking();break}B.busyMsg='';B.confirm=true;paintBooking();break;
    case 'b-back':B.confirm=false;paintBooking();break;
    case 'b-save':saveBooking();break;
    case 'move':{const e=S.agenda.events.find(x=>x.id===a.dataset.id);if(!e)break;openBooking({mode:'move',evId:e.id,from:e.start,date:dayKey(e.start),nome:e.name,tipo:e.tipo||'Consulta'});break}
    case 'cancel':if(a.dataset.armed){cancelEvent(a.dataset.id,a)}else{a.dataset.armed='1';a.classList.add('danger');a.textContent='Confirmar cancelamento';setTimeout(()=>{if(a.isConnected&&!a.disabled){delete a.dataset.armed;a.classList.remove('danger');a.textContent='Cancelar'}},5000)}break;
    /* pacientes */
    case 'pac-retry':S.pac.status='idle';render();break;
    case 'pac-acao':store('pac-acao',a.dataset.k);render();break;
    case 'pac-tap':{const k=pacAcao();if(k==='ficha')openPatient(a.dataset.key);else if(k==='receita')openRx({key:a.dataset.key});else openDoc({key:a.dataset.key,tipo:k});break}
    case 'open-patient':openPatient(a.dataset.key);break;
    case 'ficha-grp':if(FICHA)openPatient(FICHA.key,a.dataset.g);break;
    case 'doc-avulso':{const k=pacAcao();if(k==='receita')openRx({});else openDoc({tipo:k==='ficha'?'atestado':k});break}
    case 'rx-for':openRx({key:a.dataset.key});break;
    case 'cad-new':openCad({});break;
    case 'ai-open':openAI();break;
    case 'ai-send':aiSend();break;
    case 'ai-stop':if(AI&&AI.ctl)AI.ctl.abort();break;
    case 'ai-new':AI.msgs=[];AI.steps=[];AI.live='';paintAI();break;
    case 'ai-chip':{const t=document.getElementById('ai-text');if(t){t.value=a.dataset.text;AI.draft=t.value;t.focus();t.setSelectionRange(t.value.length,t.value.length)}break}
    case 'rx-ai':{readRx();if(!RX.paciente){toast('Informe o paciente');break}if(!RX.itens.some(i=>i.nome)){toast('Inclua ao menos um medicamento');break}
      const txt=rxPrompt().replace(/^Use o Claude in Chrome[^\n]*\n/,'Prepare na Memed uma receita para eu conferir e assinar.\n');
      if(!RX.copied&&S.db){S.db.collection('receitas').doc().set({paciente:RX.paciente,pacienteKey:RX.pkey||'',itens:RX.itens.filter(i=>i.nome),obs:RX.obs,criadoEm:new Date().toISOString()}).catch(()=>{})}
      openAI(txt,true);break}
    case 'go':{const t=a.dataset.tab;if(a.dataset.f){S.mail.filter=a.dataset.f;S.mail.q='';watchMail()}setTab(t);break}
    case 'pix':{const id=a.dataset.id;const ok=!(S.pag[docId(id)]&&S.pag[docId(id)].pago);if(!S.db){toast('Abra no claude.ai para salvar');break}a.disabled=true;
      try{await S.db.collection('pagamentos').doc(docId(id)).set({pago:ok,em:new Date().toISOString(),paciente:a.dataset.name||''});toast(ok?'PIX marcado como pago':'PIX voltou para pendente')}catch(e){toast('Não foi possível salvar');a.disabled=false}break}
    case 'conf-set':{if(!S.db){toast('Abra no claude.ai para salvar');break}const id=a.dataset.id,st=a.dataset.st;const cur=(S.conf[docId(id)]||{}).status;
      try{await S.db.collection('confirmacoes').doc(docId(id)).set({status:cur===st?'enviada':st,em:new Date().toISOString(),paciente:a.dataset.name||''})}catch(e){toast('Não foi possível salvar')}break}
    case 'conf-copy':{copy(a.dataset.text,'Mensagem');const id=a.dataset.id;if(S.db&&!(S.conf[docId(id)]||{}).status){try{await S.db.collection('confirmacoes').doc(docId(id)).set({status:'enviada',em:new Date().toISOString(),paciente:a.dataset.name||''})}catch(_){}}break}
    case 'sr-dias':S.semRetorno=Number(a.dataset.n);store('sem-retorno',S.semRetorno);render();break;
    case 'sr-copy':{copy(a.dataset.text,'Mensagem');break}
    case 'sr-ok':{if(!S.db){toast('Abra no claude.ai para salvar');break}a.disabled=true;try{await S.db.collection('contatos').doc(docId(a.dataset.key)).set({em:new Date().toISOString(),paciente:a.dataset.name||''});toast('Some da lista por 30 dias')}catch(e){a.disabled=false;toast('Não foi possível salvar')}break}
    case 'cad-edit':{const p=patients().find(x=>x.key===a.dataset.key);if(p)openCad({p});break}
    case 'cad-parse':readCad();{const t=(document.getElementById('cad-colar')||{}).value||'';const o=parseDados(t);const n=Object.keys(o).filter(k=>o[k]).length;if(!n){toast('Não encontrei dados nesse texto');break}Object.keys(o).forEach(k=>{if(o[k])CAD.f[k]=o[k]});CAD.colar='';paintCad();toast(plural(n,'campo preenchido','campos preenchidos')+'. Confira antes de salvar.')}break;
    case 'cad-save':saveCad(a);break;
    case 'cad-open-dup':{const c=S.cad.find(x=>x.id===a.dataset.id);if(c)openCad({cad:c});break}
    case 'cad-del':{if(!CAD||!CAD.id)break;if(!a.dataset.armed){a.dataset.armed='1';a.classList.add('danger');a.lastChild.textContent='Confirmar exclusão do cadastro';break}
      try{await S.db.collection('pacientes').doc(CAD.id).delete();toast('Cadastro excluído. As consultas na agenda continuam.');closeSheet()}catch(e){toast('Não foi possível excluir')}break}
    case 'rx-add':readRx();RX.itens.push({nome:'',qtd:'',pos:''});paintRx();{const el=document.getElementById('rx-n'+(RX.itens.length-1));if(el)el.focus()}break;
    case 'rx-del':readRx();RX.itens.splice(Number(a.dataset.i),1);if(!RX.itens.length)RX.itens.push({nome:'',qtd:'',pos:''});paintRx();break;
    case 'rx-repeat':{readRx();const l=lastRx(RX.pkey,RX.paciente);if(l){RX.itens=(l.itens||[]).map(i=>({nome:i.nome||'',qtd:i.qtd||'',pos:i.pos||''}));paintRx();toast('Itens da última receita copiados. Confira antes de pedir.')}break}
    case 'rx-copy':copyRx();break;
    case 'rx-done':a.disabled=true;if(RX&&RX.pendId&&await patchPend(RX.pendId,{status:'feita',feitoEm:new Date().toISOString()})){toast('Pendência marcada como feita');closeSheet()}else a.disabled=false;break;
    case 'rx-pend':{readRx();if(!RX.paciente){toast('Informe o paciente');break}a.disabled=true;const id=S.db?S.db.collection('pendencias').doc().id:null;
      if(id&&await savePend(id,{titulo:'Assinar receita de '+RX.paciente,tipo:'Receita',paciente:RX.paciente,pacienteKey:RX.pkey||patKeyByName(RX.paciente),prazo:dayKey(new Date()),nota:rxItensResumo(),status:'aberta',origem:'painel',criadoEm:new Date().toISOString()})){RX.pendId=id;toast('Pendência criada para hoje');paintRx()}else a.disabled=false;break}
    case 'doc-for':openDoc({key:a.dataset.key,tipo:a.dataset.t});break;
    /* documentos */
    case 'doc-tipo':readDoc();{const t=a.dataset.t;DOC.tipo=t;DOC.molde=lastMolde(t);DOC.dirty=false;DOC.saveOpen=false;DOC.titulo=(moldeAtual()&&moldeAtual().titulo)||TITULO_PADRAO[t];if(t==='declaracao'&&!DOC.dataDecl){const v=DOC.visits.find(x=>x.id===DOC.visitId);if(v)setDeclFromVisit(v)}DOC.texto=fillMolde();paintDoc()}break;
    case 'doc-dias':readDoc();DOC.dias=Number(a.dataset.n);refreshDocText();paintDoc();break;
    case 'doc-kit':readDoc();DOC.exames=a.dataset.k==='limpar'?[]:[...new Set(DOC.exames.concat(KITS[a.dataset.k]||[]))];paintDoc();break;
    case 'doc-molde':{readDoc();if(DOC.dirty&&!a.dataset.armed&&DOC.molde!==a.dataset.id){a.dataset.armed='1';toast('Trocar o molde apaga suas edições. Toque de novo para trocar.');setTimeout(()=>{delete a.dataset.armed},4000);break}
      DOC.molde=a.dataset.id;DOC.dirty=false;DOC.confirmDel=null;const m=moldeAtual();if(DOC.tipo==='relatorio')DOC.titulo=(m&&m.titulo)||TITULO_PADRAO.relatorio;DOC.texto=fillMolde();paintDoc();break}
    case 'doc-reset':readDoc();DOC.dirty=false;DOC.texto=fillMolde();paintDoc();break;
    case 'doc-molde-save':readDoc();DOC.saveOpen=!DOC.saveOpen;paintDoc();if(DOC.saveOpen){const el=document.getElementById('d-molde-nome');if(el)el.focus()}break;
    case 'doc-molde-save2':saveMolde();break;
    case 'doc-molde-del':{readDoc();const id=a.dataset.id;if(DOC.confirmDel!==id){DOC.confirmDel=id;paintDoc();break}
      try{await S.db.collection('moldes').doc(id).delete();DOC.confirmDel=null;DOC.molde=(MOLDES_BASE[DOC.tipo][0]||{}).id||'';store('molde-'+DOC.tipo,DOC.molde);DOC.dirty=false;DOC.texto=fillMolde();toast('Molde excluído');paintDoc()}catch(e){toast('Não foi possível excluir o molde')}break}
    case 'doc-rodape':{readDoc();const z=document.getElementById('d-rod-zone');z.innerHTML='<div class="quick"><input class="field" id="d-rod" value="'+esc(docRodape())+'"><button class="btn small" data-act="doc-rod-save">Salvar</button></div>';break}
    case 'doc-rod-save':{const v=document.getElementById('d-rod').value.trim();if(v)store('doc-rodape',v);readDoc();paintDoc();toast('Rodapé salvo');break}
    case 'doc-pdf':gerarPDF(a);break;
    /* e-mail */
    case 'mail-filter':S.mail.filter=a.dataset.f;S.mail.q='';watchMail();render();break;
    case 'mail-clear':S.mail.q='';watchMail();render();break;
    case 'mail-more':loadMoreMail();break;
    case 'mail-retry':watchMail();render();break;
    case 'drafts-retry':loadDrafts();break;
    case 'open-thread':openThread(a.dataset.id);break;
    case 'open-draft':openDraft(a.dataset.id);break;
    case 'draft-send':{const m=document.getElementById('draft-msg');if(!a.dataset.armed){a.dataset.armed='1';a.textContent='Confirmar envio';break}
      a.disabled=true;a.textContent='Enviando…';try{await call(GMAIL,'send_message',{draftId:a.dataset.id});toast('Rascunho enviado');invalidate(GMAIL);closeSheet();loadDrafts()}catch(e){a.disabled=false;delete a.dataset.armed;a.textContent='Enviar agora';if(m)m.innerHTML=errBox(e,GMAIL)}break}
    case 'star':{const id=a.dataset.id;const on=a.getAttribute('aria-pressed')!=='true';a.disabled=true;
      try{await call(GMAIL,on?'label_thread':'unlabel_thread',{threadId:id,labelIds:['STARRED']});setThreadLabel(id,'STARRED',on);invalidate(GMAIL);if(S.tab==='email')render();else{a.classList.toggle('on',on);a.setAttribute('aria-pressed',String(on))}}catch(e){toast('Não foi possível mudar a estrela')}a.disabled=false;break}
    case 'compose':openCompose(a.dataset.to,a.dataset.name);break;
    case 't-reply':case 't-forward':{const T=THREAD;if(!T)break;const z=document.getElementById('reply-zone');
      if(act==='t-reply')z.innerHTML=composerHTML({to:T.replyTo,subject:/^re:/i.test(T.subj)?T.subj:'Re: '+T.subj,replyId:T.last.id,name:T.replyName});
      else{const m=T.last;const s=parseSender(m.sender);z.innerHTML=composerHTML({to:'',subject:/^(fwd?|enc):/i.test(T.subj)?T.subj:'Fwd: '+T.subj,body:'\n\n---------- Mensagem encaminhada ----------\nDe: '+s.name+(s.email!==s.name?' <'+s.email+'>':'')+'\nData: '+mailDate(m.date)+'\nAssunto: '+T.subj+'\n\n'+String(m.plaintextBody||m.snippet||'').trim()})}
      const f=document.getElementById(act==='t-reply'?'c-body':'c-to');if(f){f.focus();f.scrollIntoView({block:'center'})}break}
    case 't-archive':threadAction('archive',a);break;
    case 't-unread':threadAction('unread',a);break;
    case 't-star':threadAction('star',a);break;
    case 't-trash':threadAction('trash',a);break;
    case 't-labels':{const z=document.getElementById('t-labels-zone');if(z.innerHTML){z.innerHTML='';break}if(!S.mail.labels.length)await loadLabels();paintLabelPicker();break}
    case 't-label':toggleLabel(a.dataset.l,a);break;
    case 'c-cc':{const r=document.getElementById('c-cc-row');if(r){r.hidden=!r.hidden;if(!r.hidden)document.getElementById('c-cc').focus()}break}
    case 'c-unfile':if(COMP){COMP.files.splice(Number(a.dataset.i),1);paintFiles()}break;
    case 'c-draft':submitComposer('draft',a);break;
    case 'c-send':submitComposer('send',a);break;
    /* pendências */
    case 'pend-view':S.pend.view=a.dataset.v;render();break;
    case 'pf-tipo':S.pend.form.tipo=a.dataset.t;render();break;
    case 'pf-prazo':S.pend.form.prazo=a.dataset.v;render();break;
    case 'pf-more':S.pend.form.more=!S.pend.form.more;render();break;
    case 'pend-fix':{const r=S.pend.rows.find(x=>x.id===a.dataset.id);if(r)resolvePend(r);break}
    case 'pend-menu':openPendMenu(a.dataset.id);break;
    case 'pend-for':{const p=patients().find(x=>x.key===a.dataset.key);Object.assign(S.pend.form,{paciente:p?p.name:'',titulo:'',more:true});closeSheet();if(S.tab==='pendencias')render();else setTab('pendencias');const el=document.getElementById('pf-titulo');if(el)el.focus();break}
    case 'pend-pac':{const k=a.dataset.key;if(k&&patients().some(x=>x.key===k))openPatient(k);else toast('Paciente não encontrado na agenda carregada');break}
    case 'pend-ok':{const r=pendSuggestions().find(x=>x.id===a.dataset.id);if(!r)break;a.disabled=true;
      if(r.fromDb)await patchPend(r.id,{status:'aberta',aprovadaEm:new Date().toISOString()});
      else await savePend(r.id,{titulo:r.titulo,tipo:r.tipo,paciente:r.paciente,pacienteKey:r.pacienteKey,prazo:r.prazo,status:'aberta',origem:'painel',criadoEm:new Date().toISOString()});
      toast('Pendência aprovada');break}
    case 'pend-no':{const r=pendSuggestions().find(x=>x.id===a.dataset.id);if(!r)break;a.disabled=true;
      if(r.fromDb)await patchPend(r.id,{status:'descartada'});
      else await savePend(r.id,{titulo:r.titulo,tipo:r.tipo,paciente:r.paciente,status:'descartada',origem:'painel',criadoEm:new Date().toISOString()});
      break}
    case 'pend-done':a.disabled=true;a.classList.add('done');if(await patchPend(a.dataset.id,{status:'feita',feitoEm:new Date().toISOString()})){toast('Feita');if(document.getElementById('pe-form'))closeSheet()}else{a.disabled=false;a.classList.remove('done')}break;
    case 'pend-undo':await patchPend(a.dataset.id,{status:'aberta',feitoEm:null});break;
    case 'pend-toggle-done':S.pend.showDone=!S.pend.showDone;render();break;
    case 'pend-del':{if(!a.dataset.armed){a.dataset.armed='1';a.classList.add('danger');a.lastChild.textContent='Confirmar exclusão';break}
      try{await S.db.collection('pendencias').doc(a.dataset.id).delete();toast('Pendência excluída');closeSheet()}catch(e){toast('Não foi possível excluir')}break}
    case 'pe-adiar':{const el=document.getElementById('pe-prazo');const base=el.value&&new Date(el.value+'T12:00:00')>startOfDay(new Date())?new Date(el.value+'T12:00:00'):new Date();el.value=dayKey(addDays(base,Number(a.dataset.n)));break}
    case 'pe-save':{const f=document.getElementById('pe-form');const titulo=document.getElementById('pe-titulo').value.trim();if(!titulo){toast('Escreva a pendência');break}
      const pac=document.getElementById('pe-paciente').value.trim();a.disabled=true;
      if(await patchPend(f.dataset.id,{titulo,tipo:document.getElementById('pe-tipo').value,prazo:document.getElementById('pe-prazo').value||'',paciente:pac,pacienteKey:patKeyByName(pac),nota:document.getElementById('pe-nota').value.trim()})){toast('Pendência atualizada');closeSheet()}else a.disabled=false;break}
  }
});
document.addEventListener('submit',async ev=>{
  ev.preventDefault();const f=ev.target;
  if(f.id==='mail-search'){S.mail.q=document.getElementById('mail-q').value;watchMail();render()}
  else if(f.id==='pq-form'){
    const F=S.pend.form;F.titulo=document.getElementById('pf-titulo').value.trim();
    if(!F.titulo){toast('Escreva a pendência');return}
    const ok=await savePend(null,{titulo:F.titulo,tipo:F.tipo,prazo:F.prazo||'',paciente:F.paciente.trim(),pacienteKey:patKeyByName(F.paciente),nota:F.nota.trim(),status:'aberta',origem:'voce',criadoEm:new Date().toISOString()});
    if(ok){S.pend.form={titulo:'',tipo:'Outro',prazo:'',paciente:'',nota:'',more:false};toast('Pendência adicionada');render();const el=document.getElementById('pf-titulo');if(el)el.focus()}
  }
});
document.addEventListener('input',ev=>{
  const id=ev.target.id;
  if(id==='pac-q'){S.pac.q=ev.target.value;render()}
  else if(id==='pend-q'){S.pend.q=ev.target.value;render()}
  else if(id==='pf-titulo')S.pend.form.titulo=ev.target.value;
  else if(id==='pf-paciente')S.pend.form.paciente=ev.target.value;
  else if(id==='pf-nota')S.pend.form.nota=ev.target.value;
  else if(id==='ai-text'&&AI){AI.draft=ev.target.value}
  else if(CAD&&/^cad-/.test(id)){readCad();if(id==='cad-cpf'||id==='cad-nome')paintCadWarn()}
  else if(RX&&/^rx-/.test(id)){readRx();const pv=document.getElementById('rx-preview');if(pv)pv.textContent=rxPrompt()}
  else if(id==='d-texto'&&DOC){DOC.texto=ev.target.value;if(!DOC.dirty){DOC.dirty=true}}
  else if(DOC&&/^d-/.test(id)&&!['d-molde-nome','d-rod'].includes(id)){readDoc();refreshDocText()}
});
document.addEventListener('change',ev=>{
  const id=ev.target.id;
  if(id==='b-nome'&&B){const p=patients().find(x=>norm(x.name)===norm(ev.target.value));if(p){['phone','email'].forEach(k=>{const el=document.getElementById('b-'+k);if(el&&!el.value&&p[k])el.value=p[k]})}return}
  if(id==='b-date'&&B&&ev.target.value){readBookingFields();B.date=ev.target.value;B.busyMsg='';loadBookingDay();return}
  if(id==='pf-prazo'){S.pend.form.prazo=ev.target.value;render();return}
  if(id==='c-tpl'&&ev.target.value!==''){applyTemplate(Number(ev.target.value));ev.target.value='';return}
  if(id==='cad-print'&&CAD&&ev.target.files&&ev.target.files[0]){lerPrint(ev.target.files[0]);ev.target.value='';return}
  if(id==='c-files'&&COMP){addFiles(ev.target.files);ev.target.value='';return}
  if(id==='d-visit'&&DOC){readDoc();const v=DOC.visits.find(x=>x.id===ev.target.value);if(v)setDeclFromVisit(v);refreshDocText();paintDoc();return}
  if(DOC&&(id==='d-cidok'||id==='d-2via'||id==='d-pac')){readDoc();if(id==='d-pac'){const p=patients().find(x=>norm(x.name)===norm(DOC.paciente));if(p){DOC.pkey=p.key;if(p.cpf&&!DOC.cpf)DOC.cpf=p.cpf;DOC.visits=p.visits.slice().reverse();DOC.desde=p.visits.length?dayKey(p.visits[0].start):DOC.desde;const lp=DOC.visits.find(v=>v.start<=new Date())||DOC.visits[0];if(lp)setDeclFromVisit(lp);paintDoc()}}refreshDocText()}
});
document.addEventListener('paste',ev=>{
  if(!CAD||CAD.lendo)return;const fs=[...((ev.clipboardData&&ev.clipboardData.files)||[])].filter(f=>/^image\//.test(f.type));
  if(fs.length){ev.preventDefault();lerPrint(fs[0])}
});
document.addEventListener('keydown',ev=>{if(ev.target&&ev.target.id==='ai-text'&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();aiSend();return}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&document.getElementById('sheet-root').firstChild)closeSheet()});

/* Tema e modo discreto */
const themeBtn=document.getElementById('theme'),disc=document.getElementById('discreto');
function isDark(){const t=document.documentElement.getAttribute('data-theme');if(t)return t==='dark';return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches}
function paintTheme(){themeBtn.innerHTML=ic(isDark()?'sun':'moon');themeBtn.setAttribute('aria-label',isDark()?'Usar tema claro':'Usar tema escuro')}
themeBtn.addEventListener('click',()=>{const next=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',next);store('painel-tema',next);paintTheme()});
function setDisc(on){document.body.classList.toggle('discreto',on);disc.setAttribute('aria-pressed',String(on));disc.innerHTML=ic(on?'eyeoff':'eye');disc.setAttribute('aria-label',on?'Desligar modo discreto':'Ligar modo discreto');store('painel-discreto',on)}
disc.addEventListener('click',()=>setDisc(!document.body.classList.contains('discreto')));
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme)}catch(_){}

/* ---------- Início ---------- */
document.getElementById('today-label').textContent=cap(fDay.format(new Date()));
{const t=store('painel-tema');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}
paintTheme();setDisc(!!store('painel-discreto'));document.getElementById('ai-fab').innerHTML=ic('spark')+'Assistente';
const saved=store('painel-aba');const hash=(location.hash||'').slice(1);
if(TABS.some(t=>t[0]===hash))S.tab=hash;else if(TABS.some(t=>t[0]===saved))S.tab=saved;
paintTabs();render();

(async function boot(){
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [mcp,db,dl,sample]=await Promise.all([use('mcp'),use('db'),use('downloads'),use('sample')]);
  S.mcp=mcp;S.db=db;S.dl=dl;S.sample=sample;
  watchAgenda();watchMail();watchPend();watchMoldes();watchReceitas();watchCad();watchMap('confirmacoes','conf');watchMap('pagamentos','pag');watchMap('contatos','contato');loadRecent();loadLabels();loadWaiting();
  if(!db)S.pend.status='nodb';
  render();
})();
})();
</script>
