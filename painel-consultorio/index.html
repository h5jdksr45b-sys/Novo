<title>Painel do Consultório</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de uma coluna. Cabeçalho com marca, navegação em pílula fixa no topo, cartões brancos sobre fundo cinza.
   Referência: painel claro com pílula preta ativa e destaque laranja, com versão escura equivalente. */
:root{
  --bg:#eeedeb;
  --card:#ffffff;
  --card-2:#f6f5f3;
  --line:rgba(28,24,20,.08);
  --line-2:rgba(28,24,20,.15);
  --fg:#18171a;
  --muted:#66625d;
  --dim:#98938c;
  --accent:#e2542c;
  --accent-ink:#ffffff;
  --accent-soft:rgba(226,84,44,.11);
  --pill:#18171a;
  --pill-fg:#ffffff;
  --ok:#23864d;
  --ok-soft:rgba(35,134,77,.11);
  --warn:#b97a0c;
  --warn-soft:rgba(185,122,12,.12);
  --bad:#cc3a2b;
  --bad-soft:rgba(204,58,43,.1);
  --shadow:0 1px 2px rgba(28,24,20,.05),0 6px 20px rgba(28,24,20,.04);
  --scrim:rgba(20,18,16,.42);
  --f-ui:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0d0f;--card:#17171a;--card-2:#202024;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.14);
  --fg:#f1f0ee;--muted:#a7a39e;--dim:#75716c;--accent:#ff6b3f;--accent-ink:#1a0d08;--accent-soft:rgba(255,107,63,.15);
  --pill:#f1f0ee;--pill-fg:#111113;--ok:#4cc27e;--ok-soft:rgba(76,194,126,.14);--warn:#e8ad3f;--warn-soft:rgba(232,173,63,.14);
  --bad:#ff6a58;--bad-soft:rgba(255,106,88,.13);--shadow:0 1px 0 rgba(255,255,255,.03);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0f;--card:#17171a;--card-2:#202024;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.14);
  --fg:#f1f0ee;--muted:#a7a39e;--dim:#75716c;--accent:#ff6b3f;--accent-ink:#1a0d08;--accent-soft:rgba(255,107,63,.15);
  --pill:#f1f0ee;--pill-fg:#111113;--ok:#4cc27e;--ok-soft:rgba(76,194,126,.14);--warn:#e8ad3f;--warn-soft:rgba(232,173,63,.14);
  --bad:#ff6a58;--bad-soft:rgba(255,106,88,.13);--shadow:0 1px 0 rgba(255,255,255,.03);--scrim:rgba(0,0,0,.6);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:inherit}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}

/* Cabeçalho */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.9rem;letter-spacing:.02em}
.brand h1{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.date{font-size:.78rem;color:var(--muted)}
.top-actions{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted);box-shadow:var(--shadow)}
.icon-btn:hover{color:var(--fg)}
.icon-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.icon-btn.flat{box-shadow:none;background:none;border-color:transparent;width:34px;height:34px}
.icon-btn.flat:hover{background:var(--card-2)}

/* Navegação em pílula */
.seg-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:6px 12px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{position:relative;border:0;background:none;border-radius:999px;padding:9px 4px;font-size:.84rem;font-weight:500;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;transition:background .2s,color .2s}
.seg button:hover{color:var(--fg)}
.seg button[aria-selected="true"]{background:var(--pill);color:var(--pill-fg)}
.seg button{overflow:visible}
.seg .bdg{position:absolute;top:-3px;right:2px;display:grid;place-items:center;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.64rem;font-weight:700;box-shadow:0 0 0 2px var(--card)}

/* Blocos comuns */
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{font-size:1rem;font-weight:600;letter-spacing:-.01em}
.card-h .count{font-size:.78rem;color:var(--dim)}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-inline:2px}
.page-h h2{font-size:1.55rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.page-h p{font-size:.86rem;color:var(--muted);margin-top:3px}
.spacer{flex:1}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.84rem;font-weight:500;text-decoration:none;white-space:nowrap;color:var(--fg)}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--pill);border-color:var(--pill);color:var(--pill-fg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--card-2)}
.btn.small{padding:6px 11px;font-size:.78rem}
.btn.danger{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn .ico{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:500;border-radius:999px;padding:2px 8px;background:var(--card-2);color:var(--muted);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.field{width:100%;background:var(--card-2);border:1px solid transparent;border-radius:12px;padding:10px 12px;font-size:.92rem;min-width:0}
.field:focus{border-color:var(--line-2);background:var(--card);outline:none}
textarea.field{min-height:150px;resize:vertical;line-height:1.55}
select.field{appearance:auto}
.search{position:relative}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);width:16px;height:16px}
.search .field{padding-left:36px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line-2);background:none;border-radius:999px;padding:6px 12px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--pill);border-color:var(--pill);color:var(--pill-fg);font-weight:500}
.chip .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.lab{display:flex;flex-direction:column;gap:5px;font-size:.76rem;font-weight:500;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2 .full{grid-column:1/-1}
.notice{border:1px dashed var(--line-2);border-radius:14px;padding:14px;color:var(--muted);font-size:.88rem;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.notice.err{border-style:solid;border-color:var(--bad);background:var(--bad-soft);color:var(--fg)}
.stamp{font-family:var(--f-mono);font-size:.68rem;color:var(--dim)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-size:.8rem;font-weight:500}
.linkish:hover{text-decoration:underline}
.skeleton{height:13px;border-radius:7px;background:linear-gradient(90deg,var(--card-2) 0%,var(--line) 50%,var(--card-2) 100%);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.loading{display:flex;flex-direction:column;gap:10px;padding:6px 0}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card-2);font-weight:600;font-size:.8rem;color:var(--muted)}
.avatar.hot{background:var(--accent-soft);color:var(--accent)}

/* Pendências */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);background:var(--card-2);border-radius:16px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .n{font-size:1.6rem;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.late .n{color:var(--bad)}
.stat.today .n{color:var(--warn)}
.stat[aria-pressed="true"]{background:var(--pill);border-color:var(--pill)}
.stat[aria-pressed="true"] .n,.stat[aria-pressed="true"] .l{color:var(--pill-fg)}
.quick{display:flex;gap:8px}
.quick .field{flex:1}
.group-h{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:4px 2px 0}
.group-h .n{font-family:var(--f-mono);font-weight:400}
.group-h.late{color:var(--bad)}
.group-h.today{color:var(--warn)}
.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tasks .task:first-child{border-top:0}
.tick{flex:none;width:26px;height:26px;margin-top:1px;border-radius:50%;border:2px solid var(--line-2);background:none;display:grid;place-items:center;color:transparent;transition:all .15s}
.tick:hover{border-color:var(--ok);color:var(--ok)}
.tick .ico{width:14px;height:14px;stroke-width:2.6}
.tick.done{background:var(--ok);border-color:var(--ok);color:var(--card)}
.task-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.task-t{font-weight:500;overflow-wrap:anywhere}
.task-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.task-note{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.task-act{flex:none;display:flex;gap:4px;align-items:center}
.task.done .task-t{text-decoration:line-through;color:var(--dim)}
.sug{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.sug:first-of-type{border-top:0}
.sug .src{font-size:.8rem;color:var(--dim)}

/* Agenda */
.today-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bar{height:6px;border-radius:3px;background:var(--card-2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.next{border-top:1px solid var(--line);padding-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.next b{font-weight:600}
.slot{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.slots .slot:first-child{border-top:0}
.slot .time{font-family:var(--f-mono);font-size:.88rem;font-variant-numeric:tabular-nums;padding-top:1px}
.slot .time small{display:block;color:var(--dim);font-size:.7rem}
.slot.past{opacity:.45}
.slot.now .time{color:var(--accent)}
.slot .body{min-width:0;display:flex;flex-direction:column;gap:7px}
.slot .name{font-weight:600}
.live{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}70%{box-shadow:0 0 0 8px transparent}}
.day-h{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0 4px;font-weight:600;font-size:.9rem}

/* Listas (e-mail, pacientes) */
.list{display:flex;flex-direction:column}
.mrow{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.list .mrow:first-child{border-top:0}
.mrow-main{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;padding:12px 2px;background:none;border:0;text-align:left;border-radius:12px}
.mrow-main:hover{background:var(--card-2)}
.mrow .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mrow .top-line{display:flex;align-items:baseline;gap:8px;min-width:0}
.mrow .who{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.mrow .when{font-family:var(--f-mono);font-size:.7rem;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.mrow .subj{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .snip{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.mrow.unread .who,.mrow.unread .subj{font-weight:700}
.mrow.unread .who::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.star{flex:none;width:40px;background:none;border:0;color:var(--dim);display:grid;place-items:center}
.star.on{color:var(--warn)}
.star.on .ico{fill:currentColor}
.prow-chev{color:var(--dim);align-self:center}

/* Folha inferior */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:680px;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));overflow-y:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet::before{content:"";align-self:center;width:38px;height:4px;border-radius:2px;background:var(--line-2);flex:none}
@keyframes up{from{transform:translateY(36px);opacity:.5}}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-head h2{flex:1;min-width:0;font-size:1.2rem;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.toolbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.toolbar::-webkit-scrollbar{display:none}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:.9rem}
.kv dt{color:var(--dim);font-size:.78rem}
.kv dd{margin:0;overflow-wrap:anywhere}
.msg{display:flex;flex-direction:column;gap:8px}
.msg+.msg{border-top:1px solid var(--line);padding-top:12px}
.msg pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f-ui);font-size:.9rem;line-height:1.55;max-height:420px;overflow-y:auto}
.msg.old pre{max-height:120px;color:var(--muted)}
.tpl{background:var(--card-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tpl pre{margin:0;white-space:pre-wrap;font-family:var(--f-ui);font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.compose{display:flex;flex-direction:column;gap:8px}
.cfield{display:flex;align-items:center;gap:8px;background:var(--card-2);border-radius:12px;padding:0 12px}
.cfield label{font-size:.78rem;color:var(--dim);min-width:52px}
.cfield input{flex:1;min-width:0;border:0;background:none;padding:10px 0;font-size:.92rem;outline:none}
.file-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card-2);border-radius:999px;padding:4px 6px 4px 10px;font-size:.78rem;max-width:100%}
.file-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-chip button{border:0;background:none;color:var(--dim);display:grid;place-items:center;padding:2px}
.file-chip .ico{width:14px;height:14px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--pill);color:var(--pill-fg);border-radius:999px;padding:10px 18px;font-size:.85rem;font-weight:500;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* Assistente (IA) */
.ai-fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;height:52px;padding:0 18px 0 14px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.ai-fab .ico{width:20px;height:20px}
.ai-log{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:88%;padding:10px 13px;border-radius:16px;font-size:.9rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--pill);color:var(--pill-fg);border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble.ai.live{color:var(--muted)}
.steps{align-self:flex-start;display:flex;flex-direction:column;gap:4px;font-family:var(--f-mono);font-size:.7rem;color:var(--dim);max-width:100%}
.steps span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps .bad{color:var(--bad)}
.ai-input{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px}
.ai-input textarea{flex:1;min-height:46px;max-height:160px}

/* Modo discreto: nomes e contatos embaçados até tocar */
body.discreto .pii{filter:blur(6px);transition:filter .2s}
body.discreto .pii:hover,body.discreto .pii:focus-within{filter:none}

@media (max-width:440px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .seg button{font-size:.78rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">FS</span>
      <div><div class="date" id="today-label"></div><h1>Consultório</h1></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="discreto" type="button" aria-pressed="false" title="Modo discreto: embaça nomes e contatos"></button>
      <button class="icon-btn" id="theme" type="button" title="Alternar tema claro e escuro"></button>
    </div>
  </header>
  <nav class="seg-wrap" aria-label="Seções do painel"><div class="seg" role="tablist" id="tabs"></div></nav>
  <main id="view" class="view" aria-live="polite"></main>
</div>

<div id="sheet-root"></div>

/* ---------- Utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function localISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':00'}
function dayKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
const fTime=new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'});
const fDay=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'});
const fShort=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'});
const fShortY=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
const fLong=new Intl.DateTimeFormat('pt-BR',{day:'numeric',month:'long',year:'numeric'});
const fWd=new Intl.DateTimeFormat('pt-BR',{weekday:'long'});
const fDM=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit'});
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function relDay(d){const t=startOfDay(new Date()),x=startOfDay(d),n=Math.round((x-t)/864e5);if(n===0)return 'Hoje';if(n===1)return 'Amanhã';if(n===-1)return 'Ontem';return cap(fDay.format(d))}
function ago(ts){if(!ts)return '';const m=Math.round((Date.now()-ts)/6e4);if(m<1)return 'agora';if(m<60)return 'há '+m+' min';return 'às '+fTime.format(new Date(ts))}
function initials(n){const p=String(n||'?').trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()}
function firstName(n){return String(n||'').trim().split(/\s+/)[0]||''}
function mailDate(s){const d=new Date(s);if(isNaN(d))return '';const t=startOfDay(new Date());return d>=t?fTime.format(d):(d.getFullYear()===t.getFullYear()?fShort.format(d):fShortY.format(d))}
function parseSender(s){s=String(s||'');const m=s.match(/^\s*"?([^"<]*)"?\s*<([^>]+)>/);if(m)return {name:m[1].trim()||m[2],email:m[2].trim()};return {name:s.trim(),email:s.trim()}}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()}
function toast(msg){const r=document.getElementById('toast-root');r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>{r.innerHTML=''},2600)}
async function copy(text,label){try{await navigator.clipboard.writeText(text);toast((label||'Texto')+' copiado')}catch(e){toast('Não deu para copiar. Selecione o texto e copie manualmente.')}}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function payload(r){if(!r)return null;if(r.payload!==undefined)return r.payload;return r}
function skel(n){let h='<div class="loading" aria-label="Carregando">';for(let i=0;i<(n||4);i++)h+='<div class="skeleton" style="width:'+(55+((i*17)%40))+'%"></div>';return h+'</div>'}
function plural(n,s,p){return n+' '+(n===1?s:(p||s+'s'))}

/* Mensagem de erro por código, com a ação que resolve */
function errBox(e,server,retryAction){
  const c=e&&e.code;let msg;let btn='';
  switch(c){
    case 'needs_reauth':msg='A conexão com o '+server+' expirou. Reconecte em claude.ai, Configurações, Conectores.';break;
    case 'server_not_connected':msg='O '+server+' não está conectado. Adicione em claude.ai, Configurações, Conectores.';break;
    case 'selection_required':msg='Você tem mais de uma conta do '+server+'. Escolha qual o painel deve usar no aviso do claude.ai.';break;
    case 'approval_required':msg='O painel precisa da sua autorização para usar o '+server+'.';btn='Autorizar e carregar';break;
    case 'not_in_manifest':msg='O acesso ao '+server+' foi recusado para este painel. Libere em Permissões, no menu do artifact.';break;
    case 'blocked_by_policy':msg='A política da conta bloqueia o '+server+' aqui.';break;
    case 'server_unavailable':msg='O '+server+' não respondeu agora.';btn='Tentar de novo';break;
    case 'no_mcp':msg='Abra este painel no claude.ai para ler Agenda e Gmail. Fora dele, os conectores não ficam disponíveis.';break;
    case 'tool_error':msg='O '+server+' recusou o pedido: '+String(e.message||'').slice(0,200);btn='Tentar de novo';break;
    default:msg='Não foi possível carregar do '+server+'. '+String((e&&e.message)||'').slice(0,160);btn='Tentar de novo';
  }
  return '<div class="notice err"><span>'+esc(msg)+'</span>'+(btn&&retryAction?'<button class="btn small" data-act="'+retryAction+'">'+btn+'</button>':'')+'</div>';
}

/* ---------- Conectores ---------- */
async function call(server,tool,input,opts){
  if(!S.mcp)throw {code:'no_mcp'};
  const r=await S.mcp.callTool(server,tool,input,opts);
  return payload(r);
}
function invalidate(server){if(S.mcp&&S.mcp.invalidate)S.mcp.invalidate(server).catch(()=>{})}

/* ---------- Agenda ---------- */
function parseEvent(e){
  const d=String(e.description||'');
  const get=k=>{const m=d.match(new RegExp('^\\s*'+k+'\\s*:\\s*(.+)$','im'));return m?m[1].trim():''};
  let name=get('Paciente'),tipo=get('Tipo');
  if(!name){const m=String(e.summary||'').match(/^\s*(primeira consulta|retorno|consulta|sess[aã]o)\s*[-–—:]\s*(.+)$/i);if(m){tipo=tipo||m[1];name=m[2].trim()}}
  const st=e.start||{},en=e.end||{};
  const start=new Date(st.dateTime||(st.date?st.date+'T00:00:00':''));
  const end=new Date(en.dateTime||(en.date?en.date+'T00:00:00':''));
  return {id:e.id,title:e.summary||'(sem título)',start,end,allDay:!st.dateTime,name,tipo,email:get('E-?mail'),phone:get('Telefone'),cpf:get('CPF'),link:e.htmlLink,patient:!!name,status:e.status};
}
function parseEvents(p){return ((p&&p.events)||[]).filter(e=>e.status!=='cancelled').map(parseEvent).filter(e=>!isNaN(e.start))}
function agendaInput(){const t=startOfDay(new Date());return {startTime:localISO(t),endTime:localISO(addDays(t,8)),orderBy:'startTime',pageSize:120}}
function watchAgenda(){
  if(unwatchAgenda){unwatchAgenda();unwatchAgenda=null}
  if(!S.mcp){S.agenda={status:'error',events:[],err:{code:'no_mcp'}};render();return}
  S.agenda.status=S.agenda.events.length?'ready':'loading';
  unwatchAgenda=S.mcp.watchTool(CAL,'list_events',agendaInput(),ev=>{
    if(ev.type==='data'){
      S.agenda={status:'ready',events:parseEvents(payload(ev.result)),err:null,at:(ev.result.cache&&ev.result.cache.storedAt)||Date.now()};
    }else{
      const c=ev.error&&ev.error.code;
      const keep=(c==='server_unavailable'||c==='upstream_error')&&S.agenda.events.length;
      S.agenda={status:keep?'ready':'error',events:keep?S.agenda.events:[],err:ev.error,at:S.agenda.at};
    }
    if(S.tab==='agenda'||S.tab==='pendencias')render();
  },{refetchInterval:5*60*1000,cache:{staleTime:60000}});
}
async function loadAgendaOnce(){
  S.agenda.status='loading';render();
  try{const p=await call(CAL,'list_events',agendaInput(),{cache:{refresh:true}});
    S.agenda={status:'ready',events:parseEvents(p),err:null,at:Date.now()};
    watchAgenda();
  }catch(e){S.agenda={status:'error',events:[],err:e}}
  render();
}

function renderAgenda(){
  const a=S.agenda;
  let h='<div class="page-h"><div><h2>Agenda</h2><p>'+esc(cap(fDay.format(new Date())))+'</p></div><span class="spacer"></span><button class="icon-btn flat" data-act="agenda-retry" title="Atualizar" aria-label="Atualizar agenda">'+ic('refresh')+'</button><button class="btn primary small" data-act="book">'+ic('plus')+'Encaixar</button></div>';
  if(a.status==='loading')return h+'<div class="card">'+skel(4)+'</div>';
  if(a.status==='error')return h+errBox(a.err,CAL,'agenda-retry');
  const now=new Date(),t0=startOfDay(now),t1=addDays(t0,1);
  const today=a.events.filter(e=>e.start>=t0&&e.start<t1&&!e.allDay);
  const pats=today.filter(e=>e.patient);
  const left=pats.filter(e=>e.end>now);
  const next=a.events.find(e=>e.patient&&e.start>now);
  const missing=pats.filter(e=>!e.phone||!e.email);
  h+='<div class="card"><div class="today-stats">'+
    '<div class="stat"><span class="n">'+pats.length+'</span><span class="l">consultas hoje</span></div>'+
    '<div class="stat"><span class="n">'+left.length+'</span><span class="l">por atender</span></div>'+
    '<div class="stat"><span class="n">'+a.events.filter(e=>e.patient&&e.start>=t1).length+'</span><span class="l">próximos 7 dias</span></div></div>';
  if(pats.length){const done=pats.length-left.length;h+='<div class="row"><span class="bar" aria-hidden="true"><i style="width:'+Math.round(done/pats.length*100)+'%"></i></span><span class="stamp">'+done+' de '+pats.length+' atendidas</span></div>'}
  if(next){const mins=Math.round((next.start-now)/6e4);const when=mins<60?'em '+mins+' min':(next.start<t1?'às '+fTime.format(next.start):relDay(next.start).toLowerCase()+', '+fTime.format(next.start));
    h+='<div class="next"><span class="pill accent">Próxima</span><b class="pii">'+esc(next.name)+'</b><span class="pill">'+esc(next.tipo||'Consulta')+'</span><span class="spacer"></span><span class="stamp">'+esc(when)+'</span></div>'}
  if(missing.length)h+='<div class="next"><span class="pill warn">Faltam dados</span><span class="pii" style="color:var(--muted);font-size:.85rem">'+missing.map(e=>esc(e.name)).join(', ')+' sem telefone ou e-mail na agenda</span></div>';
  h+='</div>';
  h+=renderConfirmacoes();

  const livres=freeSlots(dayKey(now),a.events).filter(f=>!f.busy&&!f.past);
  h+='<div class="card"><div class="card-h"><h2>Hoje</h2><span class="count">'+plural(today.length,'compromisso')+'</span></div>';
  h+='<div class="row" style="gap:6px"><span class="stamp" style="margin-right:2px">Livres</span>'+(livres.length?livres.map(f=>'<button class="chip" data-act="book" data-date="'+dayKey(now)+'" data-hm="'+f.hm+'">'+f.hm+'</button>').join(''):'<span class="stamp">nenhum</span>')+'</div>';
  if(!today.length)h+='<div class="notice">Nenhum compromisso na agenda hoje.</div>';
  else{h+='<div class="slots">';today.forEach(e=>{h+=slotHTML(e,now)});h+='</div>'}
  h+='<span class="stamp">Agenda Google, atualizada '+esc(ago(a.at))+'</span></div>';

  const later=a.events.filter(e=>e.start>=t1);
  if(later.length){
    h+='<div class="card"><div class="card-h"><h2>Próximos dias</h2></div><div>';
    let cur='';later.forEach(e=>{const k=dayKey(e.start);if(k!==cur){cur=k;const n=later.filter(x=>dayKey(x.start)===k&&x.patient).length;const fr=freeSlots(k,a.events).filter(f=>!f.busy).length;h+='<div class="day-h"><span>'+esc(relDay(e.start))+'</span><span class="stamp">'+plural(n,'consulta')+' · '+plural(fr,'livre')+'</span></div>'}h+=slotHTML(e,now)});
    h+='</div></div>';
  }
  return h;
}
function slotHTML(e,now){
  const cls=e.end<now?'past':(e.start<=now&&e.end>now?'now':'');
  let h='<div class="slot '+cls+'"><div class="time">'+(e.allDay?'dia':esc(fTime.format(e.start)))+(e.allDay?'':'<small>'+esc(fTime.format(e.end))+'</small>')+'</div><div class="body">';
  if(e.patient){

/* ---------- Marcar, remarcar e cancelar ---------- */
const SLOTS=['09:00','09:45','10:30','11:15','12:45','13:30','14:15'];
const DUR=45;
const TIPOS=['Primeira consulta','Retorno'];
let B=null;
function slotDate(dk,hm){const [y,m,d]=dk.split('-').map(Number);const [h,mi]=hm.split(':').map(Number);return new Date(y,m-1,d,h,mi)}
function freeSlots(dk,events,exceptId){
  const now=new Date();
  return SLOTS.map(hm=>{const s=slotDate(dk,hm),e=new Date(s.getTime()+DUR*6e4);
    const clash=events.find(ev=>ev.id!==exceptId&&!ev.allDay&&ev.start<e&&ev.end>s);
    return {hm,start:s,past:s<=now,busy:!!clash,who:clash?(clash.name||clash.title):''}});
}
function nextWorkday(d){let x=startOfDay(d);while(x.getDay()===0||x.getDay()===6)x=addDays(x,1);return x}
async function eventsOn(dk){
  const t0=slotDate(dk,'00:00'),t1=addDays(t0,1);
  const cached=S.agenda.status==='ready'&&t0>=startOfDay(new Date())&&t1<=addDays(startOfDay(new Date()),8);
  if(cached)return S.agenda.events.filter(e=>e.start<t1&&e.end>t0);
  const p=await call(CAL,'list_events',{startTime:localISO(t0),endTime:localISO(t1),orderBy:'startTime',pageSize:50},{cache:{refresh:true}});
  return parseEvents(p);
}
function openBooking(o){
  const today=new Date();const pastLast=SLOTS.every(hm=>slotDate(dayKey(today),hm)<=today);
  B=Object.assign({mode:'new',evId:null,date:dayKey(nextWorkday(pastLast?addDays(today,1):today)),slot:null,nome:'',tipo:'Retorno',email:'',phone:'',events:null,confirm:false,busyMsg:'',done:null},o||{});
  loadBookingDay();
}
async function loadBookingDay(){
  B.events=null;B.slot=null;B.confirm=false;paintBooking();
  try{B.events=await eventsOn(B.date);B.err=null}catch(e){B.err=e;B.events=[]}
  paintBooking();
}
function sheetHead(title,extra){return '<div class="sheet-head"><h2>'+title+'</h2>'+(extra||'')+'<button class="icon-btn" data-act="close" aria-label="Fechar">'+ic('x')+'</button></div>'}
function paintBooking(){
  if(!B)return;
  const isMove=B.mode==='move';
  let h=sheetHead(isMove?'Remarcar consulta':'Marcar consulta');
  if(B.done){h+='<div class="notice"><span>'+esc(B.done)+'</span><button class="btn small" data-act="close">Fechar</button></div>';openSheet(h);return}
  h+='<div class="card">';
  if(isMove)h+='<div class="notice"><span class="pii"><b>'+esc(B.nome)+'</b>, '+esc(B.tipo)+'. Hoje marcada para '+esc(relDay(B.from).toLowerCase())+', '+esc(fTime.format(B.from))+'.</span></div>';
  h+='<label class="lab" for="b-date">Dia<input class="field" id="b-date" type="date" value="'+esc(B.date)+'"></label>';
  const wd=slotDate(B.date,'12:00').getDay();if(wd===0||wd===6)h+='<span class="pill warn" style="align-self:flex-start">Fim de semana</span>';
  h+='<span class="stamp">Horários de 45 minutos</span>';
  if(B.err)h+=errBox(B.err,CAL);
  else if(!B.events)h+=skel(2);
  else{const fs=freeSlots(B.date,B.events,B.evId);
    h+='<div class="chips wrap">'+fs.map(f=>'<button class="chip" data-act="b-slot" data-hm="'+f.hm+'" aria-pressed="'+(B.slot===f.hm)+'" '+(f.busy||f.past?'disabled style="opacity:.35;text-decoration:line-through"':'')+' title="'+esc(f.busy?'Ocupado':f.past?'Já passou':'Livre')+'">'+f.hm+'</button>').join('')+'</div>';
    if(!fs.some(f=>!f.busy&&!f.past))h+='<div class="notice">Nenhum horário livre neste dia. Escolha outra data.</div>';
  }
  h+='</div>';
  if(!isMove){
    h+='<div class="card grid2"><label class="lab full" for="b-nome">Nome do paciente<input class="field pii" id="b-nome" list="b-pacs" value="'+esc(B.nome)+'" autocomplete="off"><datalist id="b-pacs">'+patientNames().map(n=>'<option value="'+esc(n)+'"></option>').join('')+'</datalist></label>'+
      '<label class="lab" for="b-tipo">Tipo<select class="field" id="b-tipo">'+TIPOS.map(t=>'<option'+(t===B.tipo?' selected':'')+'>'+t+'</option>').join('')+'</select></label>'+
      '<label class="lab" for="b-phone">Telefone<input class="field pii" id="b-phone" value="'+esc(B.phone)+'" inputmode="tel" autocomplete="off"></label>'+
      '<label class="lab full" for="b-email">E-mail<input class="field pii" id="b-email" type="email" value="'+esc(B.email)+'" autocomplete="off"></label></div>';
  }
  if(B.busyMsg)h+='<div class="notice err">'+B.busyMsg+'</div>';
  const when=B.slot?cap(fDay.format(slotDate(B.date,B.slot)))+', '+B.slot:'';
  if(B.confirm)h+='<div class="tpl"><strong>Confirma?</strong><span class="pii">'+esc((isMove?'Mover ':'')+B.tipo+', '+B.nome)+'</span><span>'+esc(when)+'</span></div><div class="row"><button class="btn ghost" data-act="b-back">Voltar</button><span class="spacer"></span><button class="btn accent" data-act="b-save" id="b-save">'+(isMove?'Confirmar remarcação':'Confirmar e marcar')+'</button></div>';
  else h+='<div class="row"><span class="stamp">'+esc(when||'Escolha um horário')+'</span><span class="spacer"></span><button class="btn primary" data-act="b-next" '+(B.slot?'':'disabled')+'>'+(isMove?'Remarcar':'Marcar')+'</button></div>';
  openSheet(h);
}
function readBookingFields(){
  ['nome','phone','email'].forEach(k=>{const el=document.getElementById('b-'+k);if(el)B[k]=el.value.trim()});
  const t=document.getElementById('b-tipo');if(t)B.tipo=t.value;
}
async function saveBooking(){
  const btn=document.getElementById('b-save');if(btn){btn.disabled=true;btn.textContent='Salvando…'}
  const s=slotDate(B.date,B.slot),e=new Date(s.getTime()+DUR*6e4);
  try{
    // confere de novo o dia, para não sobrepor um horário marcado por outro caminho
    const fresh=await eventsOn(B.date).catch(()=>B.events);
    if(freeSlots(B.date,fresh,B.evId).find(f=>f.hm===B.slot).busy){B.events=fresh;B.slot=null;B.confirm=false;B.busyMsg='Esse horário acabou de ser ocupado. Escolha outro.';paintBooking();return}
    if(B.mode==='move'){
      await call(CAL,'update_event',{eventId:B.evId,startTime:localISO(s),endTime:localISO(e),notificationLevel:'NONE'});
      B.done='Consulta remarcada para '+cap(fDay.format(s)).toLowerCase()+', '+B.slot+'.';
    }else{
      const desc='Paciente: '+B.nome+'\nTipo: '+B.tipo+(B.email?'\nE-mail: '+B.email:'')+(B.phone?'\nTelefone: '+B.phone:'');
      await call(CAL,'create_event',{summary:B.tipo+' - '+B.nome,description:desc,startTime:localISO(s),endTime:localISO(e),notificationLevel:'NONE'});
      B.done='Consulta marcada: '+B.tipo.toLowerCase()+', '+cap(fDay.format(s)).toLowerCase()+', '+B.slot+'. A vaga só fica garantida depois do PIX.';
    }
    afterCalendarWrite();
  }catch(err){
    const amb=err&&(err.code==='server_unavailable'||err.code==='upstream_error');
    B.busyMsg=amb?'O Google Agenda não respondeu. A mudança pode ter sido feita: confira a agenda antes de tentar de novo.':esc(err&&err.message||'Não foi possível salvar na agenda.');
    B.confirm=false;if(amb){afterCalendarWrite()}
  }
  paintBooking();
}
function afterCalendarWrite(){invalidate(CAL);S.pac.status='idle';S.pac.events=[];loadAgendaOnce()}
async function cancelEvent(id,btn){
  btn.disabled=true;btn.textContent='Cancelando…';
  try{await call(CAL,'delete_event',{eventId:id,notificationLevel:'NONE'});toast('Consulta cancelada e removida da agenda');afterCalendarWrite()}
  catch(err){const amb=err&&(err.code==='server_unavailable'||err.code==='upstream_error');toast(amb?'Sem resposta da agenda. Confira se foi cancelada antes de tentar de novo.':'Não foi possível cancelar');if(amb)afterCalendarWrite();else{btn.disabled=false;btn.textContent='Confirmar cancelamento'}}
}

/* ---------- Pacientes ---------- */
function patKey(e){return e.email?e.email.toLowerCase():'n:'+norm(e.name)}
let PMEMO={};
function patients(){if(PMEMO.v&&PMEMO.a===S.pac.events&&PMEMO.b===S.agenda.events&&PMEMO.c===S.cad)return PMEMO.v;PMEMO={a:S.pac.events,b:S.agenda.events,c:S.cad,v:patientsRaw()};return PMEMO.v}
function patientsRaw(){
  const map=new Map();
  const all=S.pac.events.length?S.pac.events:S.agenda.events;
  all.forEach(e=>{if(!e.patient)return;const k=patKey(e);let p=map.get(k);
    if(!p){p={key:k,name:e.name,email:e.email,phone:e.phone,cpf:e.cpf,visits:[]};map.set(k,p)}
    if(e.name.length>p.name.length)p.name=e.name;if(!p.email&&e.email)p.email=e.email;if(!p.phone&&e.phone)p.phone=e.phone;if(!p.cpf&&e.cpf)p.cpf=e.cpf;
    if(!p.visits.some(v=>v.id===e.id))p.visits.push({id:e.id,start:e.start,end:e.end,tipo:e.tipo,link:e.link});
  });
  // junta o cadastro do painel com a agenda: mesmo e-mail, mesmo CPF ou mesmo nome
  S.cad.forEach(c=>{
    const em=String(c.email||'').toLowerCase(),nn=norm(c.nome),cd=digits(c.cpf);
    let p=[...map.values()].find(x=>(em&&x.email&&x.email.toLowerCase()===em)||(cd&&digits(x.cpf)===cd)||(nn&&norm(x.name)===nn));
    if(!p){p={key:'c:'+c.id,name:c.nome,visits:[]};map.set(p.key,p)}
    p.cad=c;if(c.nome)p.name=c.nome;if(c.email)p.email=c.email;if(c.telefone)p.phone=c.telefone;if(c.cpf)p.cpf=c.cpf;p.nasc=c.nascimento||'';
  });
  const now=new Date();
  const arr=[...map.values()].map(p=>{p.visits.sort((a,b)=>a.start-b.start);p.next=p.visits.find(v=>v.start>now)||null;const past=p.visits.filter(v=>v.start<=now);p.last=past[past.length-1]||null;p.done=past.length;return p});
  arr.sort((a,b)=>{if(a.next&&b.next)return a.next.start-b.next.start;if(a.next)return -1;if(b.next)return 1;return (b.last?b.last.start:0)-(a.last?a.last.start:0)});
  return arr;
}
async function loadPatients(){
  if(S.pac.status==='loading')return;
  S.pac.status='loading';render();
  const t=startOfDay(new Date());
  let out=[],token=null,pages=0;
  try{
    do{const inp={startTime:localISO(addDays(t,-365)),endTime:localISO(addDays(t,120)),orderBy:'startTime',pageSize:250,fullText:'Paciente'};if(token)inp.pageToken=token;
      const p=await call(CAL,'list_events',inp,{cache:{staleTime:120000}})||{};
      out=out.concat(parseEvents(p));
      token=p.nextPageToken;pages++;
    }while(token&&pages<6);
    // eventos antigos que só têm o nome no título
    try{const p2=await call(CAL,'list_events',{startTime:localISO(addDays(t,-365)),endTime:localISO(addDays(t,120)),orderBy:'startTime',pageSize:250,fullText:'Retorno'},{cache:{staleTime:120000}});
      parseEvents(p2).forEach(e=>{if(!out.some(x=>x.id===e.id))out.push(e)})}catch(_){}
    S.pac.events=out;S.pac.status='ready';S.pac.err=null;
  }catch(e){S.pac.status='error';S.pac.err=e}
  render();
}
const PAC_ACOES=[['ficha','Abrir ficha'],['receita','Receita Memed'],['atestado','Atestado'],['relatorio','Relatório'],['declaracao','Declaração'],['exames','Exames']];

  h+='<div class="search">'+ic('search')+'<input class="field" id="pac-q" type="search" placeholder="Buscar por nome, e-mail ou telefone" value="'+esc(S.pac.q)+'" autocomplete="off"></div>';

  else{h+='<div class="list">';f.slice(0,150).forEach(p=>{
    const sub=p.next?'Próxima: '+relDay(p.next.start)+', '+fTime.format(p.next.start):(p.last?'Última: '+fShortY.format(p.last.start):'');
    h+='<div class="mrow"><button class="mrow-main" data-act="pac-tap" data-key="'+esc(p.key)+'"><span class="avatar pii'+(p.next?' hot':'')+'">'+esc(initials(p.name))+'</span><span class="txt"><span class="top-line"><span class="who pii">'+esc(p.name)+'</span><span class="when">'+plural(p.done,'consulta')+'</span></span><span class="snip">'+esc(sub)+'</span></span>'+(acao==='ficha'?'<svg viewBox="0 0 24 24" class="ico prow-chev" aria-hidden="true">'+I.chev+'</svg>':'<span class="pill accent">'+esc((PAC_ACOES.find(a=>a[0]===acao)||[])[1])+'</span>')+'</button>'+
      (acao!=='ficha'?'<button class="star" data-act="open-patient" data-key="'+esc(p.key)+'" aria-label="Abrir ficha" title="Abrir ficha">'+ic('dots')+'</button>':'')+'</div>'});
    h+='</div>'}
  return h+'</div>';
}

function fillMsg(t,p){
  const v=p&&p.next;
  return t.replace(/\[NOME\]/g,firstName(p&&p.name)||'[NOME]')
    .replace(/\[DIA\]/g,v?cap(fWd.format(v.start)):'[DIA]')
    .replace(/\[DATA\]/g,v?fDM.format(v.start):'[DATA]')
    .replace(/\[HORÁRIO\]/g,v?fTime.format(v.start):'[HORÁRIO]');
}

/* ---------- E-mail ---------- */
const MAIL_FILTERS=[
  ['principal','Principal','in:inbox category:primary'],
  ['naolidos','Não lidos','in:inbox category:primary is:unread'],
  ['aguardando','Esperando resposta','in:inbox category:primary newer_than:30d older_than:1d'],
  ['pacientes','Pacientes','label:pacientes'],
  ['estrela','Com estrela','is:starred'],
  ['importantes','Importantes','in:inbox is:important'],
  ['anexo','Com anexo','in:inbox has:attachment -category:promotions -category:social'],
  ['enviados','Enviados','in:sent'],
  ['rascunhos','Rascunhos',null],
  ['tudo','Caixa toda','in:inbox']
];
function allMailFilters(){
  const extra=S.mail.labels.filter(l=>l.labelType==='USER'&&l.labelListVisibility==='LABEL_SHOW'&&norm(l.name)!=='pacientes').map(l=>['lbl:'+l.labelId,l.name,'label:"'+l.name.replace(/"/g,'')+'"']);
  return MAIL_FILTERS.slice(0,7).concat(extra,MAIL_FILTERS.slice(7));
}
function mailQuery(){if(S.mail.q.trim())return S.mail.q.trim();const f=allMailFilters().find(x=>x[0]===S.mail.filter)||MAIL_FILTERS[0];return f[2]}
function hasLabel(t,l){return (t.messages||[]).some(m=>(m.labelIds||[]).includes(l))}
function setThreadLabel(id,l,on){[S.mail.threads,S.mail.extra].forEach(arr=>arr.forEach(t=>{if(t.id!==id)return;(t.messages||[]).forEach(m=>{const s=new Set(m.labelIds||[]);on?s.add(l):s.delete(l);m.labelIds=[...s]})}))}
function dropThread(id){S.mail.threads=S.mail.threads.filter(t=>t.id!==id);S.mail.extra=S.mail.extra.filter(t=>t.id!==id)}
function countUnread(){if(S.mail.filter==='principal'&&!S.mail.q){S.unread=S.mail.threads.filter(t=>hasLabel(t,'UNREAD')).length;paintTabs()}}
function watchMail(){
  if(unwatchMail){unwatchMail();unwatchMail=null}
  S.mail.extra=[];S.mail.next=null;
  if(S.mail.filter==='rascunhos'&&!S.mail.q){loadDrafts();return}
  if(!S.mcp){S.mail.status='error';S.mail.err={code:'no_mcp'};render();return}
  S.mail.status='loading';
  unwatchMail=S.mcp.watchTool(GMAIL,'search_threads',{query:mailQuery(),pageSize:25},ev=>{
    if(ev.type==='data'){const p=payload(ev.result)||{};S.mail.threads=p.threads||[];S.mail.next=p.nextPageToken||null;S.mail.status='ready';S.mail.err=null;S.mail.at=(ev.result.cache&&ev.result.cache.storedAt)||Date.now();countUnread()}
    else{const c=ev.error&&ev.error.code;if(!((c==='server_unavailable'||c==='upstream_error')&&S.mail.threads.length)){S.mail.status='error';S.mail.threads=[]}S.mail.err=ev.error}
    if(S.tab==='email')render();
  },{refetchInterval:2*60*1000,cache:{staleTime:30000}});
}
async function loadMoreMail(){
  if(!S.mail.next||S.mail.moreBusy)return;
  S.mail.moreBusy=true;render();
  try{const p=await call(GMAIL,'search_threads',{query:mailQuery(),pageSize:25,pageToken:S.mail.next})||{};
    const seen=new Set(S.mail.threads.concat(S.mail.extra).map(t=>t.id));
    S.mail.extra=S.mail.extra.concat((p.threads||[]).filter(t=>!seen.has(t.id)));S.mail.next=p.nextPageToken||null;
  }catch(e){toast('Não foi possível carregar mais e-mails')}
  S.mail.moreBusy=false;render();
}
async function loadLabels(){
  try{const r=await call(GMAIL,'list_labels',{},{cache:{staleTime:600000}});S.mail.labels=(r&&r.labels)||[];if(S.tab==='email')render()}catch(_){}
}
async function loadDrafts(){
  S.drafts.status='loading';render();
  try{const r=await call(GMAIL,'list_drafts',{pageSize:30,view:'DRAFT_VIEW_FULL'},{cache:{refresh:true}});S.drafts.list=(r&&r.drafts)||[];S.drafts.status='ready';S.drafts.err=null}
  catch(e){S.drafts.status='error';S.drafts.err=e}
  render();
}
function threadRow(t){
  const ms=t.messages||[];const m=ms[ms.length-1]||{};const first=ms[0]||m;
  const unread=hasLabel(t,'UNREAD'),star=hasLabel(t,'STARRED');
  const s=parseSender(m.sender);
  const sent=/drfabioschmidt@gmail\.com/i.test(s.email);
  const who=sent?'Para: '+((m.toRecipients||[])[0]||''):s.name;
  return '<div class="mrow'+(unread?' unread':'')+'"><button class="mrow-main" data-act="open-thread" data-id="'+esc(t.id)+'"><span class="avatar pii">'+esc(initials(sent?((m.toRecipients||[])[0]||'?'):s.name))+'</span><span class="txt"><span class="top-line"><span class="who pii">'+esc(who)+(ms.length>1?' <span class="stamp">'+ms.length+'</span>':'')+'</span><span class="when">'+esc(mailDate(m.date))+'</span></span><span class="subj">'+esc(first.subject||'(sem assunto)')+'</span><span class="snip pii">'+esc(m.snippet||'')+'</span></span></button><button class="star'+(star?' on':'')+'" data-act="star" data-id="'+esc(t.id)+'" aria-pressed="'+star+'" aria-label="'+(star?'Tirar estrela':'Marcar com estrela')+'">'+ic('star')+'</button></div>';
}
function renderEmail(){
  let h='<div class="page-h"><div><h2>E-mail</h2><p>'+(S.unread?plural(S.unread,'conversa não lida','conversas não lidas')+' na Principal':'Caixa Principal, sem promoções')+'</p></div><span class="spacer"></span><button class="btn accent small" data-act="compose">'+ic('plus')+'Novo e-mail</button></div>';
  h+='<div class="card">';
  h+='<form id="mail-search" class="search">'+ic('search')+'<input class="field" id="mail-q" type="search" placeholder="Buscar: nome, assunto, from:alguem@email.com" value="'+esc(S.mail.q)+'" autocomplete="off"></form>';
  h+='<div class="chips" role="group" aria-label="Filtro">'+allMailFilters().map(f=>'<button class="chip" data-act="mail-filter" data-f="'+esc(f[0])+'" aria-pressed="'+(S.mail.filter===f[0]&&!S.mail.q)+'">'+esc(f[1])+'</button>').join('')+'</div>';
  if(S.mail.q)h+='<div class="row"><span class="stamp">Resultados para '+esc(S.mail.q)+'</span><button class="linkish" data-act="mail-clear">Limpar busca</button></div>';
  if(S.mail.filter==='rascunhos'&&!S.mail.q)return h+renderDrafts()+'</div>';
  if(S.mail.status==='loading')h+=skel(7);
  else if(S.mail.status==='error')h+=errBox(S.mail.err,GMAIL,'mail-retry');
  else{let all=S.mail.threads.concat(S.mail.extra);if(S.mail.filter==='aguardando'&&!S.mail.q){all=all.filter(waitingThread);h+='<span class="stamp">Conversas da Principal em que a última mensagem é de outra pessoa, há mais de um dia.</span>'}
    if(!all.length)h+='<div class="notice">Nenhuma conversa aqui.</div>';
    else{h+='<div class="list">'+all.map(threadRow).join('')+'</div>';
      if(S.mail.next)h+='<button class="btn" data-act="mail-more" style="align-self:center" '+(S.mail.moreBusy?'disabled':'')+'>'+(S.mail.moreBusy?'Carregando…':'Carregar mais')+'</button>'}
    h+='<span class="stamp">Gmail, atualizado '+esc(ago(S.mail.at))+'</span>'}
  return h+'</div>';
}
function renderDrafts(){
  const D=S.drafts;
  if(D.status==='loading'||D.status==='idle')return skel(5);
  if(D.status==='error')return errBox(D.err,GMAIL,'drafts-retry');
  if(!D.list.length)return '<div class="notice">Nenhum rascunho.</div>';
  return '<div class="list">'+D.list.map(d=>'<div class="mrow"><button class="mrow-main" data-act="open-draft" data-id="'+esc(d.id)+'"><span class="avatar">'+ic('doc')+'</span><span class="txt"><span class="top-line"><span class="who pii">Para: '+esc((d.toRecipients||[]).join(', ')||'(sem destinatário)')+'</span><span class="when">'+esc(mailDate(d.date))+'</span></span><span class="subj">'+esc(d.subject||'(sem assunto)')+'</span><span class="snip pii">'+esc(d.snippet||'')+'</span></span></button></div>').join('')+'</div>';
}
function openDraft(id){
  const d=S.drafts.list.find(x=>x.id===id);if(!d)return;
  let h=sheetHead(esc(d.subject||'(sem assunto)'));
  h+='<div class="card"><dl class="kv"><dt>Para</dt><dd class="pii">'+esc((d.toRecipients||[]).join(', ')||'(sem destinatário)')+'</dd><dd></dd></dl><div class="msg"><pre class="pii">'+esc(String(d.plaintextBody||d.snippet||'').trim())+'</pre></div></div>';
  h+='<div class="row">'+(d.viewUrl?'<a class="btn" href="'+esc(d.viewUrl)+'" target="_blank" rel="noopener">'+ic('open')+'Editar no Gmail</a>':'')+'<span class="spacer"></span>'+((d.toRecipients||[]).length?'<button class="btn accent" data-act="draft-send" data-id="'+esc(d.id)+'">Enviar agora</button>':'')+'</div><div id="draft-msg"></div>';
  openSheet(h);
}
let THREAD=null;
async function openThread(id){
  openSheet(sheetHead('Carregando conversa')+'<div class="card">'+skel(6)+'</div>');
  try{
    const t=await call(GMAIL,'get_thread',{threadId:id,messageFormat:'PLAIN_TEXT'},{cache:{staleTime:30000}})||{};
    const ms=t.messages||[];const last=ms[ms.length-1]||{};const subj=(ms[0]&&ms[0].subject)||'(sem assunto)';
    const from=parseSender(last.sender);
    const me=/drfabioschmidt@gmail\.com/i;
    const lastIn=ms.slice().reverse().find(m=>!me.test(parseSender(m.sender).email));
    const replyTo=me.test(from.email)?((last.toRecipients||[])[0]||''):from.email;
    const labels=new Set();ms.forEach(m=>(m.labelIds||[]).forEach(l=>labels.add(l)));
    THREAD={id,subj,ms,last,replyTo,replyName:lastIn?parseSender(lastIn.sender).name:'',labels,viewUrl:t.viewUrl};
    paintThread();
    if(labels.has('UNREAD')){labels.delete('UNREAD');setThreadLabel(id,'UNREAD',false);countUnread();if(S.tab==='email')render();
      call(GMAIL,'unlabel_thread',{threadId:id,labelIds:['UNREAD']}).then(()=>invalidate(GMAIL)).catch(()=>{})}
  }catch(e){openSheet(sheetHead('Conversa')+errBox(e,GMAIL))}
}
function userLabelName(id){const l=S.mail.labels.find(x=>x.labelId===id);return l&&l.labelType==='USER'?l.name:''}

  const T=THREAD;if(!T)return;
  let h=sheetHead(esc(T.subj));

    '<button class="btn small primary" data-act="t-reply">'+ic('reply')+'Responder</button>'+
    '<button class="btn small" data-act="t-forward">'+ic('forward')+'Encaminhar</button>'+
    (T.labels.has('INBOX')?'<button class="btn small" data-act="t-archive">'+ic('archive')+'Arquivar</button>':'')+
    '<button class="btn small" data-act="t-unread">'+ic('unread')+'Não lida</button>'+

    '<button class="btn small" data-act="t-trash">'+ic('trash')+'Excluir</button>'+
    '</div>';
  h+='<div id="t-labels-zone"></div><div id="reply-zone"></div>';
  h+='<div class="card">';
  T.ms.forEach((m,i)=>{const s=parseSender(m.sender);const body=m.plaintextBody||m.plaintext_body||m.snippet||'';const old=i<T.ms.length-1;
    h+='<div class="msg'+(old?' old':'')+'"><div class="row"><span class="avatar pii" style="width:32px;height:32px">'+esc(initials(s.name))+'</span><span style="flex:1;min-width:0;display:flex;flex-direction:column"><strong class="pii" style="font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s.name)+'</strong><span class="stamp pii">'+esc(s.email!==s.name?s.email:'')+'</span></span><span class="stamp">'+esc(mailDate(m.date))+'</span></div><pre class="pii">'+esc(String(body).replace(/\n{3,}/g,'\n\n').trim())+'</pre>'+((m.attachments&&m.attachments.length)?'<span class="pill">'+ic('clip')+plural(m.attachments.length,'anexo')+', abra no Gmail para ver</span>':'')+'</div>'});
  h+='</div>';
  if(T.viewUrl)h+='<a class="btn ghost" style="align-self:flex-start" href="'+esc(T.viewUrl)+'" target="_blank" rel="noopener">'+ic('open')+'Abrir no Gmail</a>';
  openSheet(h);
}
async function threadAction(kind,btn){
  const T=THREAD;if(!T)return;
  try{
    if(kind==='archive'){btn.disabled=true;await call(GMAIL,'unlabel_thread',{threadId:T.id,labelIds:['INBOX']});dropThreadIf('INBOX');toast('Conversa arquivada');closeSheet()}
    if(kind==='unread'){btn.disabled=true;await call(GMAIL,'label_thread',{threadId:T.id,labelIds:['UNREAD']});setThreadLabel(T.id,'UNREAD',true);countUnread();toast('Marcada como não lida');closeSheet()}
    if(kind==='star'){const on=!T.labels.has('STARRED');btn.disabled=true;await call(GMAIL,on?'label_thread':'unlabel_thread',{threadId:T.id,labelIds:['STARRED']});on?T.labels.add('STARRED'):T.labels.delete('STARRED');setThreadLabel(T.id,'STARRED',on);paintThread()}
    if(kind==='trash'){
      if(!btn.dataset.armed){btn.dataset.armed='1';btn.classList.add('danger');btn.lastChild.textContent='Confirmar exclusão';setTimeout(()=>{if(btn.isConnected&&!btn.disabled){delete btn.dataset.armed;btn.classList.remove('danger');btn.lastChild.textContent='Excluir'}},5000);return}
      btn.disabled=true;await call(GMAIL,'trash_thread',{threadId:T.id});dropThread(T.id);toast('Conversa movida para a lixeira');closeSheet();
    }
    invalidate(GMAIL);if(S.tab==='email')render();
  }catch(e){btn.disabled=false;toast(e&&e.code==='server_unavailable'?'O Gmail não respondeu. Confira antes de tentar de novo.':'Não foi possível concluir: '+String((e&&e.message)||'erro').slice(0,80))}
}
function dropThreadIf(label){
  // tira da lista quando o filtro atual depende daquela etiqueta
  const q=mailQuery();if(label==='INBOX'&&/in:inbox/.test(q))dropThread(THREAD.id);
}
function paintLabelPicker(){
  const T=THREAD;const zone=document.getElementById('t-labels-zone');if(!zone)return;
  const ls=S.mail.labels.filter(l=>l.labelType==='USER'&&l.labelListVisibility==='LABEL_SHOW');

async function toggleLabel(lid,btn){
  const T=THREAD;const on=!T.labels.has(lid);btn.disabled=true;
  try{await call(GMAIL,on?'label_thread':'unlabel_thread',{threadId:T.id,labelIds:[lid]});on?T.labels.add(lid):T.labels.delete(lid);setThreadLabel(T.id,lid,on);invalidate(GMAIL);btn.setAttribute('aria-pressed',String(on));toast(on?'Etiqueta aplicada':'Etiqueta removida')}
  catch(e){toast('Não foi possível mudar a etiqueta')}
  btn.disabled=false;
}

/* Escrever e-mail */
let COMP=null;
function composerHTML(o){
  COMP={replyId:o.replyId||'',files:[],name:o.name||''};
  return '<form class="card compose" id="composer">'+
    '<div class="cfield"><label for="c-to">Para</label><input id="c-to" type="text" inputmode="email" value="'+esc(o.to||'')+'" placeholder="email@exemplo.com" autocomplete="off"><button type="button" class="linkish" data-act="c-cc">Cc</button></div>'+
    '<div class="cfield" id="c-cc-row" hidden><label for="c-cc">Cc</label><input id="c-cc" type="text" inputmode="email" autocomplete="off"></div>'+
    '<div class="cfield"'+(o.replyId?' hidden':'')+'><label for="c-subj">Assunto</label><input id="c-subj" type="text" value="'+esc(o.subject||'')+'" autocomplete="off"></div>'+
    '<textarea class="field" id="c-body" placeholder="Escreva aqui">'+esc(o.body||'')+'</textarea>'+
    '<div class="row" style="gap:6px"><select class="field" id="c-tpl" style="flex:1;min-width:150px"><option value="">Usar um modelo</option>'+EMAIL_TPL.map((t,i)=>'<option value="'+i+'">'+esc(t[0])+'</option>').join('')+'</select>'+
    '<select class="field" id="c-sig" style="flex:1;min-width:150px"><option value="clinica"'+(o.sig!=='pessoal'?' selected':'')+'>Assina: Jessica, secretária</option><option value="pessoal"'+(o.sig==='pessoal'?' selected':'')+'>Assina: Fabio, pessoal</option><option value="nenhuma">Sem assinatura</option></select></div>'+
    '<div class="row" style="gap:6px"><label class="btn small" for="c-files">'+ic('clip')+'Anexar arquivo</label><input type="file" id="c-files" multiple hidden><div id="c-filelist" class="chips wrap" style="flex:1"></div></div>'+
    '<div class="row"><button type="button" class="btn ghost" data-act="c-draft">Salvar rascunho</button><span class="spacer"></span><button type="button" class="btn accent" data-act="c-send">Enviar</button></div>'+
    '<div id="c-result"></div></form>';
}
function openCompose(to,name){
  openSheet(sheetHead('Novo e-mail')+composerHTML({to:to||'',name:name||''}));
  const el=document.getElementById(to?'c-subj':'c-to');if(el)el.focus();
}
function paintFiles(){
  const el=document.getElementById('c-filelist');if(!el||!COMP)return;
  el.innerHTML=COMP.files.map((f,i)=>'<span class="file-chip"><span>'+esc(f.filename)+'</span><button type="button" data-act="c-unfile" data-i="'+i+'" aria-label="Remover anexo">'+ic('x')+'</button></span>').join('');
}
function addFiles(list){
  const files=[...list];let total=COMP.files.reduce((s,f)=>s+f.size,0);
  files.forEach(file=>{
    if(total+file.size>20*1024*1024){toast('Os anexos passam de 20 MB. Envie pelo Gmail ou pelo Drive.');return}
    total+=file.size;
    const r=new FileReader();
    r.onload=()=>{const s=String(r.result);COMP.files.push({filename:file.name,mimeType:file.type||'application/octet-stream',content:s.slice(s.indexOf(',')+1),size:file.size});paintFiles()};
    r.onerror=()=>toast('Não foi possível ler '+file.name);
    r.readAsDataURL(file);
  });
}
function applyTemplate(i){
  const t=EMAIL_TPL[i];if(!t)return;
  const body=document.getElementById('c-body'),subj=document.getElementById('c-subj');
  const nome=firstName(COMP&&COMP.name);
  body.value=t[2].replace(/\[NOME\]/g,nome||'[NOME]')+(body.value.trim()?'\n\n'+body.value:'');
  if(subj&&!subj.value&&t[1])subj.value=t[1];
  body.focus();
}
function readComposer(){
  const f=document.getElementById('composer');if(!f)return null;
  const split=s=>String(s||'').split(/[,;\s]+/).map(x=>x.trim()).filter(x=>/@/.test(x));
  const to=split(f.querySelector('#c-to').value),cc=split(f.querySelector('#c-cc').value);
  const subject=f.querySelector('#c-subj').value.trim();
  let body=f.querySelector('#c-body').value.replace(/\s+$/,'');
  const sk=f.querySelector('#c-sig').value;const sig=SIG[sk];
  if(sig&&!body.includes(sig))body+='\n\n'+sig;
  const inp={to,subject,body};if(cc.length)inp.cc=cc;
  if(COMP.replyId)inp.replyToMessageId=COMP.replyId;
  if(COMP.files.length)inp.attachments=COMP.files.map(({filename,mimeType,content})=>({filename,mimeType,content}));
  return inp;
}
async function submitComposer(kind,btn){
  const res=document.getElementById('c-result');const inp=readComposer();if(!inp)return;
  if(!inp.to.length||!inp.body.trim()){res.innerHTML='<div class="notice err">Preencha o destinatário e a mensagem.</div>';return}
  if(/\[(NOME|DIA|HORÁRIO)\]/.test(inp.body)){res.innerHTML='<div class="notice err">Ainda há campos entre colchetes no texto. Complete antes de continuar.</div>';return}
  if(kind==='send'&&!btn.dataset.armed){btn.dataset.armed='1';btn.textContent='Confirmar envio';res.innerHTML='<div class="notice">Toque de novo para enviar agora para '+esc(inp.to.join(', '))+'.</div>';setTimeout(()=>{if(btn.isConnected&&!btn.disabled){delete btn.dataset.armed;btn.textContent='Enviar'}},6000);return}
  btn.disabled=true;btn.textContent=kind==='send'?'Enviando…':'Salvando…';
  try{
    if(kind==='send'){await call(GMAIL,'send_message',inp);res.innerHTML='<div class="notice"><span>E-mail enviado para '+esc(inp.to.join(', '))+'.</span></div>';btn.textContent='Enviado';toast('E-mail enviado')}
    else{const d=await call(GMAIL,'create_draft',inp)||{};res.innerHTML='<div class="notice"><span>Rascunho salvo no Gmail.</span>'+(d.viewUrl?'<a class="btn small" href="'+esc(d.viewUrl)+'" target="_blank" rel="noopener">Abrir rascunho</a>':'')+'</div>';btn.textContent='Rascunho salvo'}
    invalidate(GMAIL);
  }catch(e){
    const amb=e&&(e.code==='server_unavailable'||e.code==='upstream_error');
    res.innerHTML=amb?'<div class="notice err">Sem resposta do Gmail. Confira Enviados e Rascunhos antes de tentar de novo.</div>':errBox(e,GMAIL);
    btn.disabled=false;delete btn.dataset.armed;btn.textContent=kind==='send'?'Enviar':'Salvar rascunho';
  }
}

/* ---------- Pendências ---------- */
const PTIPOS=['Atestado','Relatório','Declaração','Exames','Receita','Retorno','Cobrança','Mensagem','Outro'];
const PRAZOS=[['hoje','Hoje',0],['amanha','Amanhã',1],['3d','Em 3 dias',3],['semana','Em 1 semana',7],['','Sem prazo',null]];
function pendOpen(){return S.pend.rows.filter(r=>r.status==='aberta')}
function pendSuggestions(){
  const out=S.pend.rows.filter(r=>r.status==='sugerida').map(r=>Object.assign({fromDb:true},r));
  const known=new Set(S.pend.rows.map(r=>r.id));
  const now=new Date();const seen=new Set();
  S.pend.recent.concat(S.agenda.events).forEach(e=>{
    if(!e.patient||e.end>now||seen.has(e.id))return;seen.add(e.id);
    const id='rx_'+e.id;if(known.has(id))return;
    out.push({id,auto:true,titulo:'Enviar receita de '+e.name,tipo:'Receita',paciente:e.name,pacienteKey:patKey(e),prazo:dayKey(addDays(e.start,1)),motivo:(e.tipo||'Consulta')+' em '+fShort.format(e.start)+', '+fTime.format(e.start)});
  });
  // véspera: depois das 17h, quem ainda não confirmou vira sugestão
  if(now.getHours()>=17){confTargets().list.forEach(e=>{const st=confStatus(e);if(st==='confirmou'||st==='desmarcou')return;const id='conf_'+e.id;if(known.has(id))return;
    out.push({id,auto:true,titulo:'Confirmar consulta de '+e.name,tipo:'Mensagem',paciente:e.name,pacienteKey:patKey(e),prazo:dayKey(now),motivo:(st==='enviada'?'Mensagem enviada, sem resposta':'Confirmação ainda não enviada')+' · '+relDay(e.start)+', '+fTime.format(e.start)})})}
  // plano: sessão 4 de 4 nos próximos 7 dias
  S.agenda.events.forEach(e=>{if(!e.patient||e.start<now)return;const pi=planInfo(e);if(!pi||pi.n!==4)return;const id='renov_'+e.id;if(known.has(id))return;
    out.push({id,auto:true,titulo:'Oferecer renovação do plano a '+e.name,tipo:'Mensagem',paciente:e.name,pacienteKey:patKey(e),prazo:dayKey(addDays(e.start,-1)),motivo:'Sessão 4 de 4 '+relDay(e.start).toLowerCase()+', '+fTime.format(e.start)})});
  return out;
}
function bucket(r){
  if(!r.prazo)return 'none';
  const n=Math.round((startOfDay(new Date(r.prazo+'T12:00:00'))-startOfDay(new Date()))/864e5);
  return n<0?'late':n===0?'today':n<=7?'week':'later';
}

function buildPDF(){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw new Error('O gerador de PDF não carregou. Recarregue o painel.');
  const doc=new J({unit:'mm',format:'a4'});
  const W=210,M=22,GOLD=[176,134,58],INK=[30,27,24],GREY=[105,99,92];
  let y=0;
  const header=()=>{
    doc.setFont('helvetica','bold');doc.setFontSize(17);doc.setTextColor(...INK);doc.text('Dr. Fabio Schmidt',M,24);
    doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(...GREY);doc.text('Médico · Pós-graduado em Psiquiatria · CRM-SP 183549',M,30);
    if(DOC.segunda){doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...GOLD);doc.text('2ª VIA',W-M,24,{align:'right'})}
    doc.setDrawColor(...GOLD);doc.setLineWidth(0.6);doc.line(M,35,W-M,35);
    y=48;
  };
  const footer=()=>{doc.setDrawColor(...GOLD);doc.setLineWidth(0.3);doc.line(M,282,W-M,282);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...GREY);doc.text(docRodape(),W/2,287,{align:'center',maxWidth:W-2*M})};
  const label=(t,x,yy)=>{doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(...GOLD);doc.text(t.toUpperCase(),x,yy)};
  const ensure=need=>{if(y+need>228){footer();doc.addPage();header()}};
  const para=(text,size=12)=>{doc.setFont('helvetica','normal');doc.setFontSize(size);doc.setTextColor(...INK);
    String(text).split('\n').forEach(line=>{const parts=line.trim()?doc.splitTextToSize(line,W-2*M):[''];parts.forEach(l=>{ensure(6.2);doc.text(l,M,y);y+=6.2})})};
  header();
  doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(...INK);doc.text(String(DOC.titulo||TITULO_PADRAO[DOC.tipo]),M,y);y+=11;
  label('Paciente',M,y);y+=6;doc.setFont('helvetica','normal');doc.setFontSize(12);doc.setTextColor(...INK);doc.text(DOC.paciente||'',M,y);
  if(DOC.cpf){doc.setFontSize(10);doc.setTextColor(...GREY);doc.text('CPF '+DOC.cpf,W-M,y,{align:'right'})}
  y+=12;
  if(DOC.tipo==='exames'){
    if(DOC.indicacao){label('Indicação clínica',M,y);y+=6;para(DOC.indicacao);y+=4}
    const rows=TUSS.filter(([c])=>DOC.exames.includes(c)).map(([c,n])=>[c,n]);
    DOC.outros.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{const m=l.match(/^(\d{8})\s+(.+)$/);rows.push(m?[m[1],m[2]]:['',l])});
    label('Código TUSS',M,y);label('Exame',M+38,y);y+=2.5;doc.setDrawColor(...GOLD);doc.setLineWidth(0.3);doc.line(M,y,W-M,y);y+=6;
    rows.forEach(([c,n])=>{ensure(8);doc.setFont('helvetica','normal');doc.setFontSize(11.5);doc.setTextColor(...INK);doc.text(c||'',M,y);doc.text(doc.splitTextToSize(n,W-2*M-38)[0],M+38,y);y+=3;doc.setDrawColor(225,220,212);doc.setLineWidth(0.2);doc.line(M,y,W-M,y);y+=5.5});
  }else{
    para(DOC.texto.trim());
  }
  // local, data e assinatura
  let ys=Math.max(y+14,232);if(ys>246){footer();doc.addPage();header();ys=232}
  doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(...INK);doc.text('Mogi das Cruzes, '+fLong.format(new Date(DOC.data+'T12:00:00'))+'.',M,ys+18);
  const sx=W-M-72;doc.setDrawColor(...INK);doc.setLineWidth(0.3);doc.line(sx,ys+24,W-M,ys+24);
  doc.setFontSize(10.5);doc.setFont('helvetica','bold');doc.text('Dr. Fabio Schmidt',sx+36,ys+29,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...GREY);doc.text('Médico · Pós-graduado em Psiquiatria',sx+36,ys+33.5,{align:'center'});doc.text('CRM-SP 183549',sx+36,ys+38,{align:'center'});
  footer();
  return doc.output('blob');
}
async function gerarPDF(btn){
  readDoc();
  const msg=document.getElementById('d-msg');
  if(!DOC.paciente){msg.innerHTML='<div class="notice err">Informe o paciente.</div>';return}
  if(DOC.tipo==='exames'&&!DOC.exames.length&&!DOC.outros.trim()){msg.innerHTML='<div class="notice err">Escolha ao menos um exame.</div>';return}
  if(DOC.tipo!=='exames'&&!DOC.texto.trim()){msg.innerHTML='<div class="notice err">O texto do documento está vazio.</div>';return}
  if(DOC.tipo!=='exames'&&/\[(ESCREVA AQUI|NOME|DATA|HORA|CPF)\]/.test(DOC.texto)){msg.innerHTML='<div class="notice err">Ainda há campos entre colchetes no texto. Complete ou apague antes de gerar.</div>';return}
  if(!S.dl){msg.innerHTML='<div class="notice err">Abra o painel no claude.ai para salvar o PDF.</div>';return}
  let blob;try{blob=buildPDF()}catch(e){msg.innerHTML='<div class="notice err">'+esc(e.message)+'</div>';return}
  const nomeTipo=(DOC_TIPOS.find(x=>x[0]===DOC.tipo)||['','Documento'])[1].split(' ')[0];
  const fn=nomeTipo+' - '+DOC.paciente.replace(/[\\/:*?"<>|]/g,'')+' - '+DOC.data+'.pdf';
  btn.disabled=true;
  try{await S.dl.save({filename:fn,data:blob});
    const feita=document.getElementById('d-feita');
    if(DOC.pendId&&feita&&feita.checked)await patchPend(DOC.pendId,{status:'feita',feitoEm:new Date().toISOString()});
    store('molde-'+DOC.tipo,DOC.molde);
    msg.innerHTML='<div class="notice"><span>PDF salvo. Assine digitalmente antes de enviar.</span></div>';
  }catch(e){
    const c=e&&e.code;msg.innerHTML=c==='declined'?'<div class="notice">Download cancelado.</div>':'<div class="notice err">Não foi possível salvar o PDF ('+esc(c||e.message||'erro')+').</div>';
  }
  btn.disabled=false;
}

const PLANOS=['Avulso','Plano de 4 sessões, R$ 2.200','Plano de 4 sessões, R$ 2.900'];

let CAD=null;
function digits(s){return String(s||'').replace(/\D/g,'')}
function fmtCPF(s){const d=digits(s);return d.length===11?d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6,9)+'-'+d.slice(9):String(s||'').trim()}
function cpfValido(s){const d=digits(s);if(d.length!==11||/^(\d)\1+$/.test(d))return false;
  for(let t=9;t<11;t++){let sum=0;for(let i=0;i<t;i++)sum+=Number(d[i])*(t+1-i);const r=(sum*10)%11%10;if(r!==Number(d[t]))return false}return true}
function fmtNasc(k){if(!/^\d{4}-\d{2}-\d{2}$/.test(k||''))return k||'';const [y,m,d]=k.split('-').map(Number);const n=new Date();let age=n.getFullYear()-y;if(n.getMonth()+1<m||(n.getMonth()+1===m&&n.getDate()<d))age--;return pad(d)+'/'+pad(m)+'/'+y+' ('+age+' anos)'}
function enderecoLinha(c){return [c.endereco,c.bairro,[c.cidade,c.uf].filter(Boolean).join(' - '),c.cep?'CEP '+c.cep:''].filter(Boolean).join(', ')}
function dadosTexto(p){const c=p.cad||{};return ['Nome completo: '+(p.name||''),'CPF: '+(p.cpf||''),c.nascimento?'Nascimento: '+fmtNasc(c.nascimento).replace(/ \(.*/,''):'','Telefone: '+(p.phone||''),'E-mail: '+(p.email||''),enderecoLinha(c)?'Endereço: '+enderecoLinha(c):'',c.responsavel?'Responsável: '+c.responsavel:''].filter(x=>x&&!/: $/.test(x)).join('\n')}

/* Lê a resposta do paciente à mensagem de boas-vindas (Nome completo, CPF, Endereço...) */
function parseDados(t){
  let txt=String(t||'').replace(/[*_]/g,'').replace(/📋/g,'');const o={};
  const lab=re=>{const m=txt.match(re);return m?m[1].trim().replace(/[.;]$/,''):''};
  o.nome=lab(/nome(?:\s+completo)?\s*[:\-]\s*(.+)/i);
  const cpf=txt.match(/(?:cpf\s*[:\-]?\s*)?(\d{3}\.?\d{3}\.?\d{3}\s?-?\s?\d{2})(?!\d)/i);if(cpf){o.cpf=fmtCPF(cpf[1]);txt=txt.replace(cpf[0],' ')}
  const em=txt.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/);if(em){o.email=em[0].toLowerCase();txt=txt.replace(em[0],' ')}
  const nasc=txt.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(nasc){o.nascimento=nasc[3]+'-'+pad(nasc[2])+'-'+pad(nasc[1]);txt=txt.replace(nasc[0],' ')}
  const cep=txt.match(/(?:cep\s*[:\-]?\s*)?(\d{5})-?(\d{3})(?!\d)/i);if(cep){o.cep=cep[1]+'-'+cep[2];txt=txt.replace(cep[0],' ')}
  const tel=txt.match(/(?:\+?55\s?)?\(?\d{2}\)?\s?9?\d{4}[-\s]?\d{4}/);if(tel)o.telefone=tel[0].trim();
  let end=lab(/endere[cç]o[^:\n]*[:\-]\s*(.+)/i);
  if(end){end=end.replace(/,?\s*CEP\s*$/i,'').replace(/[,\s]+$/,'');
    const ufm=end.match(/[,\-]\s*([A-Z]{2})\s*$/);if(ufm){o.uf=ufm[1];end=end.slice(0,ufm.index).trim()}
    o.endereco=end}

function confMsg(e,d){const amanha=dayKey(d)===dayKey(addDays(new Date(),1));return 'Olá '+firstName(e.name)+'! Passando para confirmar sua consulta '+(amanha?'amanhã':'na '+fWd.format(d))+', '+fDM.format(e.start)+', às '+fTime.format(e.start)+'. Posso confirmar?'}

/* Leitura de print: o Claude lê a imagem e devolve os campos do cadastro */
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const k=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('imagem')),'image/jpeg',.88)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('imagem'))};img.src=url})}
async function lerPrint(file){
  if(!S.sample){toast('A leitura de print funciona com o painel aberto no claude.ai.');return}

  if(!lim||!lim.images){toast('Leitura de imagem indisponível aqui. Cole o texto.');return}

    const out=await S.sample.json('Esta imagem é um print ou foto com dados de um paciente de consultório médico no Brasil (conversa de WhatsApp, documento, ficha ou formulário). Extraia somente os dados cadastrais que estiverem visíveis. Responda só com um objeto JSON com as chaves: nome (nome completo), cpf, nascimento (formato AAAA-MM-DD), telefone, email, cep, endereco (rua, número e complemento), bairro, cidade, uf (sigla). Use "" para o que não aparecer. Não invente nem complete dados que não estão na imagem. Copie os números exatamente como aparecem.',{images:[blob],modelTier:'quick'});
    if(!CAD)return;
    const o=out&&typeof out==='object'?out:{};let n=0;
    ['nome','cpf','nascimento','telefone','email','cep','endereco','bairro','cidade','uf'].forEach(k=>{let v=String(o[k]||'').trim();if(!v)return;if(k==='cpf')v=fmtCPF(v);if(k==='nascimento'&&!/^\d{4}-\d{2}-\d{2}$/.test(v))return;if(k==='uf')v=v.toUpperCase().slice(0,2);if(k==='email')v=v.toLowerCase();CAD.f[k]=v;n++});
    toast(n?plural(n,'campo preenchido','campos preenchidos')+'. Confira antes de salvar.':'Não encontrei dados de cadastro nesse print.');
  }catch(e){toast(e&&e.code==='not_granted'?'A leitura de imagem não foi autorizada neste painel.':e&&e.code==='rate_limited'?'Muitas leituras seguidas. Espere um minuto.':'Não consegui ler o print. Tente outro ou cole o texto.')}
  if(CAD){CAD.lendo=false;paintCad()}
}

async function aiSend(){
  aiState();if(AI.busy)return;
  const t=document.getElementById('ai-text');const text=String((t?t.value:AI.draft)||'').trim();if(!text)return;
  if(!S.sample){toast('O assistente funciona com o painel aberto no claude.ai.');return}
  AI.msgs.push({role:'user',content:text});AI.draft='';AI.steps=[];AI.live='';AI.busy=true;AI.ctl=new AbortController();paintAI();
  const browser=S.mcp?await aiBrowserInfo():false;
  const lim=await S.sample.limits().catch(()=>null);const canTools=!!(lim&&lim.tools);
  const turnSteps=[];let final='',done=false;
  try{
    for(let round=0;round<8&&!done;round++){
      const before=AI.steps.length;AI.live='';
      const res=await S.sample(aiPrompt(browser,turnSteps),Object.assign({modelTier:'default',signal:AI.ctl.signal,onText:({text})=>{AI.live=text;paintAILog()}},canTools?{tools:aiTools(browser)}:{}));
      const out=String(res&&res.text||'');
      AI.steps.slice(before).forEach(st=>turnSteps.push((st.ok===false?'falhou: ':'')+st.label));
      const m=out.match(/STATUS:\s*(PRONTO|PERGUNTA|CONTINUAR)/gi);const st=m?m[m.length-1].replace(/STATUS:\s*/i,'').toUpperCase():'PRONTO';
      const clean=aiClean(out);
      if(st==='CONTINUAR'){if(clean)turnSteps.push('nota: '+clean.slice(-400));continue}
      final=clean||'Pronto.';done=true;
    }
    if(!done)final='Parei depois de muitas etapas sem terminar. Veja o que ficou na tela e me diga como seguir.';
  }catch(e){
    final=e&&e.code==='cancelled'?'Parei a pedido.':e&&e.code==='not_granted'?'O uso do Claude não foi autorizado neste painel.':e&&e.code==='rate_limited'?'Muitos pedidos seguidos. Espere um minuto e tente de novo.':e&&e.code==='tools_unavailable'?'Este modo do painel não permite ferramentas. Abra no Cowork, no app Claude do computador.':'Não consegui terminar: '+String((e&&e.message)||(e&&e.code)||'erro').slice(0,200);
  }
  AI.msgs.push({role:'assistant',content:final});AI.busy=false;AI.live='';AI.ctl=null;
  if(AI.open&&document.getElementById('ai-log'))paintAI();else toast('O assistente respondeu. Toque em Assistente para ver.');
}
