<title>Painel de Insights</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: o mesmo app de uma coluna do Painel do Consultório. Pílula de navegação fixa, cartões brancos sobre cinza,
   uma cor por formato (Reel azul, Carrossel laranja, Post verde-água) e framboesa como cor de ação. */
:root{
  --bg:#eeedeb;--card:#ffffff;--card-2:#f6f5f3;
  --line:rgba(28,24,20,.08);--line-2:rgba(28,24,20,.15);
  --fg:#18171a;--muted:#66625d;--dim:#98938c;
  --accent:#c2376b;--accent-ink:#ffffff;--accent-soft:rgba(194,55,107,.11);
  --pill:#18171a;--pill-fg:#ffffff;
  --reel:#2a78d6;--reel-soft:rgba(42,120,214,.12);
  --carr:#eb6834;--carr-soft:rgba(235,104,52,.13);
  --post:#1baf7a;--post-soft:rgba(27,175,122,.13);
  --outro:#98938c;--outro-soft:rgba(152,147,140,.15);
  --ok:#23864d;--ok-soft:rgba(35,134,77,.11);
  --warn:#b97a0c;--warn-soft:rgba(185,122,12,.12);
  --bad:#cc3a2b;--bad-soft:rgba(204,58,43,.1);
  --shadow:0 1px 2px rgba(28,24,20,.05),0 6px 20px rgba(28,24,20,.04);
  --scrim:rgba(20,18,16,.42);
  --f-ui:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0d0f;--card:#17171a;--card-2:#202024;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.14);
  --fg:#f1f0ee;--muted:#a7a39e;--dim:#75716c;--accent:#ec6f9a;--accent-ink:#1f0a12;--accent-soft:rgba(236,111,154,.15);
  --pill:#f1f0ee;--pill-fg:#111113;
  --reel:#3987e5;--reel-soft:rgba(57,135,229,.18);--carr:#d95926;--carr-soft:rgba(217,89,38,.2);--post:#199e70;--post-soft:rgba(25,158,112,.2);
  --outro:#75716c;--outro-soft:rgba(117,113,108,.22);
  --ok:#4cc27e;--ok-soft:rgba(76,194,126,.14);--warn:#e8ad3f;--warn-soft:rgba(232,173,63,.14);
  --bad:#ff6a58;--bad-soft:rgba(255,106,88,.13);--shadow:0 1px 0 rgba(255,255,255,.03);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0f;--card:#17171a;--card-2:#202024;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.14);
  --fg:#f1f0ee;--muted:#a7a39e;--dim:#75716c;--accent:#ec6f9a;--accent-ink:#1f0a12;--accent-soft:rgba(236,111,154,.15);
  --pill:#f1f0ee;--pill-fg:#111113;
  --reel:#3987e5;--reel-soft:rgba(57,135,229,.18);--carr:#d95926;--carr-soft:rgba(217,89,38,.2);--post:#199e70;--post-soft:rgba(25,158,112,.2);
  --outro:#75716c;--outro-soft:rgba(117,113,108,.22);
  --ok:#4cc27e;--ok-soft:rgba(76,194,126,.14);--warn:#e8ad3f;--warn-soft:rgba(232,173,63,.14);
  --bad:#ff6a58;--bad-soft:rgba(255,106,88,.13);--shadow:0 1px 0 rgba(255,255,255,.03);--scrim:rgba(0,0,0,.6);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.brand h1{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.date{font-size:.78rem;color:var(--muted)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted);box-shadow:var(--shadow)}
.icon-btn:hover{color:var(--fg)}

.seg-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:6px 12px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;border-radius:999px;padding:9px 4px;font-size:.88rem;font-weight:500;color:var(--muted);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button:hover{color:var(--fg)}
.seg button[aria-selected="true"]{background:var(--pill);color:var(--pill-fg)}
.seg .ico{width:16px;height:16px}

.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{font-size:1rem;font-weight:600;letter-spacing:-.01em}
.card-h .count{font-size:.78rem;color:var(--dim)}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-inline:2px}
.page-h h2{font-size:1.55rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
.page-h p{font-size:.86rem;color:var(--muted);margin-top:3px;max-width:60ch}
.spacer{flex:1}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.84rem;font-weight:500;white-space:nowrap;color:var(--fg)}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--pill);border-color:var(--pill);color:var(--pill-fg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--card-2)}
.btn.small{padding:6px 11px;font-size:.78rem}
.btn.big{padding:12px 20px;font-size:.95rem}
.btn.danger{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn .ico{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:500;border-radius:999px;padding:2px 8px;background:var(--card-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.fmt{color:var(--fg)}
.fmt.Reel{background:var(--reel-soft)}.fmt.Reel .dot{background:var(--reel)}
.fmt.Carrossel{background:var(--carr-soft)}.fmt.Carrossel .dot{background:var(--carr)}
.fmt.Post{background:var(--post-soft)}.fmt.Post .dot{background:var(--post)}
.fmt.Outro{background:var(--outro-soft)}.fmt.Outro .dot{background:var(--outro)}
.field{width:100%;background:var(--card-2);border:1px solid transparent;border-radius:12px;padding:10px 12px;font-size:.92rem;min-width:0}
.field:focus{border-color:var(--line-2);background:var(--card);outline:none}
textarea.field{min-height:120px;resize:vertical;line-height:1.55}
.lab{display:flex;flex-direction:column;gap:5px;font-size:.76rem;font-weight:500;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2 .full{grid-column:1/-1}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:none;border-radius:999px;padding:6px 12px;font-size:.8rem;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--pill);border-color:var(--pill);color:var(--pill-fg);font-weight:500}
.notice{border:1px dashed var(--line-2);border-radius:14px;padding:14px;color:var(--muted);font-size:.88rem;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.notice.err{border-style:solid;border-color:var(--bad);background:var(--bad-soft);color:var(--fg)}
.notice.warn{border-style:solid;border-color:var(--warn);background:var(--warn-soft);color:var(--fg)}
.stamp{font-family:var(--f-mono);font-size:.68rem;color:var(--dim)}
.skeleton{height:13px;border-radius:7px;background:linear-gradient(90deg,var(--card-2) 0%,var(--line) 50%,var(--card-2) 100%);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* Início */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);background:var(--card-2);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .n{font-size:1.5rem;font-weight:700;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .l{font-size:.72rem;color:var(--muted)}
.stat.c1{background:var(--reel-soft);border-color:transparent}
.stat.c2{background:var(--carr-soft);border-color:transparent}
.stat.c3{background:var(--post-soft);border-color:transparent}
.stat.c4{background:var(--accent-soft);border-color:transparent}
.hero-empty{display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding:22px 18px;border-radius:20px;background:linear-gradient(135deg,var(--reel-soft),var(--accent-soft) 60%,var(--post-soft));border:1px solid var(--line)}
.hero-empty h2{font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
.hero-empty p{color:var(--muted);max-width:52ch;font-size:.92rem}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.steps3 div{background:var(--card);border-radius:14px;padding:12px;font-size:.84rem;display:flex;flex-direction:column;gap:4px}
.steps3 b{font-size:.78rem;color:var(--accent)}
.chart-wrap{position:relative;min-width:0}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.chart-wrap .axis{font-family:var(--f-mono);font-size:10px;fill:var(--dim)}
.chart-wrap .grid{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--pill);color:var(--pill-fg);border-radius:10px;padding:8px 10px;font-size:.78rem;line-height:1.35;max-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:5}
.tip b{display:block;font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.ftab{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1fr);gap:8px 12px;align-items:center;font-size:.88rem}
.ftab .h{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.ftab .v{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.ftab .n{font-family:var(--f-mono);font-size:.74rem;color:var(--dim);text-align:right}
.rep{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.rep:first-of-type{border-top:0;padding-top:0}
.rep h3{font-size:.95rem;font-weight:600}
.rep ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.rep .tag{font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.rep .tag.f{color:var(--reel)}.rep .tag.h{color:var(--carr)}

/* Enviar */
.drop{border:2px dashed var(--line-2);border-radius:18px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--card-2);transition:border-color .15s,background .15s;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big-ico{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.drop .big-ico .ico{width:22px;height:22px}
.drop b{font-size:1rem}
.drop span{font-size:.82rem;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:9/16;max-width:100%;border-radius:12px;overflow:hidden;background:var(--card-2);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.thumb button .ico{width:13px;height:13px}
.txtfile{display:inline-flex;align-items:center;gap:6px;background:var(--card-2);border-radius:999px;padding:4px 6px 4px 10px;font-size:.78rem}
.txtfile button{border:0;background:none;color:var(--dim);display:grid;place-items:center}
.txtfile .ico{width:14px;height:14px}
.progress{display:flex;flex-direction:column;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--card-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.rev{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.rev.Reel{border-left:4px solid var(--reel)}.rev.Carrossel{border-left:4px solid var(--carr)}.rev.Post{border-left:4px solid var(--post)}.rev.Outro{border-left:4px solid var(--outro)}
.rev.off{opacity:.45}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mgrid .lab .field{padding:8px 10px;font-variant-numeric:tabular-nums}
.mgrid .lab.warned .field{border-color:var(--warn)}
.mini-warn{font-size:.7rem;color:var(--warn);font-weight:500}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-size:.8rem;font-weight:500;align-self:flex-start}
.linkish:hover{text-decoration:underline}

/* Posts */
.search{position:relative}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);width:16px;height:16px}
.search .field{padding-left:36px}
.list{display:flex;flex-direction:column}
.prow{display:flex;gap:12px;align-items:center;padding:12px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;border-radius:12px}
.list .prow:first-child{border-top:0}
.prow:hover{background:var(--card-2)}
.prow .sw{width:6px;align-self:stretch;border-radius:3px;flex:none}
.prow .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prow .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .m{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prow .big{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.prow .big b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.prow .big small{font-size:.68rem;color:var(--dim)}
.sw.Reel{background:var(--reel)}.sw.Carrossel{background:var(--carr)}.sw.Post{background:var(--post)}.sw.Outro{background:var(--outro)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 12px;align-items:baseline;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.kv .when{font-family:var(--f-mono);font-size:.68rem;color:var(--dim)}
.hist{display:flex;flex-direction:column;gap:10px}
.hist-item{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:10px}
.hist-item:first-child{border-top:0;padding-top:0}
.hist-item img{width:46px;aspect-ratio:9/16;object-fit:cover;border-radius:8px;flex:none;max-width:100%}
.hist-item .txt{flex:1;min-width:0;font-size:.82rem;color:var(--muted)}

/* Conclusão */
.doc{font-size:.95rem;line-height:1.6;display:flex;flex-direction:column;gap:10px;max-width:68ch}
.doc h1{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.doc h2{font-size:1.08rem;font-weight:650;letter-spacing:-.01em;margin-top:10px;padding-top:12px;border-top:1px solid var(--line);text-wrap:balance}
.doc h3{font-size:.95rem;font-weight:600;margin-top:4px}
.doc p{margin:0}
.doc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.doc strong{font-weight:650}
.doc .hip{background:var(--carr-soft);border-radius:4px;padding:0 4px}
.doc-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ver{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.86rem}
.ver:first-child{border-top:0}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--card-2);border-radius:999px;padding:4px 6px 4px 10px;font-size:.78rem;max-width:100%}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fchip.bad{background:var(--bad-soft);color:var(--bad)}
.fchip button{border:0;background:none;color:var(--dim);display:grid;place-items:center}
.fchip .ico{width:14px;height:14px}

/* Folha inferior */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:700px;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));overflow-y:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet::before{content:"";align-self:center;width:38px;height:4px;border-radius:2px;background:var(--line-2);flex:none}
@keyframes up{from{transform:translateY(36px);opacity:.5}}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-head h2{flex:1;min-width:0;font-size:1.2rem;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--pill);color:var(--pill-fg);border-radius:999px;padding:10px 18px;font-size:.85rem;font-weight:500;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* Assistente */
.ai-fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;height:52px;padding:0 18px 0 14px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.ai-fab .ico{width:20px;height:20px}
.ai-log{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:88%;padding:10px 13px;border-radius:16px;font-size:.9rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--pill);color:var(--pill-fg);border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.ai-input{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px}
.ai-input textarea{flex:1;min-height:46px;max-height:160px}

@media (max-width:480px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.steps3{grid-template-columns:1fr}
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg button span{font-size:.8rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">BS</span>
      <div><div class="date" id="today-label"></div><h1>Insights</h1></div>
    </div>
    <button class="icon-btn" id="theme" type="button" title="Alternar tema claro e escuro" aria-label="Alternar tema"></button>
  </header>
  <nav class="seg-wrap" aria-label="Seções"><div class="seg" role="tablist" id="tabs"></div></nav>
  <main id="view" class="view" aria-live="polite"></main>
</div>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<button class="ai-fab" id="ai-fab" type="button" aria-label="Perguntar sobre os dados"></button>
<input type="file" id="file-in" multiple hidden>

<script>
(function(){
'use strict';

const I={
  home:'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',
  up:'<path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
  doc:'<path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  dl:'<path d="M12 4v12M6 10l6 6 6-6"/><path d="M4 20h16"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/>'
};
function ic(k){return '<svg viewBox="0 0 24 24" class="ico" aria-hidden="true">'+I[k]+'</svg>'}

/* Métricas. cum = número que só cresce com o tempo (serve para checar leituras). */
const MET=[
  {k:'visualizacoes',l:'Visualizações',s:'Visualiz.',cum:1},
  {k:'alcance',l:'Contas alcançadas',s:'Alcance',cum:1},
  {k:'nao_seguidores_pct',l:'Alcance fora dos seguidores (%)',s:'Fora seg.',pct:1},
  {k:'compartilhamentos',l:'Compartilhamentos',s:'Compart.',cum:1},
  {k:'salvamentos',l:'Salvamentos',s:'Salvos',cum:1},
  {k:'comentarios',l:'Comentários',s:'Coment.',cum:1},
  {k:'curtidas',l:'Curtidas',s:'Curtidas',cum:1},
  {k:'seguidores',l:'Seguidores ganhos',s:'Seguid.',cum:1},
  {k:'visitas_perfil',l:'Visitas ao perfil',s:'Visitas',cum:1},
  {k:'interacoes',l:'Interações',s:'Interações',cum:1},
  {k:'tempo_medio_s',l:'Tempo médio assistido (s)',s:'Tempo méd.'},
  {k:'pulo_pct',l:'Taxa de pulo (%)',s:'Pulo',pct:1},
  {k:'duracao_s',l:'Duração do vídeo (s)',s:'Duração'}
];
const MK=Object.fromEntries(MET.map(m=>[m.k,m]));
const CHART_M=['visualizacoes','alcance','compartilhamentos','salvamentos','seguidores','nao_seguidores_pct'];
const FORMATOS=['Reel','Carrossel','Post','Outro'];
const CONTA_M=[['seguidores_total','Seguidores'],['alcance_contas','Contas alcançadas'],['contas_engajadas','Contas com interação'],['visualizacoes','Visualizações'],['interacoes','Interações']];

const S={
  tab:store('pi-tab')||'inicio',
  db:null,sample:null,assets:null,downloads:null,lim:null,
  ready:false,dbMissing:false,
  posts:[],leituras:[],conta:[],relatorios:[],envios:[],
  chartM:store('pi-chart')||'visualizacoes',
  pq:'',pf:'Todos',psort:'data',
  up:{imgs:[],txts:[],texto:'',busy:false,step:'',pct:0,err:null,review:null,saving:false,reading:0},
  doc:null,versoes:[],conc:{busy:false,err:null,edit:false,showVer:false,live:''},
  ai:{log:[],busy:false}
};

/* ---------- Utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function pad(n){return String(n).padStart(2,'0')}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pDate(s){if(!s||!/^\d{4}-\d{2}-\d{2}/.test(s))return null;const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)}
const fDM=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'});
const fDMY=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
const fLong=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'});
function dShort(s){const d=pDate(s);if(!d)return 'sem data';return (d.getFullYear()===new Date().getFullYear()?fDM:fDMY).format(d).replace('.','')}
const nf=new Intl.NumberFormat('pt-BR');
const nfc=new Intl.NumberFormat('pt-BR',{notation:'compact',maximumFractionDigits:1});
function fmtV(k,v){if(v==null||v==='')return '–';const m=MK[k];if(m&&m.pct)return nf.format(Math.round(v*10)/10)+'%';if(k.endsWith('_s'))return nf.format(Math.round(v*10)/10)+' s';return Math.abs(v)>=10000?nfc.format(v):nf.format(v)}
function num(v){if(v==null||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;const s=String(v).trim().toLowerCase().replace(/\s/g,'');let mult=1,t=s;if(/mil$/.test(t)){mult=1e3;t=t.replace(/mil$/,'')}else if(/(mi|m)$/.test(t)){mult=1e6;t=t.replace(/(mi|m)$/,'')}else if(/k$/.test(t)){mult=1e3;t=t.slice(0,-1)}t=t.replace('%','');if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t))t=t.replace(/\./g,'').replace(',','.');else t=t.replace(',','.');const n=parseFloat(t);return isFinite(n)?n*mult:null}
function median(a){if(!a.length)return null;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim()}
function fmtOf(f){return FORMATOS.includes(f)?f:'Outro'}
function fmtPill(f){f=fmtOf(f);return '<span class="pill fmt '+f+'"><span class="dot"></span>'+f+'</span>'}
function toast(msg){const r=document.getElementById('toast-root');r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>{r.innerHTML=''},2800)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function blobUrl(id){return id?'/_blob/'+encodeURIComponent(id):''}
function plural(n,s,p){return nf.format(n)+' '+(n===1?s:(p||s+'s'))}

/* ---------- Dados ---------- */
function postsBy(){const m={};S.posts.forEach(p=>m[p.id]=p);return m}
function readingsOf(pid){return S.leituras.filter(r=>r.postId===pid).sort((a,b)=>String(b.coleta).localeCompare(String(a.coleta))||(b.criado||0)-(a.criado||0))}
/* O valor atual de cada métrica é o da leitura mais recente que trouxe aquela métrica. */
function latestMetrics(readings){
  const out={},when={};
  [...readings].sort((a,b)=>String(a.coleta).localeCompare(String(b.coleta))||(a.criado||0)-(b.criado||0)).forEach(r=>{
    Object.entries(r.metricas||{}).forEach(([k,v])=>{if(v!=null){out[k]=v;when[k]=r.coleta}})
  });
  return {m:out,when};
}
function sub(name,orderField,dir,lim){
  let q=S.db.collection(name);if(orderField)q=q.orderBy(orderField,dir||'desc');if(lim)q=q.limit(lim);
  q.onSnapshot(snap=>{S[name]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));S.ready=true;softRender()},e=>{S.err=e;softRender()});
}

async function boot(){
  if(!window.claude||!window.claude.use){S.dbMissing=true;render();return}
  claude.use('db').then(db=>{
    if(!db){S.dbMissing=true;render();return}
    S.db=db;sub('posts');sub('leituras');sub('conta');sub('relatorios');sub('envios','quando','desc',30);sub('versoes','criado','desc',20);
    db.collection('documento').doc('conclusao').onSnapshot(d=>{S.doc=d.exists?d.data():null;S.docReady=true;softRender()},()=>{});
  });
  claude.use('sample').then(async s=>{S.sample=s;if(s){S.lim=await s.limits().catch(()=>null)}render()});
  claude.use('assets').then(a=>{S.assets=a});
  claude.use('downloads').then(d=>{S.downloads=d;render()});
}

/* ---------- Render ---------- */
const TABS=[['inicio','Início','home'],['enviar','Enviar','up'],['posts','Posts','list'],['conclusao','Conclusão','book']];
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,l,i])=>'<button role="tab" data-tab="'+k+'" aria-selected="'+(S.tab===k)+'">'+ic(i)+'<span>'+l+'</span></button>').join('');
}
/* Dados que chegam enquanto se digita não redesenham a tela, para não tirar o cursor do lugar. */
function softRender(){const ae=document.activeElement;if(ae&&ae.matches&&ae.matches('textarea,input:not([type=checkbox]),select')&&!ae.closest('.sheet'))return;if(S.conc.edit&&S.tab==='conclusao')return;render()}
function render(){
  renderTabs();
  const v=document.getElementById('view');
  if(S.dbMissing){v.innerHTML='<div class="notice err"><span>Abra este painel no claude.ai, com sua conta, para guardar e ler os dados.</span></div>';return}
  if(S.tab==='inicio')v.innerHTML=renderInicio();
  else if(S.tab==='enviar')v.innerHTML=renderEnviar();
  else if(S.tab==='posts')v.innerHTML=renderPosts();
  else v.innerHTML=renderConclusao();
  if(S.tab==='inicio')drawChart();
}

function renderInicio(){
  if(!S.ready)return '<div class="card"><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:85%"></div><div class="skeleton" style="width:45%"></div></div>';
  if(!S.posts.length&&!S.relatorios.length&&!S.conta.length){
    return '<div class="hero-empty"><h2>Comece mandando um print</h2><p>Mande prints dos insights do Instagram ou cole um relatório em texto. Claude lê os números, você confere e o painel guarda tudo aqui, post por post.</p>'+
      '<div class="steps3"><div><b>1. Envie</b>Prints de um post, da conta ou um relatório em texto.</div><div><b>2. Confira</b>Claude mostra o que leu. Você corrige o que precisar.</div><div><b>3. Acumule</b>Cada novo print atualiza o post e guarda o histórico.</div></div>'+
      '<button class="btn accent big" data-act="go-enviar">'+ic('up')+'Enviar o primeiro</button></div>';
  }
  const last=S.envios[0];
  const contaLast=[...S.conta].sort((a,b)=>String(b.periodo_fim||b.coleta).localeCompare(String(a.periodo_fim||a.coleta)))[0];
  let h='<div class="stats">'+
    '<div class="stat c1"><span class="n">'+nf.format(S.posts.length)+'</span><span class="l">posts guardados</span></div>'+
    '<div class="stat c2"><span class="n">'+nf.format(S.leituras.length)+'</span><span class="l">leituras de prints</span></div>'+
    '<div class="stat c3"><span class="n">'+(contaLast&&contaLast.metricas&&contaLast.metricas.seguidores_total!=null?fmtV('x',contaLast.metricas.seguidores_total):'–')+'</span><span class="l">seguidores'+(contaLast?' em '+esc(dShort(contaLast.periodo_fim||contaLast.coleta)):'')+'</span></div>'+
    '<div class="stat c4"><span class="n">'+(last?esc(dShort(last.dia)):'–')+'</span><span class="l">último envio</span></div></div>';

  const m=S.chartM;
  h+='<div class="card"><div class="card-h"><h2>'+esc(MK[m].l)+' por post</h2><span class="spacer"></span><span class="count">pela data de publicação</span></div>'+
    '<div class="chips" role="group" aria-label="Métrica do gráfico">'+CHART_M.map(k=>'<button class="chip" data-act="chart-m" data-k="'+k+'" aria-pressed="'+(k===m)+'">'+esc(MK[k].s)+'</button>').join('')+'</div>'+
    '<div class="chart-wrap" id="chart"></div>'+
    '<div class="legend">'+['Reel','Carrossel','Post'].map(f=>'<span><span class="dot" style="background:var(--'+(f==='Reel'?'reel':f==='Carrossel'?'carr':'post')+')"></span>'+f+'</span>').join('')+'</div></div>';

  /* Comparação por formato: mediana, com o número de posts sempre visível */
  const rows=FORMATOS.map(f=>{const vals=S.posts.filter(p=>fmtOf(p.formato)===f).map(p=>p.metricas&&p.metricas[m]).filter(v=>v!=null);return {f,n:vals.length,med:median(vals)}}).filter(r=>r.n);
  if(rows.length){
    const small=rows.some(r=>r.n<5);
    h+='<div class="card"><div class="card-h"><h2>Por formato</h2><span class="count">mediana de '+esc(MK[m].s.toLowerCase())+'</span></div><div class="ftab"><span class="h">Formato</span><span class="h" style="text-align:right">Posts</span><span class="h" style="text-align:right">Mediana</span>'+
      rows.map(r=>'<span>'+fmtPill(r.f)+'</span><span class="n">'+r.n+'</span><span class="v">'+fmtV(m,r.med)+'</span>').join('')+'</div>'+
      (small?'<span class="stamp">Formato com menos de 5 posts. Leia como observação, não como padrão.</span>':'')+'</div>';
  }

  /* Conta */
  if(S.conta.length){
    const cs=[...S.conta].sort((a,b)=>String(b.periodo_fim||b.coleta).localeCompare(String(a.periodo_fim||a.coleta))).slice(0,4);
    h+='<div class="card"><div class="card-h"><h2>Conta</h2><span class="count">'+plural(S.conta.length,'leitura')+'</span></div>';
    cs.forEach((c,i)=>{h+='<div class="rep"><div class="row"><b style="font-size:.88rem">'+esc(c.periodo_inicio?dShort(c.periodo_inicio)+' a '+dShort(c.periodo_fim):dShort(c.coleta))+'</b>'+(i===0?'<span class="pill accent">mais recente</span>':'')+'</div><div class="row" style="gap:14px;font-size:.84rem">'+
      CONTA_M.filter(([k])=>c.metricas&&c.metricas[k]!=null).map(([k,l])=>'<span><span style="color:var(--muted)">'+l+'</span> <b style="font-variant-numeric:tabular-nums">'+fmtV('x',c.metricas[k])+'</b></span>').join('')+'</div></div>'});
    h+='</div>';
  }

  /* Relatórios */
  if(S.relatorios.length){
    const rs=[...S.relatorios].sort((a,b)=>(b.criado||0)-(a.criado||0)).slice(0,5);
    h+='<div class="card"><div class="card-h"><h2>Relatórios</h2><span class="count">'+plural(S.relatorios.length,'guardado')+'</span></div>';
    rs.forEach(r=>{h+='<div class="rep"><div class="row"><h3>'+esc(r.titulo||'Relatório')+'</h3><span class="spacer"></span><span class="stamp">'+esc(dShort(r.dia))+'</span><button class="linkish" data-act="del-rel" data-id="'+esc(r.id)+'" style="color:var(--dim)">Apagar</button></div>'+
      (r.resumo?'<p style="font-size:.88rem;color:var(--muted)">'+esc(r.resumo)+'</p>':'')+
      (r.fatos&&r.fatos.length?'<span class="tag f">Dados do relatório</span><ul>'+r.fatos.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+
      (r.hipoteses&&r.hipoteses.length?'<span class="tag h">Hipóteses, a testar</span><ul>'+r.hipoteses.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'</div>'});
    h+='</div>';
  }

  if(S.envios.length){
    h+='<div class="card"><div class="card-h"><h2>Envios recentes</h2></div><div class="list">'+S.envios.slice(0,6).map(e=>'<div class="row" style="padding:6px 0;border-top:1px solid var(--line);font-size:.84rem"><span class="stamp">'+esc(dShort(e.dia))+'</span><span style="flex:1;min-width:0">'+esc(e.resumo||'')+'</span></div>').join('')+'</div></div>';
  }
  return h;
}

/* ---------- Gráfico ---------- */
function chartData(){
  const m=S.chartM;
  return S.posts.filter(p=>p.metricas&&p.metricas[m]!=null).sort((a,b)=>String(a.data||'').localeCompare(String(b.data||''))).slice(-30);
}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function drawChart(){
  const el=document.getElementById('chart');if(!el)return;
  const data=chartData(),m=S.chartM;
  if(!data.length){el.innerHTML='<div class="notice">Nenhum post com '+esc(MK[m].l.toLowerCase())+' ainda. Mande um print que mostre esse número.</div>';return}
  const W=Math.max(280,el.clientWidth||600),H=220,L=44,R=6,T=10,B=26;
  const max=niceMax(Math.max(...data.map(p=>p.metricas[m])));
  const iw=W-L-R,ih=H-T-B,bw=iw/data.length,gap=Math.min(6,Math.max(2,bw*.2)),w=Math.max(2,bw-gap);
  const y=v=>T+ih-(v/max)*ih;
  const col={Reel:'var(--reel)',Carrossel:'var(--carr)',Post:'var(--post)',Outro:'var(--outro)'};
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(MK[m].l)+' por post">';
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text class="axis" x="'+(L-6)+'" y="'+(yy+3)+'" text-anchor="end">'+esc(fmtV(m,v))+'</text>'}
  let bestI=0;data.forEach((p,i)=>{if(p.metricas[m]>data[bestI].metricas[m])bestI=i});
  data.forEach((p,i)=>{
    const v=p.metricas[m],x=L+i*bw+gap/2,yy=y(v),hh=Math.max(1,T+ih-yy),r=Math.min(4,w/2,hh);
    const d='M'+x+','+(T+ih)+'V'+(yy+r)+'Q'+x+','+yy+' '+(x+r)+','+yy+'H'+(x+w-r)+'Q'+(x+w)+','+yy+' '+(x+w)+','+(yy+r)+'V'+(T+ih)+'Z';
    s+='<path d="'+d+'" fill="'+col[fmtOf(p.formato)]+'"/>';
    s+='<rect x="'+(L+i*bw)+'" y="'+T+'" width="'+bw+'" height="'+ih+'" fill="transparent" data-i="'+i+'" style="cursor:pointer"/>';
  });
  const bx=L+bestI*bw+bw/2;s+='<text class="axis" x="'+Math.min(W-R-20,Math.max(L+20,bx))+'" y="'+(y(data[bestI].metricas[m])-4)+'" text-anchor="middle" style="fill:var(--fg);font-weight:500">'+esc(fmtV(m,data[bestI].metricas[m]))+'</text>';
  const lab=[0,Math.floor((data.length-1)/2),data.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  lab.forEach(i=>{const x=L+i*bw+bw/2;s+='<text class="axis" x="'+x+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===data.length-1?'end':'middle')+'">'+esc(dShort(data[i].data))+'</text>'});
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ih)+'" y2="'+(T+ih)+'" stroke="var(--line-2)"/></svg><div class="tip" id="tip" hidden></div>';
  el.innerHTML=s;
  const tip=el.querySelector('#tip');
  el.querySelectorAll('rect[data-i]').forEach(rc=>{
    const show=()=>{const p=data[+rc.dataset.i];tip.innerHTML='<b>'+esc(p.titulo||'Sem título')+'</b>'+esc(fmtOf(p.formato)+' · '+dShort(p.data))+'<br>'+esc(MK[m].l)+': '+esc(fmtV(m,p.metricas[m]));tip.hidden=false;

const LIBS={
  pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  mammoth:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'
};
const libP={};
function loadLib(k){
  return libP[k]||(libP[k]=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=LIBS[k];sc.onload=()=>{
    if(k==='pdf'){const w='importScripts("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")';pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}))}
    ok()};sc.onerror=()=>{delete libP[k];no(new Error('lib'))};document.head.appendChild(sc)}));
}
function canvasBlob(c){return new Promise(r=>c.toBlob(r,'image/jpeg',.88))}
/* Abre qualquer arquivo e devolve texto, imagens ou o motivo de não ter aproveitado. */
async function extractFile(f){
  const name=f.name||'arquivo',ext=(name.split('.').pop()||'').toLowerCase(),type=f.type||'';
  if(/^(video|audio)\//.test(type)||/^(mp4|mov|m4a|mp3|wav|ogg|webm|avi|mkv)$/.test(ext))return {bad:'vídeo e áudio não entram, mande prints ou a transcrição'};
  if(type.startsWith('image/')||/^(png|jpe?g|webp|gif|heic|heif|bmp|tiff?)$/.test(ext)){
    if(/^image\/(png|jpeg|webp|gif)$/.test(type))return {images:[f]};
    try{const bm=await createImageBitmap(f);const c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);return {images:[new File([await canvasBlob(c)],name+'.jpg',{type:'image/jpeg'})]}}
    catch(e){return {bad:'imagem em formato que o navegador não abre, mande em PNG ou JPG'}}
  }
  if(ext==='pdf'||type==='application/pdf'){
    await loadLib('pdf');
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
    let text='';const n=Math.min(pdf.numPages,80);
    for(let i=1;i<=n;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();text+='\n[página '+i+']\n'+tc.items.map(x=>x.str).join(' ')}
    if(text.replace(/\[página \d+\]|\s/g,'').length>=60*Math.min(n,5))return {text,kind:'PDF, '+plural(pdf.numPages,'página')};
    const imgs=[];for(let i=1;i<=Math.min(pdf.numPages,8);i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:1.6});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;imgs.push(new File([await canvasBlob(c)],name+'-p'+i+'.jpg',{type:'image/jpeg'}))}
    return {images:imgs,kind:'PDF escaneado, '+imgs.length+' páginas como imagem'};
  }
  if(/^(xlsx|xlsm|xls|ods|numbers)$/.test(ext)){
    await loadLib('xlsx');const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    return {text:wb.SheetNames.map(n=>'## '+n+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n\n'),kind:'planilha, '+plural(wb.SheetNames.length,'aba')};
  }
  if(ext==='docx'){await loadLib('mammoth');const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});return {text:r.value,kind:'Word'}}
  if(/^(doc|ppt|pptx|key|pages|zip|rar|7z|exe|dmg)$/.test(ext))return {bad:'formato que o navegador não abre, salve como PDF'};
  let t=await f.text();
  const weird=(t.match(/[\u0000-\u0008\u000E-\u001F\uFFFD]/g)||[]).length;
  if(t.length&&weird/t.length>.02)return {bad:'arquivo binário, não deu para ler como texto'};
  if(/^(html?|xml|svg)$/.test(ext)||/html|xml/.test(type))t=t.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/[ \t]+/g,' ');
  return {text:t,kind:ext?ext.toUpperCase():'texto'};
}
async function addFiles(list){
  const U=S.up;const maxB=(S.lim&&S.lim.images&&S.lim.images.maxInputBytes)||20e6;U.err=null;
  for(const f of Array.from(list||[])){
    U.reading++;render();
    try{
      const r=await extractFile(f);
      if(r.bad)U.txts.push({name:f.name,bad:r.bad});
      if(r.images)r.images.forEach(im=>{if(im.size>maxB)U.txts.push({name:im.name,bad:'grande demais'});else U.imgs.push({file:im,name:im.name,url:URL.createObjectURL(im)})});
      if(r.text!=null){const t=r.text.trim();if(t)U.txts.push({name:f.name,text:t.slice(0,80000),kind:r.kind+(t.length>80000?', cortado':'')});else U.txts.push({name:f.name,bad:'sem texto dentro'})}
      if(r.images&&r.kind)U.txts.push({name:f.name,kind:r.kind,info:true});
    }catch(e){U.txts.push({name:f.name,bad:'não deu para abrir'})}
    U.reading--;render();
  }
}

async function ler(){
  const U=S.up;const t=document.getElementById('up-text');if(t)U.texto=t.value;
  const texto=[U.texto.trim(),...U.txts.filter(x=>x.text).map(x=>'[arquivo: '+x.name+', '+x.kind+']\n'+x.text)].filter(Boolean).join('\n\n').slice(0,150000);
  const maxC=(S.lim&&S.lim.images&&S.lim.images.maxCount)||0;
  if(U.imgs.length&&!maxC){U.err='Esta tela não manda imagens ao Claude. Abra o painel no claude.ai pelo navegador ou pelo app.';render();return}
  const groups=[];for(let i=0;i<U.imgs.length;i+=maxC)groups.push(U.imgs.slice(i,i+maxC));
  if(!groups.length)groups.push([]);
  U.busy=true;U.err=null;U.pct=8;U.step='Lendo'+(U.imgs.length?' os prints':' o texto')+'…';render();
  const merged={data_coleta:null,posts:[],conta:[],relatorio:null,avisos:[],pontos:[],ignorado:[]};
  try{
    for(let g=0;g<groups.length;g++){
      U.step=groups.length>1?'Lendo parte '+(g+1)+' de '+groups.length+'…':U.step;render();
      const res=await S.sample.json(extractPrompt(g===0?texto:'',groups[g].length),{images:groups[g].length?groups[g].map(x=>x.file):undefined,modelTier:'default'});
      if(res){
        merged.data_coleta=merged.data_coleta||res.data_coleta||null;
        (res.posts||[]).forEach(p=>merged.posts.push(p));
        if(res.conta&&res.conta.metricas&&Object.keys(res.conta.metricas).length)merged.conta.push(res.conta);
        if(res.relatorio&&(res.relatorio.resumo||(res.relatorio.fatos||[]).length))merged.relatorio=res.relatorio;
        (res.avisos||[]).forEach(a=>a&&merged.avisos.push(a));
        (res.para_conclusao||[]).forEach(a=>a&&merged.pontos.push(String(a)));
        if(res.ignorado)merged.ignorado.push(String(res.ignorado));
      }
      U.pct=Math.round(10+85*(g+1)/groups.length);render();
    }
  }catch(e){
    U.busy=false;
    const c=e&&e.code;
    U.err=c==='not_granted'?'Sem autorização para usar o Claude neste painel. Libere em Permissões, no menu do artifact.':
      c==='rate_limited'?'Muitos pedidos agora. Tente de novo daqui a pouco.':
      c==='image_rejected'?'Um dos prints não foi aceito. Tente outra imagem, em PNG ou JPG.':
      c==='invalid_json'?'A resposta veio incompleta. Tente de novo, ou mande menos prints de uma vez.':
      c==='prompt_too_large'?'Texto grande demais. Divida em partes.':
      'Não deu para ler agora. Tente de novo.';
    render();return;
  }
  U.busy=false;
  const by=postsBy();
  U.review={
    coleta:/^\d{4}-\d{2}-\d{2}$/.test(merged.data_coleta||'')?merged.data_coleta:todayISO(),
    posts:merged.posts.map(p=>{
      const met={};Object.entries(p.metricas||{}).forEach(([k,v])=>{if(MK[k]){const n=num(v);if(n!=null)met[k]=n}});
      const link=p.vincular_a&&by[p.vincular_a]?p.vincular_a:(guessLink(p)||'');
      return {on:true,link,titulo:String(p.titulo||'').slice(0,160),formato:fmtOf(p.formato),data:/^\d{4}-\d{2}-\d{2}$/.test(p.data_publicacao||'')?p.data_publicacao:'',met,conf:p.confianca||'media',obs:p.obs||'',all:false};
    }),
    conta:merged.conta.map(c=>({on:true,ini:c.periodo_inicio||'',fim:c.periodo_fim||'',met:Object.fromEntries(Object.entries(c.metricas||{}).map(([k,v])=>[k,num(v)]).filter(([k,v])=>v!=null&&CONTA_M.some(x=>x[0]===k)))})),
    relatorio:merged.relatorio?{on:true,titulo:merged.relatorio.titulo||'Relatório',resumo:merged.relatorio.resumo||'',fatos:(merged.relatorio.fatos||[]).filter(Boolean),hipoteses:(merged.relatorio.hipoteses||[]).filter(Boolean)}:null,
    avisos:merged.avisos,texto,pontos:merged.pontos,pontosOn:true,ignorado:merged.ignorado.join(' ')
  };
  if(!U.review.posts.length&&!U.review.conta.length&&!U.review.relatorio&&!U.review.pontos.length)U.review.vazio=true;
  render();
}
function guessLink(p){
  const t=norm(p.titulo);if(t.length<8)return '';
  const hit=S.posts.find(x=>{const n=norm(x.titulo);return n&&(n.includes(t.slice(0,40))||t.includes(n.slice(0,40)))&&(!p.data_publicacao||!x.data||x.data===p.data_publicacao)});
  return hit?hit.id:'';
}

function conflicts(item,coleta){
  if(!item.link)return {};
  const prev=readingsOf(item.link).filter(r=>String(r.coleta)<=coleta);
  const {m,when}=latestMetrics(prev);const w={};
  Object.entries(item.met).forEach(([k,v])=>{if(MK[k]&&MK[k].cum&&m[k]!=null&&v<m[k])w[k]='Menor que '+fmtV(k,m[k])+' em '+dShort(when[k])});
  return w;
}

async function saveReview(){
  const U=S.up,R=U.review;if(U.saving)return;U.saving=true;render();
  try{
    const envioId=uid();const now=Date.now();
    let assetIds=[];
    if(S.assets&&U.imgs.length){
      for(const im of U.imgs){try{const a=await S.assets.upload(im.file);assetIds.push(a.id)}catch(e){}}
    }
    const parts=[];
    for(const p of R.posts.filter(x=>x.on)){
      let pid=p.link;
      if(!pid){pid=uid();await S.db.collection('posts').doc(pid).set({titulo:p.titulo||'Sem título',formato:p.formato,data:p.data||null,criado:now,metricas:{},atualizado:R.coleta})}
      const leitura={postId:pid,coleta:R.coleta,metricas:p.met,confianca:p.conf,obs:p.obs||'',envioId,assetIds,criado:now};
      const lid=uid();await S.db.collection('leituras').doc(lid).set(leitura);

      const {m}=latestMetrics(all);
      await S.db.collection('posts').doc(pid).update({metricas:m,atualizado:R.coleta});
      parts.push(fmtOf(p.formato));
    }
    for(const c of R.conta.filter(x=>x.on)){await S.db.collection('conta').doc(uid()).set({periodo_inicio:c.ini||null,periodo_fim:c.fim||null,coleta:R.coleta,metricas:c.met,envioId,assetIds,criado:now})}
    if(R.relatorio&&R.relatorio.on){const r=R.relatorio;await S.db.collection('relatorios').doc(uid()).set({titulo:r.titulo,resumo:r.resumo,fatos:r.fatos,hipoteses:r.hipoteses,dia:todayISO(),texto:(R.texto||'').slice(0,30000),envioId,criado:now})}
    const resumo=[parts.length?plural(parts.length,'post'):'',R.pontosOn&&R.pontos.length?plural(R.pontos.length,'ponto'):'',R.conta.some(c=>c.on)?'conta':'',R.relatorio&&R.relatorio.on?'relatório':''].filter(Boolean).join(', ')+(U.imgs.length?' · '+plural(U.imgs.length,'print'):'');
    const pontos=R.pontosOn?R.pontos:[];
    await S.db.collection('envios').doc(envioId).set({quando:now,dia:todayISO(),resumo,assetIds,pontos,ignorado:R.ignorado||''});
    const relNovo=R.relatorio&&R.relatorio.on?R.relatorio:null;
    U.imgs.forEach(x=>URL.revokeObjectURL(x.url));
    S.up={imgs:[],txts:[],texto:'',busy:false,step:'',pct:0,err:null,review:null,saving:false};
    if(R.pontosOn&&S.sample){S.tab='conclusao';store('pi-tab','conclusao');render();updateConclusao({motivo:'Envio de '+todayISO()+': '+resumo,pontos,relatorio:relNovo,coleta:R.coleta})}
    else{toast('Guardado: '+resumo);S.tab='inicio';store('pi-tab','inicio');render()}
  }catch(e){
    U.saving=false;
    U.err=e&&e.code==='quota_exceeded'?'O espaço do painel está cheio. Apague posts antigos para continuar.':'Não deu para guardar tudo. O que já entrou ficou salvo. Confira em Posts antes de tentar de novo.';
    U.review=null;render();
  }
}

function inline(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^(Hipótese:)/i,'<span class="hip">$1</span>')}
function md(src){
  const out=[];let list=null;
  String(src||'').split('\n').forEach(raw=>{
    const l=raw.trimEnd();const m=l.match(/^\s*[-*•]\s+(.*)$/);
    if(m){if(!list){list=[];out.push(list)}list.push('<li>'+inline(m[1])+'</li>');return}
    list=null;
    if(!l.trim())return;
    let h=l.match(/^(#{1,3})\s+(.*)$/);
    if(h){out.push('<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>');return}
    out.push('<p>'+inline(l)+'</p>');
  });
  return out.map(x=>Array.isArray(x)?'<ul>'+x.join('')+'</ul>':x).join('');
}

  let h=sheetHead('Perguntar aos dados');
  if(!S.sample)h+='<div class="notice warn"><span>O Claude não está liberado nesta tela.</span></div>';
  else if(!A.log.length)h+='<div class="notice"><span>Pergunte sobre o que está guardado. Exemplos:</span><div class="row">'+['Quais Reels tiveram mais compartilhamentos?','Como o alcance fora dos seguidores mudou no último mês?','O que os relatórios dizem que eu ainda não testei?'].map(q=>'<button class="chip" data-act="ai-q" data-q="'+esc(q)+'">'+esc(q)+'</button>').join('')+'</div></div>';
  h+='<div class="ai-log" id="ai-log">'+A.log.map(m=>'<div class="bubble '+(m.role==='user'?'me':'ai')+'">'+esc(m.content||'…')+'</div>').join('')+'</div>';
  h+='<div class="ai-input"><textarea class="field" id="ai-text" placeholder="Escreva sua pergunta" '+(A.busy||!S.sample?'disabled':'')+'></textarea><button class="btn accent" data-act="ai-send" '+(A.busy||!S.sample?'disabled':'')+'>'+(A.busy?'…':'Enviar')+'</button></div>';
  openSheet(h);
  const lg=document.getElementById('ai-log');if(lg)lg.lastElementChild&&lg.lastElementChild.scrollIntoView({block:'end'});
}
async function aiAsk(q){
  const A=S.ai;if(!q||A.busy)return;
  A.log.push({role:'user',content:q});const ans={role:'assistant',content:''};A.log.push(ans);A.busy=true;paintAI();
  const turns=A.log.slice(0,-1).slice(-8).map((m,i,arr)=>({role:m.role,content:(i===0&&m.role==='user'?aiSystem()+'\n\nPergunta: ':'')+m.content}));
  if(turns[0].role!=='user')turns.shift();
  if(!turns[0].content.startsWith('Você responde'))turns[0]={role:'user',content:aiSystem()+'\n\nPergunta: '+turns[0].content};
  try{
    await S.sample(turns,{cache:false,onText:({text})=>{ans.content=text;const lg=document.getElementById('ai-log');if(lg&&lg.lastElementChild){lg.lastElementChild.textContent=text;lg.lastElementChild.scrollIntoView({block:'end'})}}});
  }catch(e){ans.content=(e&&e.text?e.text+'\n\n':'')+(e&&e.code==='rate_limited'?'Muitos pedidos agora. Tente daqui a pouco.':e&&e.code==='not_granted'?'Sem autorização para usar o Claude aqui.':'A resposta parou. Tente de novo.')}
  A.busy=false;if(S.ai.open)paintAI();
}

/* ---------- Eventos ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;store('pi-tab',S.tab);render();return}
  const a=t.dataset.act;
  if(a==='scrim'){if(e.target===t)closeSheet();return}
  if(a==='close')return closeSheet();
  if(a==='go-enviar'){S.tab='enviar';store('pi-tab','enviar');render();return}
  if(a==='chart-m'){S.chartM=t.dataset.k;store('pi-chart',S.chartM);render();return}
  if(a==='rm-img'){const x=S.up.imgs.splice(+t.dataset.i,1)[0];x&&URL.revokeObjectURL(x.url);render();return}
  if(a==='rm-txt'){S.up.txts.splice(+t.dataset.i,1);render();return}
  if(a==='ler')return ler();
  if(a==='rv-all'){const p=S.up.review.posts[+t.dataset.i];p.all=!p.all;render();return}
  if(a==='rev-cancel'){S.up.review=null;render();return}
  if(a==='rev-save')return saveReview();
  if(a==='pf'){S.pf=t.dataset.f;render();return}
  if(a==='open-post')return openPost(t.dataset.id);
  if(a==='csv')return csv();
  if(a==='del-rel'){await S.db.collection('relatorios').doc(t.dataset.id).delete().catch(()=>toast('Não deu para apagar'));toast('Relatório apagado');return}
  if(a==='del-read'){const r=S.leituras.find(x=>x.id===t.dataset.id);if(!r)return;await S.db.collection('leituras').doc(r.id).delete();S.leituras=S.leituras.filter(x=>x.id!==r.id);await recomputePost(r.postId).catch(()=>{});toast('Leitura apagada');paintPost();return}
  if(a==='del-post'){confirmDel=true;paintPost();return}
  if(a==='del-post-no'){confirmDel=false;paintPost();return}
  if(a==='del-post-yes'){const id=openId;const rs=readingsOf(id);closeSheet();for(const r of rs)await S.db.collection('leituras').doc(r.id).delete().catch(()=>{});await S.db.collection('posts').doc(id).delete().catch(()=>{});toast('Post apagado');return}
  if(a==='ed-save'){const id=openId;await S.db.collection('posts').doc(id).update({titulo:document.getElementById('ed-titulo').value.trim(),formato:document.getElementById('ed-formato').value,data:document.getElementById('ed-data').value||null}).then(()=>toast('Salvo'),()=>toast('Não deu para salvar'));return}
  if(a==='doc-full')return updateConclusao({motivo:'Revisão completa com todos os dados guardados'});
  if(a==='doc-copy'){try{await navigator.clipboard.writeText(S.doc.texto);toast('Documento copiado')}catch(err){toast('Não deu para copiar. Use Editar e copie o texto.')}return}
  if(a==='doc-dl'){S.downloads.save({filename:'conclusoes-v'+(S.doc.versao||1)+'-'+todayISO()+'.md',data:new Blob([S.doc.texto],{type:'text/markdown'})}).catch(()=>{});return}
  if(a==='doc-edit'){S.conc.edit=true;render();return}
  if(a==='doc-edit-no'){S.conc.edit=false;render();return}
  if(a==='doc-edit-save'){const v=document.getElementById('doc-text').value.trim();if(!v)return toast('O documento não pode ficar vazio');await saveDocText(v,'Editado à mão em '+todayISO()).then(()=>toast('Nova versão salva'),()=>toast('Não deu para salvar'));S.conc.edit=false;render();return}
  if(a==='doc-ver'){S.conc.showVer=!S.conc.showVer;render();return}
  if(a==='ver-open'){const v=S.versoes.find(x=>x.id===t.dataset.id);if(v)openSheet(sheetHead('Versão '+(v.versao||'')+' · '+esc(dShort(v.dia)))+'<div class="card"><div class="doc">'+md(v.texto)+'</div></div>');return}
  if(a==='ver-restore'){const v=S.versoes.find(x=>x.id===t.dataset.id);if(v)await saveDocText(v.texto,'Restaurada a versão '+(v.versao||'')).then(()=>toast('Versão restaurada. A atual ficou guardada.'),()=>toast('Não deu para restaurar'));return}
  if(a==='ai-q'){S.ai.open=true;return aiAsk(t.dataset.q)}
  if(a==='ai-send'){const el=document.getElementById('ai-text');const q=el&&el.value.trim();S.ai.open=true;return aiAsk(q)}
});
document.getElementById('ai-fab').addEventListener('click',()=>{S.ai.open=true;paintAI()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='up-text'){S.up.texto=t.value;const b=document.querySelector('[data-act="ler"]');if(b)b.disabled=!((S.up.imgs.length||S.up.txts.length||t.value.trim())&&S.sample);return}
  if(t.id==='pq'){S.pq=t.value;const pos=t.selectionStart;render();const n=document.getElementById('pq');n.focus();n.setSelectionRange(pos,pos);return}
  const R=S.up.review;if(!R)return;
  if(t.id==='rv-coleta'&&t.value){R.coleta=t.value;return}
  if(t.dataset.rv==='m'){const p=R.posts[+t.dataset.i];const n=num(t.value);if(n==null)delete p.met[t.dataset.k];else p.met[t.dataset.k]=n;return}
  if(t.dataset.rv==='titulo'||t.dataset.rv==='data'){R.posts[+t.dataset.i][t.dataset.rv]=t.value;return}
  if(t.dataset.rc){const c=R.conta[+t.dataset.i];if(t.dataset.rc==='m'){const n=num(t.value);if(n==null)delete c.met[t.dataset.k];else c.met[t.dataset.k]=n}else if(t.dataset.rc!=='on')c[t.dataset.rc]=t.value;return}
  if(t.dataset.rp==='pontos'){R.pontos=t.value.split('\n').map(s=>s.trim()).filter(Boolean);return}
  if(t.dataset.rr&&t.dataset.rr!=='on'){const r=R.relatorio;r[t.dataset.rr]=(t.dataset.rr==='fatos'||t.dataset.rr==='hipoteses')?t.value.split('\n').map(s=>s.trim()).filter(Boolean):t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='file-in'){addFiles(t.files);t.value='';return}
  if(t.id==='psort'){S.psort=t.value;render();return}
  const R=S.up.review;if(!R)return;
  if(t.id==='rv-coleta'){R.coleta=t.value||todayISO();render();return}
  if(t.dataset.rv==='on'){R.posts[+t.dataset.i].on=t.checked;render();return}
  if(t.dataset.rv==='link'){R.posts[+t.dataset.i].link=t.value;render();return}
  if(t.dataset.rv==='formato'){R.posts[+t.dataset.i].formato=t.value;render();return}
  if(t.dataset.rc==='on'){R.conta[+t.dataset.i].on=t.checked;render();return}
  if(t.dataset.rr==='on'){R.relatorio.on=t.checked;render();return}
  if(t.dataset.rp==='on'){R.pontosOn=t.checked;render();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('sheet-root').firstChild)closeSheet();
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='ai-text'){e.preventDefault();const q=e.target.value.trim();S.ai.open=true;aiAsk(q)}
});
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');if(ev==='drop')addFiles(e.dataTransfer.files)}}));
document.addEventListener('paste',e=>{
  if(S.tab!=='enviar'||S.up.review)return;
  const files=Array.from(e.clipboardData&&e.clipboardData.files||[]).filter(f=>f.type.startsWith('image/'));
  if(files.length){e.preventDefault();addFiles(files)}
});

/* Tema */
function applyTheme(){const t=store('pi-theme');if(t)document.documentElement.setAttribute('data-theme',t);const dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.getElementById('theme').innerHTML=ic(dark?'sun':'moon')}
document.getElementById('theme').addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');store('pi-theme',cur==='dark'?'light':'dark');applyTheme();if(S.tab==='inicio')drawChart()});
applyTheme();
document.getElementById('today-label').textContent=(s=>s.charAt(0).toUpperCase()+s.slice(1))(fLong.format(new Date()));
document.getElementById('ai-fab').innerHTML=ic('spark')+'Perguntar';
render();boot();
})();
</script>
