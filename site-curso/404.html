<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark only">
<meta name="robots" content="noindex">
<title>Página não encontrada · Dr. Fabio Schmidt</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark;--text:#f4f1ea;--muted:#a39e93;--gold:#C8A96E;--gold-bright:#dcc188;--line:#2a2722}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#0d0d0d !important;height:100%}
  body{color:#f4f1ea !important;font-family:'Poppins',sans-serif;line-height:1.6;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px}
  .box{max-width:480px}
  .code{font-family:'Archivo',sans-serif;font-weight:900;font-size:64px;color:var(--gold);line-height:1;margin-bottom:14px}
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:26px;margin-bottom:12px}
  p{color:var(--muted);margin-bottom:28px}
  .cta{display:inline-block;background:var(--gold);color:#1a1407 !important;font-family:'Archivo',sans-serif;font-weight:800;font-size:17px;text-decoration:none;padding:16px 26px;border-radius:14px}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Esta página não existe.</h1>
    <p>O link pode ter mudado ou ter sido digitado errado. A página do Protocolo 7 Dias continua no mesmo lugar.</p>
    <a class="cta" href="/">Ir para o Protocolo 7 Dias</a>
  </div>
</body>
