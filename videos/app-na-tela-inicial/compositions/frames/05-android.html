  <script>
    (function () {
      var root =
        document.querySelector('#root[data-composition-id="05-android"]') ||
        document.querySelector('[data-composition-id="05-android"]');
      function all(name) {
        return Array.prototype.slice.call(root.getElementsByClassName("05-android-" + name));
      }
      function one(name) {
        return all(name)[0];
      }

      var cards = all("card");
      var labels = all("label");
      var frags = all("frag");
      var nums = all("num");

      var tl = gsap.timeline({ paused: true });

      // Macro camera: a slow settle of the whole stage, ending as the helper lands, then still.
      tl.fromTo(
        one("stage"),
        { scale: 1.025, transformOrigin: "50% 38%" },
        { scale: 1, duration: 5.9, ease: "sine.inOut" },
        0
      );

      // Scene 1 (0.0-1.0): pill + headline
      tl.fromTo(one("pill"), { y: -24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo(
        all("word"),
        { y: 56, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.08 },
        0.22
      );

      // Card entrance helper
      function cardIn(i, t) {
        tl.fromTo(cards[i], { x: 150, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, t);
        tl.fromTo(nums[i], { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, t + 0.15);
        tl.fromTo(frags[i], { scale: 0.94, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, t + 0.2);
        tl.fromTo(labels[i], { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, t + 0.32);
      }

      // Scene 2 (1.0-2.6): card 1, tap the three dots
      cardIn(0, 1.0);
      tl.fromTo(all("pline"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.45, ease: "power2.out", stagger: 0.06 }, 1.3);
      tl.fromTo(all("dot"), { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.07 }, 1.35);
      tl.fromTo(one("tap-1"), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 0.22, duration: 0.25, ease: "power2.out" }, 1.85);
      tl.to(one("dots"), { scale: 0.82, duration: 0.12, ease: "power2.in" }, 1.9);
      tl.to(one("dots"), { scale: 1, duration: 0.3, ease: "back.out(2)" }, 2.02);
      tl.fromTo(one("ripple-1"), { scale: 0.5, opacity: 0.8 }, { scale: 1.9, opacity: 0, duration: 0.6, ease: "power2.out" }, 1.95);

      // Scene 3 (2.6-4.2): card 2, menu row highlighted by cobalt ring
      cardIn(1, 2.6);
      tl.fromTo(all("row"), { x: 24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.07 }, 2.85);
      tl.fromTo(one("ring"), { scale: 1.08, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 3.4);

      // Scene 4 (4.2-5.6): card 3, dialog, tap on Adicionar
      cardIn(2, 4.2);
      tl.fromTo(one("btn-add"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 4.5);
      tl.fromTo(one("btn-cancel"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 4.45);
      tl.fromTo(one("tap-3"), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 0.22, duration: 0.25, ease: "power2.out" }, 4.95);
      tl.to(one("btn-add"), { scale: 0.93, duration: 0.12, ease: "power2.in" }, 5.0);
      tl.to(one("btn-add"), { scale: 1, duration: 0.3, ease: "back.out(2)" }, 5.12);
      tl.fromTo(one("ripple-3"), { scale: 0.5, opacity: 0.8 }, { scale: 1.9, opacity: 0, duration: 0.6, ease: "power2.out" }, 5.05);

      // Scene 5 (5.6-7.0): helper line, then hold still
      tl.fromTo(one("helper"), { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 5.6);

      window.__timelines["05-android"] = tl;
