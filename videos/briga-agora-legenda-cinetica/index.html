<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:500;src:url(inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(inter-latin-800-normal.woff2)}
@font-face{font-family:Inter;font-weight:900;src:url(inter-latin-900-normal.woff2)}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;font-family:Inter}
.ch{display:inline-block;will-change:transform}
.rail{position:absolute;left:50%;transform:translate(-50%,-50%);white-space:nowrap;
  font-weight:900;font-size:70px;letter-spacing:-1.5px;color:#fff;text-align:center;
  text-shadow:0 4px 18px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.5)}
.rail.small{font-weight:800;font-size:60px;letter-spacing:-1px}
.w{position:relative;display:inline-block;margin:0 9px;vertical-align:baseline}
.w.ghost{visibility:hidden}
.w.fx{font-size:1.32em}
.w.red{color:#E8392B}
.w.calor{font-size:1.18em;text-shadow:none}
.w.calor .ch{background:linear-gradient(180deg,#FF8A3D,#E8392B 55%,#B81E16);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(232,57,43,.6)) drop-shadow(0 3px 8px rgba(0,0,0,.6))}
.strike{position:absolute;left:-4%;top:52%;height:9px;background:#fff;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,.5);transform:translateY(-50%)}
.w.marcador{color:#fff;padding:0 14px}
.mark{position:absolute;left:0;top:8%;height:88%;background:#E8392B;border-radius:12px;z-index:-1;box-shadow:0 0 22px rgba(232,57,43,.55)}
.hook{position:absolute;left:0;right:0;top:1000px;text-align:center;font-weight:900;font-size:82px;line-height:1.08;letter-spacing:-2px;color:#fff;
  text-shadow:0 5px 22px rgba(0,0,0,.65),0 1px 3px rgba(0,0,0,.5)}
.hook .hl{white-space:nowrap}
.hookmark{margin:0;padding:0 12px}
.hero{position:absolute;left:50%;top:70px;text-align:center;font-weight:900;color:#fff;white-space:nowrap;line-height:.92;letter-spacing:-5px;
  text-shadow:0 6px 26px rgba(0,0,0,.7),0 2px 4px rgba(0,0,0,.5)}
.hero .l0{font-size:140px}
.hero .l1{font-size:116px;position:relative;display:inline-block}
.uline{position:absolute;left:0;bottom:-14px;height:14px;background:#E8392B;border-radius:7px;box-shadow:0 0 18px rgba(232,57,43,.6)}
.sch{position:absolute;transform-origin:center;font-family:Inter;font-weight:900;color:#fff;text-align:center;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.sch .tag{margin-top:10px;font-size:34px;letter-spacing:1px;background:#E8392B;border-radius:10px;padding:4px 14px;display:inline-block}
.sch .tag.grey{background:#6b6b6b}
.pill{font-size:44px;background:rgba(12,12,14,.82);border:4px solid #fff;border-radius:60px;padding:10px 30px;letter-spacing:1px}
.pill.hot{background:#E8392B;border-color:#E8392B}
.meter .bar{width:64px;height:300px;margin:0 auto;border:5px solid #fff;border-radius:36px;background:rgba(12,12,14,.6);position:relative;overflow:hidden}
.meter .fill{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 30px 30px}
</style></head>
<body><div id="root"></div>
<script src="captions.js"></script>
<script>
window.drawFront = (t) => { document.getElementById('root').innerHTML = CAP.schemaHTML(t) + CAP.hookHTML(t) + CAP.heroHTML(t) + CAP.railHTML(t); };
window.drawBack = (t) => { document.getElementById('root').innerHTML = ''; };
</script>
</body></html>
