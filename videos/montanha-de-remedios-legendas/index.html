<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Montanha de remédios, legendas</title>
<style>
  @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 900; src: url("assets/fonts/montserrat-latin-900-normal.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); }
  :root { --tinta: #1b1917; --verm: #b3261e; --verm-esc: #ff3b2f; }
  html, body { margin: 0; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  /* prévia: vídeo por baixo só no navegador, nunca no render */
  #prev { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; display: none; }
  .bloco { position: absolute; left: 70px; width: 900px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; column-gap: 20px; row-gap: 0; }
  .w { display: inline-block; position: relative; font-family: "Montserrat"; font-weight: 800; font-size: 74px; line-height: 1.12; letter-spacing: -.005em; will-change: transform, opacity, filter; }
  .w.k { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; font-size: 118px; line-height: 1; letter-spacing: 0; }
  .w.k::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 6px; height: 7px; border-radius: 4px; background: currentColor; opacity: .9; transform-origin: 0 50%; transform: scaleX(var(--sub, 0)); }
  .bloco.grande .w { font-weight: 900; font-size: 112px; text-transform: uppercase; letter-spacing: -.01em; line-height: 1.02; }
  .bloco.grande .w.k { font-weight: 400; font-size: 150px; text-transform: none; }
  /* zona escura: branco com sombra; zona creme: tinta, sem contorno */
  .escuro .w { color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.8), 0 0 26px rgba(0,0,0,.5); }
  .escuro .w.k { color: var(--verm-esc); }
  .claro .w { color: var(--tinta); text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  .claro .w.k { color: var(--verm); }
  /* gancho */
  #gancho { position: absolute; left: 40px; width: 1000px; top: 230px; text-align: center; }
  #gancho .l { display: block; font-family: "Montserrat"; font-weight: 900; font-size: 60px; line-height: 1.08; color: #fff; text-transform: uppercase; white-space: nowrap; text-shadow: 0 3px 8px rgba(0,0,0,.85), 0 0 30px rgba(0,0,0,.5); }
  #gancho .l span { display: inline-block; }
  #gancho .k { display: block; font-family: "Instrument Serif"; font-style: italic; font-size: 150px; line-height: .95; color: var(--verm-esc); margin-top: 2px; text-shadow: 0 3px 10px rgba(0,0,0,.8); }
</style>
</head>
<body>
<div id="root">
  <video id="prev" muted playsinline></video>
  <div id="gancho">
    <span class="l" id="g1"><span>Transtorno</span> <span>borderline</span></span>
    <span class="l" id="g2"><span>e aquela</span> <span>montanha de</span></span>
    <span class="k" id="g3">remédios</span>
  </div>
  <div id="leg" class="bloco"></div>
</div>
<script>
// Palavras da fala (faster-whisper small, conferidas à mão: "transtor no" -> "Transtorno").
// Blocos de até 3 palavras, quebrados à mão para não terminar em artigo ou preposição.
// Cada palavra: [texto, início]. '*' no começo = palavra-chave (serifa vermelha, maior, traço).
// Tipo 'g' = momento de ênfase (texto grande).
const BLOCOS = [
  [2.94, 4.38, 'n', [['Porque', 2.94], ['a', 3.14], ['receita', 3.30]]],
  [3.76, 4.38, 'n', [['só', 3.76], ['*cresce', 3.94]]],
  [4.50, 5.20, 'n', [['uma', 4.50], ['*crise', 4.64], ['aguda', 4.88]]],
  [5.20, 6.04, 'n', [['pede', 5.20], ['alívio', 5.48], ['*rápido', 5.70]]],
  [6.44, 6.80, 'n', [['Aí', 6.44], ['entra', 6.60]]],
  [6.80, 7.40, 'n', [['um', 6.80], ['remédio', 6.90], ['*novo', 7.16]]],
  [7.88, 8.48, 'n', [['mas', 7.88], ['o', 8.02], ['*antigo', 8.10]]],
  [8.36, 8.74, 'g', [['não', 8.36], ['sai', 8.48]]],
  [9.26, 9.52, 'n', [['a', 9.26], ['lista', 9.34]]],
  [9.52, 10.32, 'n', [['só', 9.52], ['*aumenta', 9.90]]],
  [10.82, 11.52, 'n', [['O', 10.82], ['problema', 10.90], ['*central', 11.12]]],
  [11.52, 12.28, 'n', [['é', 11.52], ['*misturar', 11.82]]],
  [12.12, 12.80, 'n', [['o', 12.12], ['tratamento', 12.28]]],
  [12.60, 13.34, 'n', [['do', 12.60], ['*borderline', 12.80]]],
  [13.34, 14.02, 'n', [['com', 13.34], ['os', 13.62], ['sintomas', 13.74]]],
  [14.02, 14.70, 'n', [['*paralelos', 14.02]]],
  [14.88, 15.64, 'n', [['como', 14.88], ['depressão', 15.04]]],
  [15.98, 16.62, 'n', [['ansiedade', 15.98]]],
  [16.62, 17.28, 'n', [['ou', 16.62], ['insônia', 16.84]]],
  [17.54, 17.84, 'n', [['Isso', 17.54], ['gera', 17.64]]],
  [17.84, 18.82, 'n', [['uma', 17.84], ['*confusão', 17.96], ['enorme', 18.38]]],
  [18.82, 19.64, 'n', [['sobre', 18.82], ['a', 19.08], ['verdadeira', 19.20]]],
  [19.64, 19.94, 'g', [['*função', 19.64]]],
  [19.94, 20.76, 'n', [['de', 19.94], ['cada', 20.16], ['*pílula', 20.34]]],
  [21.34, 21.66, 'n', [['Leve', 21.34]]],
  [21.66, 22.34, 'n', [['a', 21.66], ['lista', 21.74], ['*completa', 21.92]]],
  [22.34, 23.48, 'n', [['na', 22.34], ['próxima', 22.52], ['*consulta', 22.80]]],
  [23.48, 24.02, 'n', [['e', 23.48], ['pergunte', 23.70]]],
  [24.02, 24.66, 'n', [['para', 24.02], ['que', 24.24], ['serve', 24.38]]],
  [24.66, 25.30, 'n', [['cada', 24.66], ['*item', 25.02]]],
  [25.96, 26.66, 'g', [['Nunca', 25.96], ['pare', 26.30]]],
  [26.66, 27.30, 'n', [['ou', 26.66], ['*reduza', 26.94]]],
  [27.30, 27.70, 'n', [['o', 27.30], ['uso', 27.40]]],
  [27.56, 28.24, 'n', [['por', 27.56], ['conta', 27.70], ['*própria', 27.86]]],
  [28.60, 28.90, 'n', [['isso', 28.60], ['faz', 28.68]]],
  [28.90, 29.36, 'n', [['muito', 28.90], ['*mal', 29.16]]],
  [29.36, 30.50, 'n', [['Qualquer', 29.36], ['mudança', 30.02]]],
  [30.50, 30.96, 'n', [['é', 30.50], ['decisão', 30.64]]],
  [30.96, 31.90, 'n', [['exclusiva', 30.96], ['do', 31.52], ['*médico', 31.60]]],
  [32.48, 33.04, 'n', [['Assim', 32.48]]],
  [33.04, 33.50, 'n', [['aquela', 33.04], ['montanha', 33.14]]],
  [33.50, 34.12, 'n', [['*desordenada', 33.50]]],
  [34.00, 34.56, 'n', [['de', 34.00], ['caixas', 34.12]]],
  [34.56, 35.34, 'n', [['vira', 34.56], ['uma', 34.78], ['*estratégia', 34.84]]],
  [35.34, 36.54, 'g', [['*revisada', 35.34], ['no', 35.90], ['consultório', 36.02]]],
];
const DUR = 36.766667, FPS = 30;
window.DUR = DUR;

// Onde a legenda fica, para não cobrir o esquema do vídeo nem os 20% de baixo.
// Medido no arquivo: até 4,4 s fundo escuro com remédios de 720 px para baixo;
// de 4,4 a 21,3 s esquema entre 420 e 1075 px; depois a lista e o cartão entre 590 e 1380 px.
function zona(t) {
  if (t < 4.4) return { cls: 'escuro', centro: 470 };
  if (t < 21.3) return { cls: 'claro', centro: 1300 };
  return { cls: 'claro', centro: 400 };
}

const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const back = (x, c = 1.9) => { x = clamp(x, 0, 1); return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

function seek(t) {
  // gancho: texto inteiro desde o primeiro quadro; a palavra falada ganha um pulso leve
  const g = $('gancho');
  const fimG = 2.64, saiG = 0.16;
  g.style.display = t < fimG + saiG ? 'block' : 'none';
  if (t < fimG + saiG) {
    const out = clamp((t - fimG) / saiG, 0, 1);
    g.style.opacity = 1 - out;
    g.style.transform = `translateY(${(-30 * ease(out)).toFixed(1)}px) scale(${(1 + 0.025 * Math.sin(clamp(t / 2.6, 0, 1) * Math.PI)).toFixed(4)})`;
    const falas = [[$('g1').children[0], 0.0], [$('g1').children[1], 0.52], [$('g2').children[0], 1.14], [$('g2').children[1], 1.68], [$('g3'), 2.22]];
    for (const [el, s] of falas) {
      const p = t - s;
      const pulso = p >= 0 && p < 0.35 ? Math.sin((p / 0.35) * Math.PI) : 0;
      el.style.transform = `scale(${(1 + 0.07 * pulso).toFixed(4)})`;
    }
    const r = $('g3'), p = t - 2.22;
    if (p >= 0) r.style.transform = `scale(${(1 + 0.08 * Math.sin(clamp(p / 0.4, 0, 1) * Math.PI)).toFixed(4)}) rotate(${(-2 * Math.sin(clamp(p / 0.4, 0, 1) * Math.PI)).toFixed(2)}deg)`;
  }

  // legenda cinética
  const leg = $('leg');
  let bi = -1;
  for (let i = 0; i < BLOCOS.length; i++) if (t >= BLOCOS[i][3][0][1]) bi = i;
  const b = bi >= 0 ? BLOCOS[bi] : null;
  const prox = bi + 1 < BLOCOS.length ? BLOCOS[bi + 1][3][0][1] : DUR;
  const vivo = b && t < prox && t < b[1] + 0.55 && t >= 2.94;
  leg.innerHTML = '';
  if (!vivo) return;
  const z = zona(t);
  leg.className = 'bloco ' + z.cls + (b[2] === 'g' ? ' grande' : '');
  // saída: sobe e some nos últimos 0,12 s antes do próximo bloco ou do silêncio
  const fimVis = Math.min(prox, b[1] + 0.55);
  const out = clamp((t - (fimVis - 0.12)) / 0.12, 0, 1);
  for (const [raw, s] of b[3]) {
    if (t < s) continue;
    const chave = raw.startsWith('*');
    const el = document.createElement('span');
    el.className = 'w' + (chave ? ' k' : '');
    el.textContent = chave ? raw.slice(1) : raw;
    const p = t - s;
    const k = back(p / (chave ? 0.24 : 0.18));
    const e = ease(p / 0.16);
    const dy = (1 - e) * 46 - out * 26;
    const sc = chave ? 1.32 - 0.32 * k : 0.86 + 0.14 * k;
    const rot = chave ? -5 * (1 - ease(p / 0.24)) : 0;
    el.style.transform = `translateY(${dy.toFixed(1)}px) scale(${sc.toFixed(4)}) rotate(${rot.toFixed(2)}deg)`;
    el.style.opacity = (clamp(p / 0.08, 0, 1) * (1 - out)).toFixed(3);
    const blur = 9 * (1 - e) + 6 * out;
    el.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
    if (chave) el.style.setProperty('--sub', ease((p - 0.12) / 0.22).toFixed(3));
    leg.appendChild(el);
  }
  // centraliza o bloco na faixa da zona
  leg.style.top = '0px';
  const h = leg.getBoundingClientRect().height;
  leg.style.top = `${Math.round(z.centro - h / 2)}px`;
}
window.seek = seek;
window.__ready = document.fonts.ready.then(() => seek(0));

// prévia no navegador: abrir index.html?prev=caminho-do-video
const q = new URLSearchParams(location.search).get('prev');
if (q) {
  const v = $('prev'); v.src = q; v.style.display = 'block'; v.muted = false; v.controls = false;
  document.body.addEventListener('click', () => v.paused ? v.play() : v.pause());
  const loop = () => { seek(v.currentTime); requestAnimationFrame(loop); }; loop();
}
</script>
</body>
</html>
