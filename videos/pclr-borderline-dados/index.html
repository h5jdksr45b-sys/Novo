<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="39.5"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-pergunta"
        class="scene"
        data-composition-id="01-pergunta"
        data-composition-src="compositions/frames/01-pergunta.html"
        data-start="0"
        data-duration="5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-dados"
        class="scene"
        data-composition-id="02-dados"
        data-composition-src="compositions/frames/02-dados.html"
        data-start="4.5"
        data-duration="24"
        data-track-index="1"
      ></div>

      <div
        id="el-03-limites"
        class="scene"
        data-composition-id="03-limites"
        data-composition-src="compositions/frames/03-limites.html"
        data-start="28"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-chamada"
        class="scene"
        data-composition-id="04-chamada"
        data-composition-src="compositions/frames/04-chamada.html"
        data-start="34"
        data-duration="5.5"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-pergunta", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4.5);
        tl.fromTo("#el-02-dados", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4.5);
        tl.addLabel("hf:transition:01-pergunta:02-dados:crossfade", 4.5);
        tl.to("#el-02-dados", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 28);
        tl.fromTo("#el-03-limites", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 28);
        tl.addLabel("hf:transition:02-dados:03-limites:crossfade", 28);
        tl.to("#el-03-limites", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 34);
        tl.fromTo("#el-04-chamada", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 34);
        tl.addLabel("hf:transition:03-limites:04-chamada:crossfade", 34);
        tl.to({}, { duration: 39.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
