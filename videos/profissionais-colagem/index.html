:root{--cream:#EDE4D3;--paper:#F6F0E4;--key:#FAF6EC;--ink:#1A1A1A;--red:#A62B24}

#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:url(assets/bg.jpg)}
.scene{position:absolute;inset:0}
.p{position:absolute;left:0;top:0;will-change:transform;transform-origin:50% 50%}

.strip{position:absolute;left:0;top:0;white-space:nowrap;padding:14px 26px 12px;

.ser{font-family:Serif;font-style:italic;font-weight:400;line-height:1;color:var(--red);letter-spacing:0}
.lbl{font-family:Mont;font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase}
#cap{position:absolute;left:540px;top:1400px;transform:translate(-50%,-50%);

  padding:10px 22px 12px;white-space:nowrap;box-shadow:0 0 0 4px var(--key)}

<body>
<div id="stage"></div>
<script>
// ---------------- utilidades ----------------
const S = document.getElementById('stage');
const STEP = 1/12;                        // stop-motion: papel anda em passos de 12 por segundo
const q = t => Math.floor(t/STEP+1e-6)*STEP;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const easeOut=k=>1-Math.pow(1-k,3);
const backOut=k=>{const c=1.6;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
function hash(n){const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)}
let uid=0;
function mk(parent,tag,cls,props={}){const e=document.createElement(tag);e.className=cls||'';Object.assign(e,props);parent.appendChild(e);e._id=++uid;return e}
function img(parent,src){return mk(parent,'img','p',{src:'assets/'+src+'.png'})}
function strip(parent,html,extra=''){const e=mk(parent,'div','strip '+extra);e.innerHTML=html;return e}
// prop: {x,y,r,s,o}
function put(e,p){e.style.transform=`translate(${p.x}px,${p.y}px) translate(-50%,-50%) rotate(${p.r||0}deg) scale(${p.s==null?1:p.s})`;
  e.style.opacity=p.o==null?1:p.o; e.style.zIndex=p.z||''}
// entra de um ponto deslocado até o lugar, em passos
function enter(t,t0,dur,to,from,ease=easeOut){
  if(t<t0) return Object.assign({},to,{o:0});
  const k=clamp((q(t)-t0)/dur,0,1), e=ease(k);
  const o={x:lerp(to.x+(from.dx||0),to.x,e),y:lerp(to.y+(from.dy||0),to.y,e),
    r:lerp((to.r||0)+(from.dr||0),to.r||0,e),s:lerp(from.s==null?(to.s||1):from.s,to.s==null?1:to.s,e),o:1};
  if(k<1){o.r+= (hash(Math.floor(t/STEP)+t0*31)-.5)*1.2}  // tremor de mão em movimento
  return o}
function slap(t,t0,to){return enter(t,t0,.25,to,{s:(to.s||1)*1.35,dr:-6},backOut)}
function exitX(t,t1,dx=-1300){ if(t<t1) return 0; return lerp(0,dx,easeOut(clamp((q(t)-t1)/.3,0,1))) }

// ---------------- fala e legendas ----------------
// cada cena: janela de fala, blocos (máx. 3 palavras) com peso, e o bloco onde começa a ÊNFASE

const SCENES=[
 {a:0,b:4,  sp:[.15,3.8],  chunks:['Você já ouviu','de um profissional','que ele','não atende','borderline.'], emph:null},
 {a:4,b:10, sp:[4.1,9.8],  chunks:['Uma pesquisa ouviu','706 profissionais','de saúde mental','nos Estados Unidos.','|','Quase metade','disse que','prefere evitar','esses pacientes.'], emph:5},
 {a:10,b:14,sp:[10.1,13.7],chunks:['Psiquiatras,','psicólogos,','enfermeiros,','assistentes sociais.'], emph:null},
 {a:14,b:21,sp:[14.1,20.9],chunks:['Agora o dado','que quase','ninguém cita.','|','Quem tinha atendido','mais pacientes','com borderline','no último ano','mostrava mais cuidado,','mais empatia','e mais otimismo','com o tratamento.'], emph:8},
 {a:21,b:26,sp:[21.1,25.9],chunks:['Então um não','pode dizer mais','sobre a experiência','daquele profissional','do que','sobre você.'], emph:null},
 {a:26,b:30,sp:[26.05,29.2],chunks:['Na próxima busca,','pergunte quantas pessoas','com borderline','ele já atendeu.'], emph:1},
];
const CAPS=[];  // {t0,t1,text,hidden,scene}
SCENES.forEach((sc,si)=>{
  const w=sc.chunks.map(c=>c==='|'?5:c.replace(/\s/g,'').length+3);
  const tot=w.reduce((a,b)=>a+b,0); let t=sc.sp[0];
  sc.chunks.forEach((c,i)=>{const d=(sc.sp[1]-sc.sp[0])*w[i]/tot;
    if(c!=='|'){const hid= sc.emph!=null && i>=sc.emph && (sc.emphEnd==null || i<=sc.emphEnd);
      CAPS.push({t0:t,t1:t+d,text:c,hidden:hid,scene:si,idx:i});}
    t+=d});
  // tempo de início da ênfase
  if(sc.emph!=null){sc.eT0=CAPS.find(c=>c.scene===si&&c.idx===sc.emph).t0;
    sc.eT1= sc.emphEnd!=null? CAPS.find(c=>c.scene===si&&c.idx===sc.emphEnd).t1 : sc.b;}
});
const capT=(si,idx)=>CAPS.find(c=>c.scene===si&&c.idx===idx).t0;
const cap=mk(S,'div','',{id:'cap'});

// ---------------- ênfase (texto grande em recortes) ----------------
function emphasis(parent,lines,cy){
  const els=lines.map(l=>{const e=strip(parent,l.html,l.cls);e.style.fontSize=l.size+'px';e._l=l;return e});
  return {els,cy}}
function showEmph(E,t,t0,t1,dx=0){
  let y=E.cy; E.els.forEach((e,i)=>{const l=e._l; const p=slap(t,t0+i*.12,{x:540+(l.dx||0)+dx,y:y+(l.dy||0),r:l.r||0});
    if(t>=t1) p.o=0; put(e,Object.assign(p,{z:50}))})}


// ---------- porta: batente + folha que gira na dobradiça ----------
function mkDoor(parent,big){const w=mk(parent,'div','dwrap');
  const fr=mk(w,'img','',{src:'assets/'+(big?'frame_big':'frame')+'.png'});fr.style.position='absolute';
  fr.style.filter='drop-shadow(4px 7px 6px rgba(26,26,26,.28))';
  const dw=big?340:130, dh=big?680:260, b=big?26:12, k=7;
  const lf=mk(w,'div','door'); lf.style.width=dw+'px'; lf.style.height=dh+'px'; lf.style.left=(b+k)+'px'; lf.style.top=(b+k)+'px';
  const di=mk(lf,'img','',{src:'assets/'+(big?'door_big':'door')+'.png'}); di.style.display='block';
  w.style.width=(dw+2*b+2*k)+'px'; w.style.height=(dh+b+2*k)+'px'; w._leaf=lf; return w}
function swing(w,deg){const sh=Math.max(0,Math.min(1,-deg/80));
  w._leaf.style.transform=`perspective(1600px) rotateY(${deg}deg)`;
  w._leaf.style.filter=`brightness(${1-sh*.18}) drop-shadow(${-6*sh}px 6px 6px rgba(26,26,26,${.15+.2*sh}))`}
const OPEN=-72, AJAR=-42, SHUT=0;
// entre dois estados, em passos de stop-motion
function tween(t,t0,dur,a,b,ease=easeOut){if(t<=t0)return a;const k=clamp((q(t)-t0)/dur,0,1);return lerp(a,b,ease(k))}
const bangOut=k=>k<.8?Math.pow(k/.8,2):1+Math.sin((k-.8)/.2*Math.PI)*-.04;

// =============== CENA 1: porta fechando, plaquinha balançando ===============
const c1=mk(S,'div','scene');
const D1=mkDoor(c1,true);
const plq=img(D1._leaf,'plaque'); plq.style.position='absolute'; plq.style.transformOrigin='50% 0';
const ptape=img(D1._leaf,'tape_m'); ptape.style.position='absolute';

// =============== corredor de dez portas (cenas 2, 4 e 6) ===============
const cor=mk(S,'div','scene');
const doors=[...Array(10)].map(()=>mkDoor(cor,false));
const CLOSE=[1,3,5,8], HALF=6;
const DX=i=>210+(i%5)*160, DY=i=>i<5?760:1150;
const E2=emphasis(cor,[{html:'Quase metade',cls:'big',size:98,r:-2},{html:'prefere evitar',cls:'ser',size:130,r:1.5,dx:40,dy:150}],350);
// fichas: pilha ao lado do corredor (cena 4) e uma em cada porta (cena 6)
const pile=[...Array(5)].map(()=>img(cor,'card'));
const onDoor=doors.map(d=>{const c=mk(d,'img','',{src:'assets/card_s.png'});c.style.position='absolute';c.style.left='38px';c.style.top='60px';c.style.opacity=0;c.style.zIndex=3;c.style.filter='drop-shadow(3px 5px 4px rgba(26,26,26,.35))';return c});
const E4=emphasis(cor,[{html:'Mais',cls:'big',size:92,r:-2,dx:-150},{html:'atendimentos,',cls:'big',size:88,r:-1,dy:108},{html:'mais empatia',cls:'ser',size:124,r:1.5,dx:60,dy:258}],300);
const E6=emphasis(cor,[{html:'Quantas',cls:'big',size:130,r:-2,dx:-60},{html:'ele já atendeu?',cls:'ser',size:120,r:1.5,dx:30,dy:150}],340);
const end=mk(cor,'div','',{id:'endcard'});
end.innerHTML='<div class="n">Dr. Fabio Schmidt, médico, CRM-SP 183549</div><div class="t">Conteúdo educativo, não substitui consulta.</div><div class="f">Fonte: Black et al., CNS Spectrums 2011.</div>';

// =============== CENA 3: crachás em branco caindo na mesa ===============
const c3=mk(S,'div','scene');
const tbl=img(c3,'table');
const badges=[...Array(4)].map(()=>img(c3,'badge'));
const BP=[{x:300,y:1010,r:-12},{x:500,y:960,r:7},{x:700,y:1015,r:-5},{x:600,y:1080,r:14}];

// =============== CENA 5: a porta da cena 1 gira e mostra a pilha pequena ===============
const c5=mk(S,'div','scene');
const smallPile=[0,1].map(()=>img(c5,'card'));
const D5=mkDoor(c5,true);
const fade=mk(S,'div','',{id:'fade'});

function render(t){
  const sc=SCENES;
  let c=null; for(const x of CAPS){ if(x.t0<=t) c=x; } if(c && t>=c.t1+0.15) c=null;
  let inEmph=sc.some(s=>s.eT0!=null&&t>=s.eT0&&t<s.eT1);
  if(c&&!c.hidden&&!inEmph){cap.textContent=c.text;cap.style.opacity=1;
    const k=clamp((t-c.t0)/.08,0,1);cap.style.transform=`translate(-50%,-50%) scale(${lerp(.94,1,k)})`}
  else cap.style.opacity=0;

  // ---- CENA 1 (0 a 4)
  c1.style.display=t<4.3?'':'none';
  if(t<4.3){const ox=exitX(t,3.9);
    const p=enter(t,.05,.45,{x:540,y:860},{dy:900}); p.x+=ox; put(D1,p);
    swing(D1,tween(t,.6,2.7,OPEN,SHUT,k=>k*k*(3-2*k)));   // fecha devagar
    // plaquinha presa com fita, balançando
    const sw=t<.9?0:Math.sin((q(t)-.9)*5.2)*9*Math.exp(-(t-.9)*.35)+Math.sin(q(t)*2.1)*2;
    const ps=t<.9?0:1; plq.style.left='75px'; plq.style.top='255px'; plq.style.opacity=ps;
    plq.style.transform=`rotate(${sw}deg)`;
    ptape.style.left='115px'; ptape.style.top='238px'; ptape.style.opacity=ps; ptape.style.transform='rotate(-6deg)';
  }
  // ---- corredor (4 a 10, 14 a 21, 26 a 30)
  const corOn=(t>=3.95&&t<10.3)||(t>=13.95&&t<21.3)||(t>=25.95);
  cor.style.display=corOn?'':'none';
  if(corOn){
    let ox=0; if(t<10.3) ox=exitX(t,9.9); else if(t<21.3) ox=exitX(t,20.9);
    const seg=t<10.3?2:t<21.3?4:6;
    const e2=sc[1].eT0, s4=capT(3,4), s4e=sc[3].eT0;
    const sh4= seg===4?.82:1, sx4= seg===4?-20:0;     // na cena 4 o corredor encolhe para dar lugar à pilha
    doors.forEach((d,i)=>{
      const st= seg===2?4.1:seg===4?14.05:26.05;
      const to={x:DX(i)*sh4+sx4,y:(DY(i)-955)*sh4+955,s:sh4};
      const p=enter(t,st+i*.05,.3,to,{dy:seg===6?-900:700}); p.x+=ox; put(d,p);
      let a=OPEN;
      if(seg===2){ if(i===HALF) a=tween(t,e2+.2+4*.22,.3,OPEN,AJAR); else if(CLOSE.includes(i)) a=tween(t,e2+.2+CLOSE.indexOf(i)*.22,.22,OPEN,SHUT,bangOut); }
      if(seg===4){ const order=[...CLOSE,HALF]; const k=order.indexOf(i);
        if(k>=0){const t0=s4+(s4e-s4)*(k+.6)/5; a=tween(t,t0,.3,i===HALF?AJAR:SHUT,OPEN);} }
      swing(d,a);
      onDoor[i].style.opacity= seg===6 && t>=27.0+i*.09 ? 1:0;
      onDoor[i].style.transform=`rotate(${(hash(i+4)-.5)*14}deg) scale(${seg===6&&t<27.0+i*.09+.17?1.6:1.25})`;
    });
    // pilha de fichas ao lado do corredor
    pile.forEach((e,k)=>{ if(seg!==4){put(e,{x:0,y:0,o:0});return}
      const t0=s4+(s4e-s4)*k/5; const p=slap(t,t0,{x:835,y:1250-k*32,r:(hash(k+7)-.5)*10,s:.7}); p.x+=ox; put(e,Object.assign(p,{z:20}))});
    if(seg===2) showEmph(E2,t,e2+.03,99,ox); else E2.els.forEach(e=>put(e,{x:0,y:0,o:0}));
    if(seg===4) showEmph(E4,t,s4e+.03,99,ox); else E4.els.forEach(e=>put(e,{x:0,y:0,o:0}));
    if(seg===6){ showEmph(E6,t,sc[5].eT0+.03,99);
      const ec=enter(t,sc[5].eT0+.5,.3,{x:540,y:1415,r:-1},{dy:120});
      end.style.transform=`translate(-50%,-50%) translate(${ec.x-540}px,${ec.y-1290}px) rotate(${ec.r}deg)`; end.style.opacity=ec.o;
    } else { E6.els.forEach(e=>put(e,{x:0,y:0,o:0})); end.style.opacity=0; }
  }
  // ---- CENA 3 (10 a 14)
  c3.style.display=(t>=9.95&&t<14.3)?'':'none';
  if(t>=9.95&&t<14.3){const ox=exitX(t,13.9);
    const p=enter(t,10.0,.35,{x:540,y:1100},{dy:700}); p.x+=ox; put(tbl,p);
    badges.forEach((b,i)=>{const t0=capT(2,i)-.05; const p=enter(t,t0,.3,BP[i],{dy:-1300,dr:(hash(i)-.5)*60},backOut); p.x+=ox; put(b,Object.assign(p,{z:5+i}))});
  }
  // ---- CENA 5 (21 a 26)
  c5.style.display=(t>=20.95&&t<26.3)?'':'none';
  if(t>=20.95&&t<26.3){const ox=exitX(t,25.9);
    const turn=capT(4,1);
    const p=enter(t,21.05,.35,{x:540,y:860},{dy:900}); p.x+=ox;
    // a porta fechada vira de lado e desliza, revelando a pilha pequena atrás
    const k=easeOut(clamp((q(t)-turn)/.6,0,1));
    p.x+=lerp(0,-200,k); put(D5,Object.assign(p,{z:5})); swing(D5,lerp(SHUT,-82,k));
    smallPile.forEach((e,i)=>{const pp={x:660+ox+(i?6:-4),y:1080-i*34,r:i?-5:4,s:.9,o:t>=21.05?1:0}; put(e,Object.assign(pp,{z:1}))});
  }
  fade.style.opacity=t>29.9?clamp((t-29.9)/.1,0,1):0;
}
window.render=render; window.SCENES=SCENES; window.CAPS=CAPS;
render(0);
</script>
</body>
</html>
