<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0d0d0d; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #ground { position: absolute; inset: 0; background: #0d0d0d; }
      .wrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .wrap video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #dip { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 20; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.0" data-width="1080" data-height="1920">
      <div id="ground"></div>
      <div id="w1" class="wrap" style="z-index:1">
        <video id="v1" class="clip" src="assets/clips/1-celular.mp4" data-start="0.0" data-duration="5.0" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w2" class="wrap" style="z-index:2">
        <video id="v2" class="clip" src="assets/clips/2-corredor.mp4" data-start="5.0" data-duration="5.0" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w3" class="wrap" style="z-index:3">
        <video id="v3" class="clip" src="assets/clips/3-soleira.mp4" data-start="10.0" data-duration="5.0" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w4" class="wrap" style="z-index:4">
        <video id="v4" class="clip" src="assets/clips/4-timer.mp4" data-start="15.0" data-duration="5.9" data-playback-rate="0.85" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w5" class="wrap" style="z-index:5">
        <video id="v5" class="clip" src="assets/clips/5-sala.mp4" data-start="20.9" data-duration="6.7" data-playback-rate="0.75" data-track-index="1" muted playsinline></video>
      </div>
      <div id="dip"></div>
      <div id="graficos" data-composition-id="graficos" data-composition-src="compositions/graficos.html"
        data-start="0" data-duration="30.0" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:30"></div>
      <div id="legendas" data-composition-id="legendas" data-composition-src="compositions/legendas.html"
        data-start="0" data-duration="30.0" data-track-index="3" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index:40"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#w1", {scale:1.56, transformOrigin:"50% 60%"}, {scale:1.5, transformOrigin:"50% 60%", duration:0.35, ease:"power3.out"}, 2.42);
      tl.fromTo("#w2", {scale:1.664, transformOrigin:"39% 57%"}, {scale:1.6, transformOrigin:"39% 57%", duration:0.35, ease:"power3.out"}, 7.0);
      tl.fromTo("#w4", {scale:1.456, transformOrigin:"28% 66%"}, {scale:1.4, transformOrigin:"28% 66%", duration:0.35, ease:"power3.out"}, 18.5);
      tl.fromTo("#dip", {opacity:0}, {opacity:0.45, duration:0.1, ease:"power2.in"}, 4.9);
      tl.set("#dip", {opacity:0}, 5.0);
      tl.fromTo("#dip", {opacity:0}, {opacity:0.45, duration:0.1, ease:"power2.in", immediateRender:false}, 9.9);
      tl.set("#dip", {opacity:0}, 10.0);
      tl.fromTo("#dip", {opacity:0}, {opacity:0.45, duration:0.1, ease:"power2.in", immediateRender:false}, 20.8);
      tl.set("#dip", {opacity:0}, 20.9);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
