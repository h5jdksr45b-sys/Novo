<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <title>Aula 2 abertura</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/kit.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <style>
      @font-face { font-family: "Source Sans 3"; src: url("assets/fonts/source-sans-3-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Source Sans 3"; src: url("assets/fonts/source-sans-3-600.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Source Sans 3"; src: url("assets/fonts/source-sans-3-800.woff2") format("woff2"); font-weight: 700 800; }
      #a2a-esquema { overflow: visible; }
      #a2a-msg { position: absolute; left: 120px; top: 330px; display: flex; flex-direction: column; gap: 8px; }
      #a2a-bolha { position: relative; width: 150px; height: 92px; background: #e9e6e1; border-radius: 34px 34px 34px 8px; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3); }
      #a2a-pontos { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px; }
      .a2a-ponto { width: 16px; height: 16px; border-radius: 50%; background: #7d858e; }
      #a2a-ok { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 52px; color: #1f2329; opacity: 0; }
      #a2a-hora { font-size: 20px; font-weight: 600; color: #e3e7ea; padding-left: 10px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="aula2-abertura" data-start="0" data-duration="7.5" data-width="720" data-height="1280">
      <div class="fundo"></div>
      <div class="mancha m1"></div><div class="mancha m2"></div><div class="mancha m3"></div>

      <section id="a2a-cena1" class="cena clip" data-start="0" data-duration="5.35" data-track-index="0">
        <div class="selo"><span>Protocolo <b>7</b> Dias</span></div>

        <svg id="a2a-esquema" class="esquema" viewBox="0 0 720 540">
          <path id="a2a-anel" pathLength="1" fill="none" stroke="#c3cad1" stroke-width="5" stroke-linecap="round" d="M360 110 A160 160 0 1 1 359.9 110" />
          <g id="a2a-orbita" opacity="0"><circle cx="360" cy="110" r="9" fill="#f4f1ec" /></g>
          <g class="a2a-no" id="a2a-n1"><circle cx="360" cy="110" r="32" fill="#3b4450" stroke="#c3cad1" stroke-width="3" /><text class="etiqueta" x="360" y="118" text-anchor="middle">1</text></g>
          <g class="a2a-no" id="a2a-n2"><circle cx="520" cy="270" r="32" fill="#3b4450" stroke="#c3cad1" stroke-width="3" /><text class="etiqueta" x="520" y="278" text-anchor="middle">2</text></g>
          <g class="a2a-no" id="a2a-n3"><circle id="a2a-c3" cx="360" cy="430" r="32" fill="#3b4450" stroke="#c3cad1" stroke-width="3" /><text class="etiqueta" x="360" y="438" text-anchor="middle">3</text></g>
          <g class="a2a-no" id="a2a-n4"><circle cx="200" cy="270" r="32" fill="#3b4450" stroke="#c3cad1" stroke-width="3" /><text class="etiqueta" x="200" y="278" text-anchor="middle">4</text></g>
          <text class="etiqueta a2a-rot" x="360" y="62" text-anchor="middle">Micro-rejeição</text>
          <text class="etiqueta a2a-rot" x="566" y="278">Escalada</text>
          <text class="etiqueta a2a-rot" x="360" y="498" text-anchor="middle">Ato impulsivo</text>
          <text class="etiqueta a2a-rot" x="154" y="278" text-anchor="end">Pós-crise</text>
        </svg>

        <div id="a2a-msg">
          <div id="a2a-bolha">
            <div id="a2a-pontos"><span class="a2a-ponto"></span><span class="a2a-ponto"></span><span class="a2a-ponto"></span></div>
            <div id="a2a-ok">ok</div>
          </div>
          <span id="a2a-hora">agora</span>
        </div>

        <div class="frases">
          <span class="linha" id="a2a-l1">Começa com um <span class="bolha-ok">ok</span></span>
          <span class="linha" id="a2a-l2">sem emoji.</span>
          <span class="linha" id="a2a-l3">Termina com você</span>
          <span class="linha destaque" id="a2a-l4">pedindo desculpas.</span>
        </div>
      </section>

      <section id="a2a-cena2" class="cena clip" data-start="5.35" data-duration="2.15" data-track-index="1">
        <div class="cartela" id="a2a-cartela">
          <svg viewBox="0 0 140 140" width="130" height="130">
            <path class="a2a-ciclo" pathLength="1" fill="none" stroke="#c3cad1" stroke-width="4" d="M70 18 A52 52 0 1 1 69.9 18" />
            <circle class="a2a-mini" cx="70" cy="18" r="11" fill="#f4f1ec" />
            <circle class="a2a-mini" cx="122" cy="70" r="11" fill="#f4f1ec" />
            <circle class="a2a-mini" cx="70" cy="122" r="11" fill="#e8622c" />
            <circle class="a2a-mini" cx="18" cy="70" r="11" fill="#e9c24b" />
          </svg>
          <span class="rotulo">Protocolo 7 Dias</span>
          <span class="numero"><small>Aula</small>2</span>
          <span class="traco"></span>
          <span class="titulo">O ciclo da crise em 4 etapas</span>
        </div>
      </section>

      <div class="painel p1"></div><div class="painel p2"></div>
      <div class="grao"></div>
      <div class="vinheta"></div>

      <audio id="a2a-pad" src="assets/sfx/pad-8s.wav" data-start="0" data-duration="7.5" data-track-index="10" data-volume="0.55"></audio>
      <audio id="a2a-s1" src="assets/sfx/click.wav" data-start="0.12" data-track-index="11" data-volume="0.7"></audio>
      <audio id="a2a-s2" src="assets/sfx/pop-agudo.wav" data-start="0.35" data-track-index="12" data-volume="0.45"></audio>
      <audio id="a2a-s3" src="assets/sfx/digitando.wav" data-start="0.55" data-track-index="13" data-volume="0.8"></audio>
      <audio id="a2a-s4" src="assets/sfx/digitando.wav" data-start="1.0" data-track-index="14" data-volume="0.7"></audio>
      <audio id="a2a-s5" src="assets/sfx/pop.wav" data-start="1.45" data-track-index="15" data-volume="0.7"></audio>
      <audio id="a2a-s6" src="assets/sfx/whoosh.wav" data-start="1.7" data-track-index="16" data-volume="0.5"></audio>
      <audio id="a2a-s7" src="assets/sfx/whoosh-curto.wav" data-start="2.7" data-track-index="17" data-volume="0.55"></audio>
      <audio id="a2a-s8" src="assets/sfx/click.wav" data-start="3.0" data-track-index="18" data-volume="0.55"></audio>
      <audio id="a2a-s9" src="assets/sfx/click.wav" data-start="3.35" data-track-index="19" data-volume="0.55"></audio>
      <audio id="a2a-s10" src="assets/sfx/impacto.wav" data-start="3.7" data-track-index="20" data-volume="0.7"></audio>
      <audio id="a2a-s11" src="assets/sfx/click.wav" data-start="4.05" data-track-index="21" data-volume="0.55"></audio>
      <audio id="a2a-s12" src="assets/sfx/whoosh.wav" data-start="3.75" data-track-index="22" data-volume="0.45"></audio>
      <audio id="a2a-s13" src="assets/sfx/whoosh-grave.wav" data-start="4.9" data-track-index="23" data-volume="0.75"></audio>
      <audio id="a2a-s14" src="assets/sfx/pop-agudo.wav" data-start="5.5" data-track-index="24" data-volume="0.5"></audio>
      <audio id="a2a-s15" src="assets/sfx/click.wav" data-start="5.85" data-track-index="25" data-volume="0.55"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      Kit.fundo(tl, 7.5);
      Kit.selo(tl, 0.1);

      // Alguém está digitando... e chega um ok
      tl.fromTo("#a2a-bolha", { scale: 0, transformOrigin: "0% 100%" }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.35);
      tl.fromTo(".a2a-ponto", { y: 0 }, { y: -10, duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut", stagger: 0.09 }, 0.55);
      tl.to("#a2a-pontos", { opacity: 0, duration: 0.1 }, 1.42);
      tl.fromTo("#a2a-ok", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 1.45);
      tl.fromTo("#a2a-bolha", { scale: 1 }, { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 1.45);
      tl.fromTo("#a2a-hora", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.6);
      Kit.linha(tl, "#a2a-l1", 1.7);
      Kit.linha(tl, "#a2a-l2", 1.9);

      // A mensagem vira a etapa 1 do ciclo
      tl.to("#a2a-hora", { opacity: 0, duration: 0.15 }, 2.6);
      tl.to("#a2a-msg", { x: 180, y: -86, scale: 0.42, opacity: 0, duration: 0.45, ease: "power3.in" }, 2.65);
      Kit.surgir(tl, "#a2a-n1", 2.95, 0.35);
      Kit.desenhar(tl, "#a2a-anel", 3.0, 1.3);
      tl.fromTo("#a2a-orbita", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 3.0);
      tl.to("#a2a-orbita", { opacity: 0, duration: 0.2 }, 4.3);
      tl.fromTo("#a2a-orbita", { rotation: 0, svgOrigin: "360 270" }, { rotation: 360, duration: 1.3, ease: "power2.inOut" }, 3.0);
      Kit.surgir(tl, "#a2a-n2", 3.33, 0.35);
      Kit.surgir(tl, "#a2a-n3", 3.65, 0.4);
      tl.to("#a2a-c3", { attr: { fill: "#b8322a", stroke: "#e8622c" }, duration: 0.2 }, 3.7);
      tl.fromTo("#a2a-n3", { scale: 1, svgOrigin: "360 430" }, { scale: 1.25, duration: 0.15, yoyo: true, repeat: 3, ease: "power2.out", immediateRender: false }, 3.75);
      Kit.surgir(tl, "#a2a-n4", 4.03, 0.35);
      tl.fromTo(".a2a-rot", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.33 }, 3.05);
      Kit.linha(tl, "#a2a-l3", 3.75);
      Kit.linha(tl, "#a2a-l4", 3.95);

      // Título da aula
      Kit.deslize(tl, 4.9);
      Kit.desenhar(tl, ".a2a-ciclo", 5.45, 0.6);
      tl.fromTo(".a2a-mini", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.12 }, 5.55);
      Kit.cartela(tl, 5.5);
      Kit.respiro(tl, "#a2a-cartela", 6.2, 1.3);

      window.__timelines["aula2-abertura"] = tl;
    </script>
  </body>
</html>
