<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <title>Aula 3 abertura</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/kit.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <style>
      @font-face { font-family: "Source Sans 3"; src: url("assets/fonts/source-sans-3-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Source Sans 3"; src: url("assets/fonts/source-sans-3-600.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Source Sans 3"; src: url("assets/fonts/source-sans-3-800.woff2") format("woff2"); font-weight: 700 800; }
      #a3a-chat { position: absolute; left: 60px; right: 60px; top: 200px; height: 500px; }
      .a3a-msg { position: absolute; border-radius: 30px; padding: 18px 26px; font-weight: 600; font-size: 30px; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3); opacity: 0; }
      #a3a-enviada { right: 0; top: 0; background: var(--aco); color: var(--branco); border-bottom-right-radius: 8px; }
      #a3a-status { position: absolute; right: 8px; top: 92px; font-size: 20px; font-weight: 600; color: #e3e7ea; opacity: 0; }
      .a3a-rec { left: 0; background: var(--vermelho); border-bottom-left-radius: 8px; display: flex; align-items: center; gap: 14px; }
      .a3a-rec .ex { font-weight: 800; font-size: 40px; line-height: 1; }
      .a3a-rec svg { display: block; }
      #a3a-r1 { top: 150px; } #a3a-r2 { top: 262px; } #a3a-r3 { top: 374px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="aula3-abertura" data-start="0" data-duration="7.5" data-width="720" data-height="1280">
      <div class="fundo"></div>
      <div class="mancha m1"></div><div class="mancha m2"></div><div class="mancha m3"></div>

      <section id="a3a-cena1" class="cena clip" data-start="0" data-duration="5.35" data-track-index="0">
        <div class="selo"><span>Protocolo <b>7</b> Dias</span></div>
        <div id="a3a-chat">
          <div class="a3a-msg" id="a3a-enviada">depois a gente fala</div>
          <span id="a3a-status">enviada</span>
          <div class="a3a-msg a3a-rec" id="a3a-r1"><span class="ex">!</span><svg width="210" height="20" viewBox="0 0 210 20"><path d="M2 10 Q20 0 38 10 T74 10 T110 10 T146 10 T182 10 T208 10" fill="none" stroke="#f4f1ec" stroke-width="5" stroke-linecap="round" /></svg></div>
          <div class="a3a-msg a3a-rec" id="a3a-r2"><span class="ex">!!</span><svg width="260" height="20" viewBox="0 0 260 20"><path d="M2 10 Q20 0 38 10 T74 10 T110 10 T146 10 T182 10 T218 10 T258 10" fill="none" stroke="#f4f1ec" stroke-width="5" stroke-linecap="round" /></svg></div>
          <div class="a3a-msg a3a-rec" id="a3a-r3"><span class="ex">!!!</span><svg width="300" height="20" viewBox="0 0 300 20"><path d="M2 10 Q20 0 38 10 T74 10 T110 10 T146 10 T182 10 T218 10 T254 10 T298 10" fill="none" stroke="#f4f1ec" stroke-width="5" stroke-linecap="round" /></svg></div>
        </div>
        <div class="frases">
          <span class="linha" id="a3a-l1">Uma resposta seca</span>
          <span class="linha" id="a3a-l2">virou acusação.</span>
          <span class="linha" id="a3a-l3">Como acolher</span>
          <span class="linha destaque" id="a3a-l4">sem virar capacho?</span>
        </div>
      </section>

      <section id="a3a-cena2" class="cena clip" data-start="5.35" data-duration="2.15" data-track-index="1">
        <div class="cartela" id="a3a-cartela">
          <svg class="icone-cartela" viewBox="0 0 150 120" width="150" height="120">
            <rect class="a3a-pilar" x="8" y="40" width="34" height="72" rx="8" fill="#e8622c" />
            <rect class="a3a-pilar" x="58" y="20" width="34" height="92" rx="8" fill="#f4f1ec" />
            <rect class="a3a-pilar" x="108" y="40" width="34" height="72" rx="8" fill="#46708c" />
          </svg>
          <span class="rotulo">Protocolo 7 Dias</span>
          <span class="numero"><small>Aula</small>3</span>
          <span class="traco"></span>
          <span class="titulo">Validação cirúrgica</span>
        </div>
      </section>

      <div class="painel p1"></div><div class="painel p2"></div>
      <div class="grao"></div>
      <div class="vinheta"></div>

      <audio id="a3a-pad" src="assets/sfx/pad-8s.wav" data-start="0" data-duration="7.5" data-track-index="10" data-volume="0.55"></audio>
      <audio id="a3a-s1" src="assets/sfx/click.wav" data-start="0.12" data-track-index="11" data-volume="0.7"></audio>
      <audio id="a3a-s2" src="assets/sfx/whoosh-curto.wav" data-start="0.35" data-track-index="12" data-volume="0.5"></audio>
      <audio id="a3a-s3" src="assets/sfx/pop-agudo.wav" data-start="0.6" data-track-index="13" data-volume="0.45"></audio>
      <audio id="a3a-s4" src="assets/sfx/pop.wav" data-start="1.15" data-track-index="14" data-volume="0.6"></audio>
      <audio id="a3a-s5" src="assets/sfx/whoosh.wav" data-start="1.3" data-track-index="15" data-volume="0.45"></audio>
      <audio id="a3a-s6" src="assets/sfx/pop.wav" data-start="1.5" data-track-index="16" data-volume="0.65"></audio>
      <audio id="a3a-s7" src="assets/sfx/impacto.wav" data-start="1.85" data-track-index="17" data-volume="0.7"></audio>
      <audio id="a3a-s8" src="assets/sfx/whoosh.wav" data-start="3.05" data-track-index="18" data-volume="0.5"></audio>
      <audio id="a3a-s9" src="assets/sfx/click.wav" data-start="3.6" data-track-index="19" data-volume="0.55"></audio>
      <audio id="a3a-s10" src="assets/sfx/whoosh-grave.wav" data-start="4.9" data-track-index="20" data-volume="0.75"></audio>
      <audio id="a3a-s11" src="assets/sfx/click.wav" data-start="5.5" data-track-index="21" data-volume="0.55"></audio>
      <audio id="a3a-s12" src="assets/sfx/click.wav" data-start="5.62" data-track-index="22" data-volume="0.55"></audio>
      <audio id="a3a-s13" src="assets/sfx/click.wav" data-start="5.74" data-track-index="23" data-volume="0.55"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      Kit.fundo(tl, 7.5);
      Kit.selo(tl, 0.1);

      // Mensagem enviada com pressa
      tl.fromTo("#a3a-enviada", { opacity: 0, x: 80, scale: 0.8, transformOrigin: "100% 100%" }, { opacity: 1, x: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.35);
      tl.fromTo("#a3a-status", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.6);

      // A resposta chega em acusações, cada vez maiores
      [["#a3a-r1", 1.15], ["#a3a-r2", 1.5], ["#a3a-r3", 1.85]].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0, x: -80, scale: 0.8, transformOrigin: "0% 100%" }, { opacity: 1, x: 0, scale: 1, duration: 0.3, ease: "back.out(2.5)" }, t);
      });
      tl.fromTo("#a3a-chat", { x: 0 }, { x: 10, duration: 0.05, yoyo: true, repeat: 7, ease: "none" }, 1.85);
      tl.to(["#a3a-enviada", "#a3a-status"], { opacity: 0.35, duration: 0.4 }, 2.0);

      Kit.linha(tl, "#a3a-l1", 1.3);
      Kit.linha(tl, "#a3a-l2", 1.5);
      Kit.linha(tl, "#a3a-l3", 3.05);
      Kit.linha(tl, "#a3a-l4", 3.25);
      tl.to(".a3a-rec", { opacity: 0.4, duration: 0.5 }, 3.1);

      // Título da aula
      Kit.deslize(tl, 4.9);
      tl.fromTo(".a3a-pilar", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.12 }, 5.5);
      Kit.cartela(tl, 5.45);
      Kit.respiro(tl, "#a3a-cartela", 6.2, 1.3);

      window.__timelines["aula3-abertura"] = tl;
    </script>
  </body>
</html>
