  <body>

        </div>
        <div class="frases">
          <span class="linha" id="a4a-l1">Você explicou</span>

    <script>
      const tl = gsap.timeline({ paused: true });
      Kit.fundo(tl, 7.5);
      Kit.selo(tl, 0.1);

      // A explicação cresce linha por linha
      tl.fromTo("#a4a-texto", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 0.35);
      tl.fromTo(".a4a-barra", { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "power1.out", stagger: 0.2 }, 0.55);
      Kit.linha(tl, "#a4a-l1", 1.25);
      Kit.linha(tl, "#a4a-l2", 1.45);

      // As palavras pegam fogo
      tl.to(".a4a-barra", { backgroundColor: "#e8622c", duration: 0.25, stagger: { each: 0.08, from: "end" } }, 2.2);
      tl.to("#a4a-texto", { backgroundColor: "#3a2a26", duration: 0.5 }, 2.4);
      tl.fromTo("#a4a-chama", { opacity: 0, scale: 0.4, y: 120, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1.25, y: 0, duration: 0.5, ease: "back.out(2.2)" }, 2.85);
      tl.to("#a4a-texto", { y: 260, scale: 0.6, opacity: 0, duration: 0.5, ease: "power2.in" }, 2.85);
      tl.fromTo("#a4a-chama", { scaleY: 1.25 }, { scaleY: 1.33, duration: 0.17, yoyo: true, repeat: 9, ease: "sine.inOut", immediateRender: false }, 3.35);
      Kit.linha(tl, "#a4a-l3", 3.0);
      Kit.linha(tl, "#a4a-l4", 3.2);

      // Título da aula
      Kit.deslize(tl, 4.9);
      Kit.desenhar(tl, ".a4a-escudo", 5.45, 0.6, 0.2);
      Kit.cartela(tl, 5.45);
      Kit.respiro(tl, "#a4a-cartela", 6.2, 1.3);

      window.__timelines["aula4-abertura"] = tl;
    </script>
