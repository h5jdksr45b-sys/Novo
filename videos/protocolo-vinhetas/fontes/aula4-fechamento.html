      @font-face { font-family: "Source Sans 3"; src: url("assets/fonts/source-sans-3-600.woff2") format("woff2"); font-weight: 600; }

  <body>

      <div class="mancha m1"></div><div class="mancha m2"></div><div class="mancha m3"></div>

        <div class="selo"><span>Protocolo <b>7</b> Dias · Aula 4</span></div>

        </svg>
        <div class="passos">
          <div class="passo" id="a4f-p1"><span class="num">1</span><span class="txt">Uma regra curta</span></div>
          <div class="passo" id="a4f-p2"><span class="num">2</span><span class="txt">A mesma frase, no mesmo tom</span></div>
          <div class="passo" id="a4f-p3"><span class="num">3</span><span class="txt">Acordo só depois da crise</span></div>
        </div>
        <div class="frases">
          <span class="linha" id="a4f-l1">Limite curto.</span>
          <span class="linha" id="a4f-l2">Repetido.</span>
          <span class="linha" id="a4f-l3">Sem oxigênio,</span>
          <span class="linha destaque" id="a4f-l4">a crise perde força.</span>
        </div>
      </section>

      <section id="a4f-cena2" class="cena clip" data-start="5.25" data-duration="3.25" data-track-index="1">

        </div>
        <div class="assinatura"><span class="nome">Dr. Fabio Schmidt</span><span class="cargo">Médico · CRM-SP 183549</span></div>
      </section>

      <div class="vinheta"></div>

    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      Kit.fundo(tl, 8.5);
      Kit.selo(tl, 0.1);

      // A chama começa alta; cada passo tira um pouco do ar dela
      Kit.surgir(tl, "#a4f-chama", 0.25, 0.4);
      tl.fromTo("#a4f-chama", { scaleY: 1, transformOrigin: "50% 100%" }, { scaleY: 1.08, duration: 0.16, yoyo: true, repeat: 15, ease: "sine.inOut", immediateRender: false }, 0.65);
      const tamanhos = [0.82, 0.64, 0.46];
      ["#a4f-p1", "#a4f-p2", "#a4f-p3"].forEach((sel, i) => {
        const t = 0.45 + i * 0.5;
        tl.fromTo(sel, { x: -620, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, t);
        tl.fromTo(sel + " .num", { scale: 0.4 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, t + 0.2);
        tl.to("#a4f-chama", { scale: tamanhos[i], duration: 0.35, ease: "power2.out" }, t + 0.2);
      });
      Kit.linha(tl, "#a4f-l1", 1.0);
      Kit.linha(tl, "#a4f-l2", 1.2);

      // Sem oxigênio, a chama some
      tl.to("#a4f-chama", { scale: 0, opacity: 0, duration: 0.7, ease: "power2.in" }, 2.9);
      tl.to(".passo .num", { backgroundColor: "#e8622c", duration: 0.3, stagger: 0.1 }, 3.2);
      Kit.linha(tl, "#a4f-l3", 3.1);
      Kit.linha(tl, "#a4f-l4", 3.3);

      // Próxima aula
      Kit.deslize(tl, 4.8);
      Kit.cartela(tl, 5.4);
      Kit.assinatura(tl, 6.7);
      Kit.respiro(tl, "#a4f-cartela", 6.0, 2.5);
      tl.to(".fim", { opacity: 1, duration: 0.5, ease: "power1.in" }, 8.0);

      window.__timelines["aula4-fechamento"] = tl;
    </script>
  </body>
