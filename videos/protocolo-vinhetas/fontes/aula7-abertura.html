<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <title>Aula 7 abertura</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/kit.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <style>
      @font-face { font-family: "Source Sans 3"; src: url("assets/fonts/source-sans-3-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Source Sans 3"; src: url("assets/fonts/source-sans-3-600.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Source Sans 3"; src: url("assets/fonts/source-sans-3-800.woff2") format("woff2"); font-weight: 700 800; }
      #a7a-cena { position: absolute; left: 0; top: 180px; width: 720px; height: 540px; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="aula7-abertura" data-start="0" data-duration="7.5" data-width="720" data-height="1280">
      <div class="fundo"></div>
      <div class="mancha m1"></div><div class="mancha m2"></div><div class="mancha m3"></div>

      <section id="a7a-cena1" class="cena clip" data-start="0" data-duration="5.35" data-track-index="0">
        <div class="selo"><span>Protocolo <b>7</b> Dias</span></div>
        <svg id="a7a-cena" viewBox="0 0 720 540">
          <!-- Bateria de energia -->
          <g id="a7a-bateria">
            <rect x="240" y="90" width="210" height="330" rx="22" fill="#1d2228" stroke="#f4f1ec" stroke-width="8" />
            <rect x="305" y="62" width="80" height="30" rx="8" fill="#f4f1ec" />
            <rect class="a7a-barra" id="a7a-r4" x="262" y="112" width="166" height="66" rx="10" fill="#3fae8a" />
            <rect class="a7a-barra" id="a7a-r3" x="262" y="186" width="166" height="66" rx="10" fill="#3fae8a" />
            <rect class="a7a-barra" id="a7a-r2" x="262" y="260" width="166" height="66" rx="10" fill="#3fae8a" />
            <rect class="a7a-barra" id="a7a-r1" x="262" y="334" width="166" height="66" rx="10" fill="#3fae8a" />
          </g>
          <text id="a7a-pct" class="etiqueta" x="345" y="470" text-anchor="middle" style="font-size:30px;font-weight:800">100%</text>
          <!-- Pressão da crise -->
          <g id="a7a-setas" fill="#e8622c">
            <path class="a7a-seta" d="M140 160 L200 190 L140 220 Z" />
            <path class="a7a-seta" d="M140 240 L200 270 L140 300 Z" />
            <path class="a7a-seta" d="M140 320 L200 350 L140 380 Z" />
          </g>
        </svg>
        <div class="frases">
          <span class="linha" id="a7a-l1">Você não cede</span>
          <span class="linha" id="a7a-l2">por fraqueza.</span>
          <span class="linha" id="a7a-l3">Cede por</span>
          <span class="linha destaque" id="a7a-l4">exaustão.</span>
        </div>
      </section>

      <section id="a7a-cena2" class="cena clip" data-start="5.35" data-duration="2.15" data-track-index="1">
        <div class="cartela" id="a7a-cartela">
          <svg class="icone-cartela" viewBox="0 0 120 120" width="110" height="110">
            <rect class="a7a-ic" pathLength="1" x="14" y="34" width="80" height="52" rx="8" fill="none" stroke="#f4f1ec" stroke-width="6" />
            <path class="a7a-ic" pathLength="1" fill="none" stroke="#f4f1ec" stroke-width="6" stroke-linecap="round" d="M102 50 V70" />
            <path class="a7a-ic" pathLength="1" fill="none" stroke="#e9c24b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" d="M58 42 L44 62 H62 L50 80" />
          </svg>
          <span class="rotulo">Protocolo 7 Dias</span>
          <span class="numero"><small>Aula</small>7</span>
          <span class="traco"></span>
          <span class="titulo">Manutenção e proteção pessoal</span>
        </div>
      </section>

      <div class="painel p1"></div><div class="painel p2"></div>
      <div class="grao"></div>
      <div class="vinheta"></div>

      <audio id="a7a-pad" src="assets/sfx/pad-8s.wav" data-start="0" data-duration="7.5" data-track-index="10" data-volume="0.55"></audio>
      <audio id="a7a-s1" src="assets/sfx/click.wav" data-start="0.12" data-track-index="11" data-volume="0.7"></audio>
      <audio id="a7a-s2" src="assets/sfx/pop-agudo.wav" data-start="0.35" data-track-index="12" data-volume="0.45"></audio>
      <audio id="a7a-s3" src="assets/sfx/whoosh-curto.wav" data-start="0.9" data-track-index="13" data-volume="0.5"></audio>
      <audio id="a7a-s4" src="assets/sfx/click.wav" data-start="1.3" data-track-index="14" data-volume="0.55"></audio>
      <audio id="a7a-s5" src="assets/sfx/click.wav" data-start="1.8" data-track-index="15" data-volume="0.55"></audio>
      <audio id="a7a-s6" src="assets/sfx/click.wav" data-start="2.3" data-track-index="16" data-volume="0.55"></audio>
      <audio id="a7a-s7" src="assets/sfx/whoosh-grave.wav" data-start="2.7" data-track-index="17" data-volume="0.45"></audio>
      <audio id="a7a-s8" src="assets/sfx/impacto.wav" data-start="3.2" data-track-index="18" data-volume="0.65"></audio>
      <audio id="a7a-s9" src="assets/sfx/whoosh.wav" data-start="3.3" data-track-index="19" data-volume="0.45"></audio>
      <audio id="a7a-s10" src="assets/sfx/whoosh-grave.wav" data-start="4.9" data-track-index="20" data-volume="0.75"></audio>
      <audio id="a7a-s11" src="assets/sfx/pop-agudo.wav" data-start="5.5" data-track-index="21" data-volume="0.5"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      Kit.fundo(tl, 7.5);
      Kit.selo(tl, 0.1);

      // Bateria cheia
      tl.fromTo("#a7a-bateria", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, 0.3);
      tl.fromTo("#a7a-pct", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.5);

      // A pressão da crise empurra e a energia vai embora
      tl.fromTo(".a7a-seta", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, stagger: 0.1, ease: "power3.out" }, 0.9);
      tl.fromTo(".a7a-seta", { x: 0 }, { x: 14, duration: 0.25, yoyo: true, repeat: 9, ease: "sine.inOut", immediateRender: false }, 1.25);
      const proxy = { v: 100 };
      tl.to(proxy, { v: 4, duration: 2.0, ease: "power1.in", onUpdate: () => {
        const el = document.getElementById("a7a-pct");
        if (el) el.textContent = Math.round(proxy.v) + "%";
      } }, 1.1);
      tl.to("#a7a-r4", { opacity: 0, duration: 0.2 }, 1.3);
      tl.to("#a7a-r3", { opacity: 0, duration: 0.2 }, 1.8);
      tl.to("#a7a-r2", { opacity: 0, duration: 0.2 }, 2.3);
      tl.to(["#a7a-r1"], { attr: { fill: "#b8322a" }, duration: 0.2 }, 2.3);
      tl.fromTo("#a7a-r1", { opacity: 1 }, { opacity: 0.25, duration: 0.15, yoyo: true, repeat: 7, ease: "none", immediateRender: false }, 2.6);
      Kit.linha(tl, "#a7a-l1", 1.0);
      Kit.linha(tl, "#a7a-l2", 1.2);

      // Exaustão: a bateria cai
      tl.to("#a7a-bateria", { rotation: -8, y: 18, svgOrigin: "345 420", duration: 0.3, ease: "power2.in" }, 3.2);
      tl.to(".a7a-seta", { opacity: 0.35, duration: 0.3 }, 3.2);
      Kit.linha(tl, "#a7a-l3", 3.3);
      Kit.linha(tl, "#a7a-l4", 3.5);

      // Título da aula
      Kit.deslize(tl, 4.9);
      Kit.desenhar(tl, ".a7a-ic", 5.45, 0.55, 0.15);
      Kit.cartela(tl, 5.45);
      Kit.respiro(tl, "#a7a-cartela", 6.2, 1.3);

      window.__timelines["aula7-abertura"] = tl;
    </script>
  </body>
</html>
