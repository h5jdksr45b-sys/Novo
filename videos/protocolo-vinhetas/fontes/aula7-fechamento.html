    <script>
      const tl = gsap.timeline({ paused: true });
      Kit.fundo(tl, 8.5);
      Kit.selo(tl, 0.1);

      // A parede de pé; a pressão da crise chega e empurra
      tl.fromTo("#a7f-parede", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.25);
      tl.fromTo("#a7f-rot-parede", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4);
      tl.fromTo("#a7f-pressao", { x: -420 }, { x: 0, duration: 0.45, ease: "power3.in" }, 0.3);
      tl.fromTo("#a7f-parede", { x: 0 }, { x: 8, duration: 0.05, yoyo: true, repeat: 7, ease: "none", immediateRender: false }, 0.75);
      tl.fromTo("#a7f-pressao", { x: 0 }, { x: 10, duration: 0.3, yoyo: true, repeat: 13, ease: "sine.inOut", immediateRender: false }, 0.9);
      Kit.desenhar(tl, ".a7f-racha", 1.05, 0.25, 0.25);
      Kit.linha(tl, "#a7f-l1", 1.4);
      Kit.linha(tl, "#a7f-l2", 1.6);

      // As pausas cimentam as rachaduras e a contenção volta
      tl.fromTo(".a7f-pausa", { x: 180, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, stagger: 0.2, ease: "back.out(1.8)" }, 2.6);
      tl.to(".a7f-racha", { opacity: 0, duration: 0.3, stagger: 0.2 }, 2.85);
      tl.to("#a7f-muro", { attr: { fill: "#3fae8a" }, duration: 0.4 }, 3.4);
      tl.fromTo("#a7f-rot-ok", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, 3.5);
      tl.to("#a7f-pressao", { opacity: 0.55, duration: 0.6 }, 3.6);
      Kit.linha(tl, "#a7f-l3", 3.3);
      Kit.linha(tl, "#a7f-l4", 3.5);

      // Encerramento do protocolo
      Kit.deslize(tl, 4.8);
      Kit.desenhar(tl, ".a7f-ic", 5.4, 0.55, 0.2);
      Kit.cartela(tl, 5.4);
      Kit.assinatura(tl, 6.7);
      Kit.respiro(tl, "#a7f-cartela", 6.0, 2.5);
      tl.to(".fim", { opacity: 1, duration: 0.5, ease: "power1.in" }, 8.0);

      window.__timelines["aula7-fechamento"] = tl;
