    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var root = document.querySelector('[data-composition-id="06-limite"]');
        var q = function (s) {
          return root.querySelector(s);

        var qa = function (s) {
          return root.querySelectorAll(s);

        var tl = gsap.timeline({ paused: true });

        // Fixed geometry (line-height locked, explicit line breaks):
        var NEW_H = 4 * 54 + 48; // new bubble height
        var GAP = 24;
        var DOTS_H = 84;

        // ---- background mesh drift (whole shot) ----
        tl.fromTo(q(".l06-blob-a"), { x: 0, y: 0 }, { x: 140, y: 90, duration: 7, ease: "sine.inOut" }, 0);

        tl.fromTo(q(".l06-blob-c"), { x: 0, y: 0 }, { x: 120, y: -70, duration: 7, ease: "sine.inOut" }, 0);

        // ---- camera: one slow push toward the thread ----
        tl.fromTo(q(".l06-world"), { scale: 1 }, { scale: 1.03, duration: 7, ease: "sine.inOut" }, 0);

        // ---- Scene 1 (0.0-0.8): label chip swaps in ----
        tl.fromTo(q(".l06-shield-chip"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.05);
        tl.fromTo(q(".l06-shield-path"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 0.12);
        tl.fromTo(q(".l06-label-bg"), { scaleX: 0.16, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.18);
        tl.fromTo(qa(".l06-label-text .l06-word"), { x: -36, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.07 }, 0.3);

        // phone settles (already on screen, continuing thread)
        tl.fromTo(q(".l06-phone"), { y: 24 }, { y: 0, duration: 0.6, ease: "power3.out" }, 0);

        // stack starts with the new bubble hidden below the view
        tl.fromTo(q(".l06-stack"), { y: NEW_H + GAP }, { y: NEW_H + GAP - (DOTS_H + GAP), duration: 0.45, ease: "power3.out" }, 0.8);
        tl.fromTo(q(".l06-new"), { opacity: 0, scale: 0.7, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.55);
        tl.fromTo(q(".l06-clock"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 2.05);

        // caret blinks in the empty composer until submit (finite, discrete)
        var caret = q(".l06-caret");
        [0.0, 0.5, 1.0].forEach(function (t) {
          tl.set(caret, { opacity: 1 }, t);
          tl.set(caret, { opacity: 0 }, t + 0.25);
        });
        tl.set(caret, { opacity: 1 }, 1.6);

        // ---- Scene 2 (0.8-2.6): typing dots, submit, bubble lands, clock pops ----
        var dots = q(".l06-dots");
        tl.fromTo(dots, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0.85);
        var dotEls = qa(".l06-dot");
        for (var c = 0; c < 2; c++) {
          tl.fromTo(dotEls, { y: 0 }, { y: -10, duration: 0.14, ease: "sine.out", stagger: 0.08 }, 0.95 + c * 0.32);
          tl.to(dotEls, { y: 0, duration: 0.14, ease: "sine.in", stagger: 0.08 }, 1.09 + c * 0.32);
        }
        // submit press dip on send button
        tl.to(q(".l06-send"), { scale: 0.86, duration: 0.08, ease: "power2.in" }, 1.45);
        tl.to(q(".l06-send"), { scale: 1, duration: 0.3, ease: "power3.out" }, 1.53);
        // swap: dots out, bubble in, thread scrolls up
        tl.set(dots, { opacity: 0 }, 1.55);
        tl.set(q(".l06-prev-tail"), { opacity: 0 }, 1.55);
        tl.to(q(".l06-stack"), { y: 0, duration: 0.5, ease: "expo.out" }, 1.55);

        // clock: minute hand sweeps a third of a turn (20 minutes)
        tl.fromTo(q(".l06-hand-min"), { rotation: 0, svgOrigin: "12 12" }, { rotation: 120, svgOrigin: "12 12", duration: 1.8, ease: "power2.inOut" }, 2.25);
        tl.fromTo(q(".l06-hand-hr"), { rotation: 0, svgOrigin: "12 12" }, { rotation: 10, svgOrigin: "12 12", duration: 1.8, ease: "power2.inOut" }, 2.25);
        // highlight on 20 minutos
        tl.fromTo(q(".l06-hl-bg"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 2.3);

        // ---- Scene 3 (2.6-4.0): safety card slides up ----
        tl.fromTo(q(".l06-card"), { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 2.6);
        tl.fromTo(q(".l06-siren-chip"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 2.8);
        tl.fromTo(qa(".l06-line"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.15 }, 2.85);

        var rays = qa(".l06-ray");
        tl.fromTo(rays, { opacity: 0 }, { opacity: 1, duration: 0.18, stagger: 0.04, ease: "power2.out" }, 3.2);
        tl.to(rays, { opacity: 0.25, duration: 0.2, ease: "power1.inOut" }, 3.6);
        tl.to(rays, { opacity: 1, duration: 0.2, ease: "power1.inOut" }, 3.85);

        tl.fromTo(q(".l06-ul-bar"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 4.3);

        tl.to(q(".l06-shield-chip"), { scale: 1, duration: 0.35, ease: "power2.inOut" }, 5.55);
